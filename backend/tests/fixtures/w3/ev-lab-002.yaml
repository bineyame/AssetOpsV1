      unit: kW
      source: SITE
      source_version: 1
    - property_key: ev-connector-enabled
      value: ENABLED
      unit: state
      source: SITE
      source_version: 1
    - property_key: ev-meter-resolution
      value: 0.001
      unit: kWh
      source: SITE
      source_version: 1
    - property_key: ev-meter-error-bound
      value: 0.001
      unit: kWh
      source: SITE
      source_version: 1
    - property_key: ev-status-cadence
