# W3-02 c3-q1 (test-only): EV-LAB-002, the second imported EV Site for the persisted two-Site Financials
# comparability proof. Derived from the reviewed tests/fixtures/w2/ev-lab-001.yaml; device IDs stay the
# ev-publication/1 profile channels, under this Site's own gateway (edge-ev-lab-002).
site_id: EV-LAB-002
display_name: EV charging lab 2
site_type: EV_CHARGING
