  control_assumptions:
  - assumption_id: solar-first-dispatch
    display_name: Solar is dispatched before the generator
    component_id: null
    basis: SITE
    statement: The archetype assumes photovoltaic output is consumed or stored before the diesel generator is called
      on. This is a declared assumption about intended operation; the typed source-priority Site Control is what
      a controller reads.
  - assumption_id: clinic-protected
    display_name: The clinic is protected first
    component_id: load-clinic
    basis: SITE
    statement: The archetype assumes the clinic keeps supply when nothing else can. The typed critical-load-priority
      Site Control is what a controller reads; this sentence is documentation of the intent.
  site_controls:
  - control_key: source-priority
    members:
    - pv-array
    - battery
    - generator
    source: SITE
    source_version: 1
  - control_key: critical-load-priority
    members:
    - load-clinic
    - load-res
    - load-mill
    source: SITE
    source_version: 1
