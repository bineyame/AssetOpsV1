  version: 1
  valid_from: '2026-10-01T00:00:00Z'
  summary: 'W4-02 authored mini-grid depth demonstration Site (D-2026-10-20-w4-02-buildspec closure 4 S5, closure
    5): solar-plus-storage with a diesel generator and three metered feeders, plus the request, charge-obligation,
    primary-supply and backup-chain channels of minigrid-roles-4. Configuration only: nothing here says any reading
    has been observed.'
