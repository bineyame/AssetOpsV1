# W4-02 MG-W402-001 (D-2026-10-20-w4-02-buildspec closure 4 S5, closure 5): the isolated authored mini-grid
# depth demonstration Site. Its own Foundation, gateway, sources and minigrid-roles-4 binding publication
# (backend/conversions/mg-w402-001-minigrid-roles-4.json); never KOBO-001. Installed by
# `python -m assetops_backend.sites.w402_demo --tenant demo`.
site_id: MG-W402-001
