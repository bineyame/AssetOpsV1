[project]
name = "assetops-backend"
version = "0.0.0"
description = "AssetOps FastAPI backend root (modular monolith)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    # The IANA time zone database, for `zoneinfo`. Declared rather than left
    # to the host: Windows ships no system database, and without this
    # `available_timezones()` finds nothing - so a membership test would
    # refuse every real zone on one of the two platforms this is developed on.
    "tzdata>=2024.1",
    # S1-01: the product Foundation store is PostgreSQL 16 (docker-compose.yml).
    # psycopg 3 is the driver, SQLAlchemy Core builds statements, and Alembic
    # owns every DDL change; application startup never creates a table.
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assetops_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
