 mini:Array.from({length:30},(_,i)=>i===29?{gen:4,c:.5,u:.5,br:0,cov:92}:{gen:3.5+((i*37)%7)*.25,c:((i*11)%5)*.25,u:i%4===1?.25:0,br:[3,9,12,17,24].includes(i)?1:0,cov:88+((i*13)%12)}),

 if(domain==='cold'){const mins=p.days?p.days*1440:60,pct=m=>`${(Math.floor((1-m/mins)*1000)/10).toFixed(1)}`;
  return [['Grid outages',String(p.out)],['Automatic starts that worked',`${p.ok} of ${p.out}`],['Temperature excursions',String(p.exc)],['Time above 4°C',p.exc?'25–35 min':'0 min'],['In policy',p.exc?(p.days?`${pct(35)}–${pct(25)}%`:'42–58%'):'100%'],['Readings received',`${Math.round(p.cov)}%`]];}

let previousFocus;
function drawer(title,body,wide=false){
 previousFocus=document.activeElement;
 $('#overlay').innerHTML=`<div class="modal-backdrop"><section class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-header"><div><div class="eyebrow">ASSETOPS · SCREEN REVIEW</div><h2 id="drawer-title">${title}</h2></div><button class="close" aria-label="Close drawer" data-close>✕</button></div>${body}</section></div>`;
 document.body.style.overflow='hidden'; $('[data-close]').focus();
}
function closeDrawer(){ $('#overlay').innerHTML=''; document.body.style.overflow=''; if(previousFocus?.isConnected)previousFocus.focus(); }
function evidenceDrawer(type='dispatch',interval=null){
 if(type==='renewable'){
  drawer('Productive-use opportunity evidence',status(badge('Scenario opportunity','green'),'Separate five-day evaluation window')+panel('Eligible-window basis',table(['Input','Accepted / declared value','Role'],[['PV capability','42 kW with ±1 kW bound','Available renewable supply'],['PV delivered','20 kW · one-minute means','Observed use'],['Operating margin','3 kW · public policy','Retained headroom'],['Storage acceptance','0 kW in eligible windows','No competing charge obligation'],['Critical service','Covered in eligible windows','Service guardrail']]))+panel('Bounded translation',`<p class="prose">[41, 43] − 20 − 3 = <strong>18–20 kW</strong> usable headroom. A 10 kW grain-mill load for one hour represents <strong>10 kWh</strong> and <strong>$2.50 scenario gross sales</strong> at $0.25/kWh.</p>`)+notice('Three of five observed days qualify. Electrical feasibility does not establish customer demand, collections or net profit.')+`<p>v6.9 8.23 / 8.37 · RenewableOpportunityWindow owns the opportunity; Site Financials owns the tariff translation.</p>`,true);return;
 }
 if(type==='battery'){
  drawer('Battery condition evidence',status(badge('Watch','amber'),'Separate 30-day illustration · capacity unverified')+panel('Supported stress observations',table(['Measure','Observed / configured','Limit'],[['Reserve exposure','5 below-reserve events','Exposure is not capacity loss'],['High-power exposure','3 high-power periods','Temperature context incomplete'],['Configured capacity','200 kWh nameplate','Not a measured capacity test'],['Remaining useful life','Not assessed','No validated lifecycle model / test basis']]))+notice('No precise remaining-life or measured capacity percentage is supported. Obtain temperature coverage and a controlled capacity test.')+`<p>v6.9 8.27 / 8.37 · BatteryStressWindow and CapacityEvidence own these separate assessments.</p>`,true);return;
 }
 const cold=type==='cold'||type==='temperature',ev=type==='ev';
 const windowLabel=interval===null?'14:20–15:20':['14:20–14:35','14:35–14:50','14:50–15:05','15:05–15:20'][interval];
 const indeterminate=interval===1||interval===2;
 const title=cold?'Temperature / backup evidence':ev?'Charging session evidence':`Generator support · ${windowLabel}`;
 const sampleIndex=interval===null?0:interval;
 const sampleTime=['14:20','14:35','14:50','15:05'][sampleIndex];
 const sampleSoc=[74,77.5625,81.125,84.6875][sampleIndex];
 const sampleUtc=['11:20','11:35','11:50','12:05'][sampleIndex];
 const publishUtc=sampleIndex===1?'11:37':sampleUtc;
 const rows=cold?[['TMP-003','temperature','19:19:00 EAT','8.2 °C'],['GEN-CR-01','start_result','19:11:10 EAT','failed'],['CMP-003','running','19:15:00 EAT','true']]:ev?[['CHG-002','session_id','14:03–14:11 EAT','SES-011'],['CHG-002','energy_delta','14:11 EAT','3.6 kWh'],['CHG-002','outcome','14:11 EAT','fault-interrupted']]:[['battery-pcs-controller','state-of-charge','14:20:00 EAT','74.000%'],['generator controller','ac-power','14:20:00 EAT','18.0 kW'],['PV inverter','available-power','14:20:00 EAT','42.0 kW'],['3 feeder meters','delivered-load total','14:20:00 EAT','30.0 kW'],['battery-pcs-controller','discharge-capability','14:50:00 EAT','Missing']];
 if(!cold&&!ev){rows.slice(0,4).forEach(r=>r[2]=`${sampleTime}:00 EAT`);rows[0][3]=`${sampleSoc}%`;if(interval===0||interval===3)rows[4]=['battery-pcs-controller','discharge-capability',`${sampleTime}:00 EAT`,'30 kW'];}
 const sample=cold?`site_id: CR-DEMO-01\ncomponent_id: TMP-003\nsignal_id: chamber.temperature\nvalue: 8.2\nunit: degC\nsource_time: 2026-10-06T16:19:00Z\nsource_kind: simulated\nmapping_version: cold-v1`:ev?`site_id: EV-DEMO-01\ncomponent_id: CHG-002\nsignal_id: session.energy_delta\nsession_id: SES-011\nvalue: 3.6\nunit: kWh\nsource_kind: simulated\nmapping_version: ev-v1`:`site_id: MG-DEMO-01\ncomponent_id: BAT-001\ndevice_id: BMS-001\nsignal_id: battery.soc\nvalue: 74.0\nunit: percent\nsource_time: 2026-10-06T11:20:00Z\npublished_at: 2026-10-06T11:20:05Z\nsource_kind: simulated\nmapping_version: mg-v3\nmessage_id: RUN-042/BMS-001/soc/172\nevidence_id: EV-SOC-1420`;
 drawer(title,
  status(badge(indeterminate?'Indeterminate':'Evidence limited','amber'),'Illustrative accepted-evidence bundle')+
  `<h3>What this supports</h3><p>${cold?'An observed temperature excursion and failed automatic-start sequence.':ev?'A session interruption with 3.6 kWh delivered.':indeterminate?'This interval is indeterminate because a required PCS capability endpoint is missing.':'Thirty minutes of candidate runtime across supported intervals. This is a feasibility assessment, not verified avoidable operation.'}</p>`+
  (cold?'':`<p style="margin:10px 0 4px">${conf(ev?'f130':'f104')}</p>`)+`<h3>Evidence chain</h3>${table(['Input','What was seen','Basis'],cold?[['Grid supply','Lost at 19:11','Measured'],['Start request','Sent 19:11:05','Measured'],['Generator','Start failed 19:11:10','Measured'],['Manual start','19:14','Operator record'],['Transfer switch','No position record','Unknown · not mapped'],['Chamber','Peak 8.2°C at 19:19','Measured']]:ev?[['Session start','SES-011 · 14:03','Measured'],['Energy','3.6 kWh','Measured'],['Stop','Fault event 14:11','Measured'],['SES-012 end','Not received','Unknown']]:[['Solar available','42 kW','Measured'],['Battery charge',`${sampleSoc}%`,'Measured'],['Battery output limit',indeterminate?'Missing at 14:50':'30 kW','Measured'+(indeterminate?' · gap':'')],['Generator','Running at 18 kW','Measured'],['Operator override','None recorded','Observed absence']])}${cold||ev?'':`<h3>Settings at the time</h3>${kv([['Battery reserve','30% · site policy v4'],['Generator start / stop','35% / 90% · v4'],['Minimum running time','30 min · v4'],['Approvals or overrides','None recorded']])}`}<h3>Accepted observations</h3>${table(['Device','Signal','Source time','Value'],rows)}`+
  `<h3>Where it came from</h3>${kv([['Source','Site gateway · demo data'],['Checks','Validated and accepted'],['Timing','Measured time kept; late reports marked']])}`+
  `<details class="tech"><summary>Technical record (for engineers)</summary><pre class="code">${cold||ev?sample:`schema_version: 2\nsite_id: MG-DEMO-01\nsource_id: src-R-MG-01\ngateway_id: gw-MG-01\ndevice_id: battery-pcs-controller\nsignal_id: state-of-charge\nfamily: MEASUREMENT\nmeasurement: STATE_AT_INSTANT\nvalue: "${sampleSoc}"\nunit: "%"\nsource_time: 2026-10-06T${sampleUtc}:00Z\npublished_at: 2026-10-06T${publishUtc}:03Z\nmapping: simulator-lab-gateway-dispatch / v1`}</pre><p class="chart-note">The wire document is nested and carries a computed message identity. Ingestion assigns received_at; historical public configuration binds source identity to its component.</p></details>`+
  `<h3>Limits and uncertainty</h3><p>${cold?'Probe coverage and product/loading context are incomplete. No spoilage conclusion follows.':ev?'One session has no complete end record and is excluded from energy and outcome totals. Lost revenue is not assessed.':'The missing 14:50 PCS capability affects two adjacent intervals. Delayed 14:35 SOC is accepted at 16:00 with its original source timestamp. Sparse observations do not prove continuous operation.'}</p>`+
  `<h3>Canonical basis / owner</h3><p>v6.9 8.35 / 8.37 · AcceptedEvidence → EvidenceBundle → bounded analytic claim.</p><p style="margin-top:16px">${btn(cold?'cold-evidence':ev?'ev-evidence':'evidence','Open site evidence',true)}</p>`,true);
}
function storedNotes(){try{return JSON.parse(localStorage.getItem('assetops-v69-review-notes')||'{}');}catch{return {};}}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function reviewNotes(){const s=currentScreen(),notes=storedNotes();drawer('Canonical basis & review',
 (s.id==='portfolio'?portfolioDesignNotes():'')+`<p><strong>${s.title}${s.section?' / '+s.section:''}</strong></p><div class="review-section"><strong>Canonical basis</strong><p>v6.9 ${s.anchor}</p></div>${[['Primary user question',s.question],['Preserved',s.preserved],['Adapted',s.adapted],['Deferred',s.deferred],['Content owners / query models',s.models.join(' · ')]].map(([t,b])=>`<div class="review-section"><strong>${t}</strong><p>${b}</p></div>`).join('')}<label class="field">Your review notes<textarea id="review-note" rows="5" placeholder="What should change before implementation?">${escapeHtml(notes[s.id]||'')}</textarea><small>Saved in this browser only. Export to share with the Planner.</small></label><div class="form-footer"><button class="button primary" data-export-notes>Export review notes</button><a class="button" href="../../docs/architecture/assetops-v69-pivot-recommendation.md" target="_blank">Architecture specification ↗</a></div>`,true);}
function screenIndex(){drawer('Screen index',`<p style="margin-bottom:18px">Start with Portfolio, then follow a site into its Finding, financial consequence and verification. Cold-chain and EV charging use the same Site shell.</p><div class="screen-grid">${SCREENS.filter(s=>s.book!==false).map(s=>link(s.id,`<strong>${s.title}</strong><small>${s.root}${s.section?' / '+s.section:''}</small><small>v6.9 ${s.anchor}</small>`,'screen-tile')).join('')}</div>`,true);}
function toast(message){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=message;document.body.appendChild(e);setTimeout(()=>e.remove(),4500);}
document.addEventListener('click',e=>{
 if(document.querySelector('.conf-pop')&&!e.target.closest('.conf-pop,[data-conf]'))document.querySelector('.conf-pop').remove();
 if(stage.rangeOpen&&!e.target.closest('.range-picker')){stage.rangeOpen=false;document.querySelector('.range-pop')?.remove();document.querySelector('[data-range-toggle]')?.setAttribute('aria-expanded','false');}
 const el=e.target.closest('button,a');
 if(e.target.classList.contains('modal-backdrop'))closeDrawer();
 if(!el)return;
 if(el.hasAttribute('data-close'))closeDrawer();
 if(el.hasAttribute('data-notes'))reviewNotes();
 if(el.hasAttribute('data-index'))screenIndex();
 if(el.hasAttribute('data-portfolio-lens')){
  document.querySelectorAll('[data-portfolio-lens]').forEach(x=>{x.classList.toggle('active',x===el);x.setAttribute('aria-pressed',String(x===el));});
  $('#portfolio-findings').innerHTML=portfolioRows(el.dataset.portfolioLens);
  const n=document.querySelectorAll('#portfolio-findings tbody tr').length;$('#portfolio-result-count').textContent=`${n} finding${n===1?'':'s'}`;
 }
 if(el.hasAttribute('data-portfolio-scope'))drawer('Portfolio scope & consequence ownership',
  panel('Selected examples',table(['Site / assessment','Period','Scope'],[['Kobo dispatch','6 Oct · 14:20–15:20 EAT','One-hour operating window'],['GreenHarvest','6 Oct · 19:00–20:00 EAT','Temperature / backup sequence'],['Depot','6 Oct · 08:00–16:00 EAT','Session, energy and availability'],['Kobo opportunity','Separate five-day study','3 eligible one-hour windows'],['Kobo battery','Separate 30-day illustration','Stress exposure; capacity unverified']]))+
  panel('Assessment rule',`<p class="prose">Needs attention rolls up the three current operational site assessments. Site evidence quality remains a separate dimension. Due and overdue counts are withheld because due dates are not established in this fixture.</p>`)+
  panel('Value ownership',`<p class="prose">Portfolio displays the same site consequence revisions, with their periods, units, currency and basis. The $0.40 scenario maintenance accrual is already included in Kobo’s ${money()} cost exposure. It is not a second additive saving.</p>`)+
  notice('This review combines clearly labelled example periods. It is not a comparable full-month portfolio total. No monthly extrapolation or asset valuation is invented.','blue'),true);
 if(el.hasAttribute('data-portfolio-progress'))drawer('Change and verification basis',
  panel('Workflow facts in this review',table(['Source object','Recorded fact','Outcome meaning'],[['Maintenance work','One inspection completed','Activity only; witnessed test absent'],['Policy trial','One execution example with incomplete guardrails','Verification pending'],['Verification outcomes','No complete verified outcome in the selected examples','No verified recovered value established']]))+
  notice('No previous comparable portfolio snapshot exists, so week-over-week deltas and recovered-value trends are withheld. The complete-evidence verification drawer elsewhere is a separate teaching example, not an accepted outcome here.','blue')+
  `<p>v6.9 8.1 / 8.34 / 8.38. Counts come from retained workflow events and outcome records; Portfolio does not decide resolution.</p>`,true);
 if(el.dataset.claim)evidenceDrawer(el.dataset.claim);
 if(el.hasAttribute('data-interval')){stage.selected=Number(el.dataset.interval);render();evidenceDrawer('dispatch',stage.selected);}
 if(el.dataset.conf){if(document.querySelector('.conf-pop')?.dataset.for===el.dataset.conf){document.querySelector('.conf-pop').remove();return;}openConf(el);document.querySelector('.conf-pop').dataset.for=el.dataset.conf;return;}
 if(el.dataset.newAction){document.querySelector('.conf-pop')?.remove();newActionDrawer(el.dataset.newAction);return;}
 if(el.hasAttribute('data-create-example')){closeDrawer();toast('Example only: no action was created in this mock-up.');return;}
 if(el.closest('.conf-pop')&&el.getAttribute('href'))document.querySelector('.conf-pop').remove();
 if(el.dataset.tpl){stage.tpl=el.dataset.tpl;render();return;}
 if(el.hasAttribute('data-tpl-create')){toast('Example only: a draft site would be created from the template and opened in the form.');return;}
 if(el.hasAttribute('data-site-activate')){toast('Example only: the site would become active with assessment Unknown and these gaps in Readiness.');return;}
 if(el.dataset.batchDownload){toast(`Example only: the ${el.dataset.batchDownload.toUpperCase()} template would download.`);return;}
 if(el.dataset.batchFix){stage.batchFixed=[...new Set([...stage.batchFixed,Number(el.dataset.batchFix)])];render();return;}
 if(el.hasAttribute('data-batch-import')){stage.batchDone=true;render();return;}
 if(el.hasAttribute('data-batch-reset')){stage.batchDone=false;stage.batchFixed=[];render();return;}
 if(el.hasAttribute('data-batch-errors')){toast('Example only: a file listing the skipped rows and their messages would download.');return;}
 if(el.dataset.assetFilter){document.querySelectorAll('[data-asset-filter]').forEach(x=>x.classList.toggle('active',x===el));$('#asset-table').innerHTML=assetsIndex(el.dataset.assetFilter);return;}
 if(el.dataset.fstate){document.querySelectorAll('[data-fstate]').forEach(x=>x.classList.toggle('active',x===el));$('#findings-table').innerHTML=findingRows(el.dataset.flens,el.dataset.fstate);return;}
 if(el.dataset.recType){document.querySelectorAll('[data-rec-type]').forEach(x=>x.classList.toggle('active',x===el));$('#oprec-table').innerHTML=opRows(el.dataset.recType);return;}
 if(el.hasAttribute('data-reg-save')){toast('Example only: draft not saved in this mock-up.');return;}
 if(el.hasAttribute('data-reg-submit')){toast('Validation would flag the amber checks; the asset stays a draft until they are resolved.');return;}
 if(el.hasAttribute('data-rec-submit')){toast('Example only: the reading would go to review, then feed the fuel balance as an Operator record.');return;}
 if(el.hasAttribute('data-policy-save')){toast(`Example only: verification window v4 (${$('#vw-days').value} days) would apply to new plans from now.`);return;}
 if(el.hasAttribute('data-range-toggle')){stage.rangeOpen=!stage.rangeOpen;render();return;}
 if(el.hasAttribute('data-range')){stage.range.preset=el.dataset.range;stage.rangeOpen=true;render();return;}
 if(el.hasAttribute('data-range-apply')){const f=$('#range-from').value,t=$('#range-to').value;if(!f||!t||f>t||f<DAY_MIN||t>DAY_MAX){toast('Choose a start and end between 7 Sep and 6 Oct 2026, start first.');return;}stage.range={preset:'custom',from:f,to:t};stage.rangeOpen=true;render();return;}
 if(el.hasAttribute('data-site-lens')){
  document.querySelectorAll('[data-site-lens]').forEach(x=>{x.classList.toggle('active',x===el);x.setAttribute('aria-pressed',String(x===el));});
  $('#site-findings').innerHTML=siteFindingRows(el.dataset.siteDomain,el.dataset.siteLens);
 }
 if(el.hasAttribute('data-site-filter')){
  document.querySelectorAll('[data-site-filter]').forEach(x=>x.classList.toggle('active',x===el));
  $('#site-table').innerHTML=siteTable(el.dataset.siteFilter);
 }
 if(el.hasAttribute('data-finding-filter')){
  document.querySelectorAll('[data-finding-filter]').forEach(x=>x.classList.toggle('active',x===el));
  const filter=el.dataset.findingFilter;
  $('#findings-table').innerHTML=filter==='All'?findingsTable():filter==='Opportunities'?table(['Site','Finding','Consequence','Basis'],[[link('mini','Kobo'),link('renewable','F-109 · Productive-use window'),'10 kWh shift scenario · $2.50 gross tariff','Scenario; no realised revenue']]):table(['Site','Finding','Consequence','Evidence'],[[link('cold','GreenHarvest'),link('cold-finding','F-118 · Backup response failure'),'Temperature exposure; loss unknown','Limited'],[link('cold','GreenHarvest'),link('cold-finding-excursion','F-119 · Temperature excursion'),'25–35 min above 4°C; no spoilage determination','Limited'],[link('ev','Depot'),link('ev-finding','F-130 · Interrupted charging session'),'Root cause and lost revenue unknown','Limited'],[link('mini','Kobo'),link('evidence','F-108 · Battery output-limit report missing'),'30 min cannot be classified','Limited']]);
 }
 if(el.hasAttribute('data-save-price')){const val=Number($('#fuel-price').value);if(!Number.isFinite(val)||val<=0||val>20){toast('Enter a fuel price above 0 and no greater than $20/L.');return;}stage.price=val;render();toast('Scenario fuel assumption updated across Site Financials and Portfolio.');}
 if(el.hasAttribute('data-accept')){stage.accepted=true;location.hash='/action-overview';toast('Example recommendation accepted as ACT-048. Verification remains separate.');}
 if(el.hasAttribute('data-verified-example'))drawer('Verified outcome · separate example',status(badge('Verified improvement','green'),'Complete-evidence example · not the pending window')+panel('All criteria satisfied',table(['Criterion','Evidence result'],[['Candidate runtime','30 → 0 min · matched operating window'],['Service','No new unmet load · full metering coverage'],['Reserve','No breach · complete SOC / power evidence'],['Comparability','Load, resource and starting SOC within declared tolerance']]))+notice('A verified result requires the entire declared evidence set. This separate example shows the target presentation; the main action remains pending.','blue')+`<p>v6.9 8.38 · VerificationOutcome owns the decision. Completing the work alone never sets this state.</p>`,true);
 if(el.hasAttribute('data-export-notes'))download('AssetOps-v69-review-notes.json',JSON.stringify({artifact:'AssetOps v6.9 mockup review',exported_at:new Date().toISOString(),notes:storedNotes()},null,2));
 if(el.getAttribute('href')?.startsWith('#/')){closeDrawer();if(location.hash===el.getAttribute('href'))render();}
});
document.addEventListener('change',e=>{if(e.target.id==='site-switch'){location.hash='/'+equivalentScreen(currentScreen(),e.target.value);return;}if(e.target.id==='screen-select'){stage.view='populated';location.hash='/'+e.target.value;}if(e.target.id==='view-select'){stage.view=e.target.value;render();}});
document.addEventListener('input',e=>{
 if(e.target.id==='review-note'){const notes=storedNotes();notes[currentScreen().id]=e.target.value;try{localStorage.setItem('assetops-v69-review-notes',JSON.stringify(notes));}catch{toast('Browser storage unavailable. Copy your note before closing.');}}
 if(e.target.id==='fuel-price'&&$('#price-preview')){const p=Number(e.target.value);$('#price-preview').textContent=Number.isFinite(p)&&p>0?`Fuel-only estimate: $${(2.43*p).toFixed(2)}–${(2.97*p).toFixed(2)} before maintenance accrual`:'Enter a valid price.';}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.querySelector('.conf-pop')){document.querySelector('.conf-pop').remove();return;}
 if(e.key==='Escape'&&stage.rangeOpen){stage.rangeOpen=false;render();$('[data-range-toggle]')?.focus();return;}
 const d=$('.drawer');if(!d)return;
 if(e.key==='Escape'){closeDrawer();return;}
 if(e.key==='Tab'){const f=[...d.querySelectorAll('button,a[href],input,select,textarea')],first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
window.addEventListener('hashchange',()=>{stage.view='populated';stage.rangeOpen=false;render();window.scrollTo(0,0);});
window.mockupManifest=SCREENS.map(({render,...meta})=>meta);
render();
