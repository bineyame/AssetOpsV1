</style></head><body><div id="app"></div><div id="overlay"></div><script>/* Portfolio composition: presentation of site-owned results, never a second analytic. */
const portfolioReview = {
 references:['v6.9 §8.1, p24: Portfolio command center','Client Demo Recommendation, Screen 1 and Appendix A1, p11'],
 decision:'v7.0 (commercial capability architecture rev 5, owner decision 29 Oct 2026): the objective matrix becomes four outcome-category rows (owner-approved change); four outcome cards replace the value cards, each with its icon and definition; ranked rows say which outcome each finding moves; signals not yet priced appear beside the evidence prompt. Everything else is the v6.9 Portfolio.',
 sections:[
  ['Assessment and estate scope','PortfolioSummary','Deterministic roll-up of selected site assessments; no numeric composite health score.'],
  ['Value cards','PortfolioConsequenceRollup','Reuse site consequence revisions, periods, currencies and basis. Different categories are not additive.'],
  ['Ranked Findings','FindingIndex + ActionSummary','Priority orders Finding objects. Site, Finding and accepted Action links change to their own roots.'],
  ['Outcomes across the estate','Outcome status per site (rev 5 §4.2, §6.1)','One cell per site and outcome: its own outcome, status from the seven-state rule, and Declared where an objective is set. Not assessed yet and not applicable remain distinct.'],
  ['Productive-use opportunity','RenewableOpportunityWindow + FinancialConsequence','Reuse eligible window and declared tariff; electrical headroom is not proven demand.'],
  ['Change and verification','FindingRevision + WorkSummary + VerificationSummary','Event counts and outcome state are separate; activity completion cannot establish recovered value.']
 ],
 deferred:'Six-site estate, monthly extrapolation, productive-use share, comparable energy roll-up, asset valuation, reconciliation residual and verified recovered money require their own supporting records. None is inferred from this hour.',
};
function portfolioDesignNotes(){return `<div class="review-section"><strong>Portfolio revision · reference comparison</strong><p>${portfolioReview.references.join('<br>')}</p><p style="margin-top:10px">${portfolioReview.decision}</p><p style="margin-top:10px"><a href="../../../../frontend/mockups/v70/previews/portfolio-previous.png" target="_blank">Compare the previous Portfolio mockup ↗</a></p></div><details class="review-section"><summary>Section ownership for implementation</summary>${table(['Visible section','Owner / read model','Contract'],portfolioReview.sections)}</details>`;}
function portfolioRows(lens='All priorities'){
 const rows=[
  {kind:'Risks',site:'cold',name:'Thika',domain:'Cold-chain',finding:'cold-finding',title:'Backup response failed',id:'F-118',mechanism:'Automatic start failed; cooling interrupted',impact:'Product conditions exposed',basis:'Measured peak 8.2°C · loss unpriced',window:'6 Oct · 19:00–20:00',priority:'High',tone:'red',confidence:'High',limit:'Observed sequence',action:'cold-action',actionId:'ACT-051',actionTitle:'Witness automatic-start test',next:'Witness an automatic-start test',state:'Open'},
  {kind:'Cost',site:'mini',name:'Kobo',domain:'Mini-grid',finding:'finding',title:'Extended generator support',id:'F-104',mechanism:'30 min candidate; charging trade-off remains',impact:money(),basis:'Modelled fuel + scenario maintenance',window:'6 Oct · 14:20–15:20',priority:'High',tone:'amber',confidence:'Low',confKey:'f104',limit:'PCS capability gap',action:'verification',actionId:'ACT-048',actionTitle:'Generator stop trial',next:'Verify the policy trial',state:'Outcome pending'},
  {kind:'Risks',site:'ev',name:'Ruiru',domain:'EV charging',finding:'ev-finding',title:'Charging session interrupted',id:'F-130',mechanism:'Fault-aborted session; root cause unknown',impact:'1 interrupted session',basis:'Measured events · revenue loss unpriced',window:'6 Oct · 08:00–16:00',priority:'Medium',tone:'blue',confidence:'Medium',confKey:'f130',limit:'1 other outcome unknown',action:'ev-action',actionId:'ACT-061',actionTitle:'Investigate connector 2',next:'Investigate connector 2',state:'Open'},
  {kind:'Risks',site:'cold',name:'Thika',domain:'Cold-chain',finding:'cold-finding-excursion',title:'Temperature excursion',id:'F-119',mechanism:'Chamber above 4°C after backup failed',impact:'25–35 min above policy',basis:'Measured peak 8.2°C · no spoilage determination',window:'6 Oct · 19:00–20:00',priority:'Medium',tone:'blue',confidence:'High',limit:'Stock and loading not recorded',action:null,next:'Record stock and connect the door log',state:'Open'},
  {kind:'Risks',site:'mini',name:'Kobo',domain:'Mini-grid',finding:'evidence',title:'Battery output-limit report missing',id:'F-108',mechanism:'One 14:50 report absent from the battery controller',impact:'30 min unclassified',basis:'Evidence gap · limits F-104',window:'6 Oct · 14:20–15:20',priority:'Medium',tone:'blue',confidence:'High',limit:'Reporting cause unknown',action:'sitework',actionId:'ACT-049',actionTitle:'Restore battery-limit reporting',next:'Restore battery-limit reporting',state:'Open'},
  {kind:'Opportunities',site:'mini',name:'Kobo',domain:'Mini-grid',finding:'opportunity-finding',title:'Productive-use headroom',id:'F-109',mechanism:'Recurring renewable capacity available',impact:'18–20 kW usable',basis:'Modelled headroom · $2.50 scenario sales',window:'Separate 5-day study · 3 eligible days',priority:'Medium',tone:'green',confidence:'Medium',confKey:'f109',limit:'Limited evidence: demand not measured yet',action:null,next:'Evaluate a 10 kW productive load',state:'Recommendation'}
 ].filter(r=>lens==='All priorities'||r.kind===lens);
 return table(['Site','Finding / operating mechanism','Value / consequence','Priority','Confidence','Action / next move'],rows.map(r=>[
  `${link(r.site,r.name,'strong')}<small>${r.domain}</small>`,
  `${link(r.finding,r.title,'strong')}<small>${r.id} · ${r.mechanism}</small>${affectsPill(r.id)}`,
  `<strong class="impact ${r.tone}">${r.impact}</strong><small>${r.basis}</small><small>${r.window}</small>`,
  badge(r.priority,r.priority==='High'?'amber':'blue'),`${r.confKey?conf(r.confKey,''):badge(r.confidence)}<small>${r.limit}</small>`,
  `${r.action?link(r.action,`${r.actionId} · ${r.actionTitle}`,'strong'):`${link(r.finding,'Review recommendation','strong')} <span class="oc-noact">· No action agreed yet</span>`}<small>${r.next}</small><span class="workflow-text">${r.state}</span>`
 ]));
}
function portfolioValue(label,value,detail,basis,target,tone,ico){return `<a class="value-card ${tone}" href="#/${target}"><div class="value-label">${icon(ico)}<span>${label}</span>${icon('arrow')}</div><div class="value-number">${value}</div><p>${detail}</p><div class="value-basis">${basis}</div></a>`;}

 ['Service / product',objectiveCell('Unknown','unknown','service'),objectiveCell('Attention','attention','temperature'),objectiveCell('Attention','attention','sessions')],
 ['Backup',objectiveCell('Unknown','unknown','backup'),objectiveCell('Degraded','degraded','coldbackup'),objectiveCell('N/A','na','ev-foundation')],
 ['Asset condition',objectiveCell('Watch','attention','asset'),objectiveCell('Investigate','attention','cold-health'),objectiveCell('Unknown','unknown','ev-health')],
 ['Cost control',objectiveCell('Review','attention','financials'),objectiveCell('Unassessed','unknown','cold-financials'),objectiveCell('Unassessed','unknown','ev-financials')],
 ['Evidence',objectiveCell('Limited','limited','evidence'),objectiveCell('Limited','limited','cold-evidence'),objectiveCell('Limited','limited','ev-evidence')]
 ].map(r=>`<div class="matrix-row"><span>${r[0]}</span>${r.slice(1).join('')}</div>`).join('')}</div><p class="chart-note">Site-owned assessments · Unknown is not healthy.<br>N/A means no configured objective. Select any cell for context.</p>`;}
function portfolioScreen(){return `<div class="portfolio-v2">
 <div class="portfolio-context"><div>${badge('Portfolio: Needs attention','amber')}<span>3 simulated sites · 1 mini-grid / 1 cold room / 1 charging hub</span></div><button class="claim-link" data-portfolio-scope>Assessment scope & periods ↗</button></div>
 ${portfolioOutcomeCards()}
 <div class="portfolio-pulse"><span>${icon('site')}<strong>3</strong> priority sites</span><span>${icon('sun')}<strong>1</strong> opportunity: Kobo daytime solar</span><span>${icon('evidence')}<strong>3</strong> site evidence gaps</span><span>${icon('action')}<strong>3</strong> accepted actions</span><span>${icon('finding')}<strong>${WARNINGS.length}</strong> warnings not yet priced</span><span class="pulse-note">Distinct consequence categories · no combined savings total</span></div>
 <div class="portfolio-main">
 <section class="panel priority-panel"><div class="panel-head"><div><h2>Where management should act first</h2><p>Findings ranked by consequence and urgency, with evidence confidence alongside.</p></div><span class="eyebrow">6 findings</span></div>
 <div class="portfolio-lenses" aria-label="Finding lens">${['All priorities','Cost','Risks','Opportunities'].map((label,i)=>`<button class="chip ${i===0?'active':''}" data-portfolio-lens="${label}" aria-pressed="${i===0}">${label}</button>`).join('')}<span id="portfolio-result-count">6 findings</span></div>
 <div id="portfolio-findings">${portfolioRows()}</div>${warningList(()=>true,4)}<div class="panel-bottom">${link('findings','Open all Findings →')}<span>Priority and confidence answer different questions.</span></div></section>

 <section class="portfolio-evidence"><div>${icon('evidence')}<h3>Evidence that would change a decision</h3></div><p>Restore Kobo’s missing PCS capability report to resolve two indeterminate dispatch intervals.</p>${link('evidence','Inspect the constraint →')}</section></aside>
 </div>
 <div class="portfolio-bottom"><section class="panel opportunity-panel"><div class="panel-head"><div><div class="eyebrow">GROW USEFUL DEMAND</div><h2>An opportunity beyond reducing cost</h2></div>${badge('Scenario','green')}</div><div class="opportunity-story"><div><span class="opportunity-quantity">10 <small>kW × 1 h</small></span><p>Grain-mill evaluation at Kobo</p></div><span class="story-arrow">→</span><div><span class="opportunity-quantity">$2.50</span><p>Scenario gross sales per eligible window</p></div></div><p class="chart-note">Within 18–20 kW headroom · $0.25/kWh assumed tariff · before costs. Validate demand and service guardrails before committing.</p><div class="panel-bottom">${link('opportunity-finding','Review opportunity Finding →')}${link('renewable','Inspect physical headroom →')}</div></section>

 <div class="portfolio-context-footer"><span>Business context: Ruiru delivered <strong>120 kWh</strong> in complete records; <strong>$36.00</strong> scenario tariff estimate.</span>${link('energy','Inspect energy basis →')}<span>Other sites lack comparable full-window energy coverage.</span></div>
 </div>`;}

/* v7.0: site and estate cards organised by business outcome (commercial capability architecture rev 5, figure 3.1).
   Each outcome card wires existing v6.9 content: state, contributors, issues, what can be done, what is in hand,
   earlier interventions and evidence. Same illustrative records; nothing here is a new analytic. */
const OUTCOME={
 'MG-1':'Productive electricity sales','MG-2':'Supply cost per kWh','MG-3':'Site profitability','MG-4':'Battery and generator life','MG-5':'Reliable service','MG-6':'Cash collected','MG-7':'Evidence quality',
 'EV-1':'Buses ready to run','EV-2':'Energy cost per km','EV-3':'Charger use','EV-4':'Charger life','EV-5':'Room before expansion','EV-6':'Energy billed against metered','EV-7':'Evidence quality',
 'CC-1':'Stock kept saleable','CC-2':'Paid cold-room use','CC-3':'Cost per cooling unit','CC-4':'Market value of produce','CC-5':'Compressor life','CC-6':'Cooling continuity','CC-7':'Evidence quality'};

/* Group site-level outcomes by category, keeping their plain names: [[cat,[names]]]. */
function byCat(codes){const g=[];codes.forEach(c=>{const k=CAT_OF[c];let e=g.find(x=>x[0]===k);if(!e)g.push(e=[k,[]]);e[1].push(OUTCOME[c].toLowerCase());});return g;}
/* Every Finding belongs to one or more categories: the ones it moves, then the ones it must be checked against. */
function affectsPill(fid){const a=AFFECTS[fid];if(!a)return '';const main=byCat(a[0]).map(([k])=>k),also=byCat(a[1]).map(([k])=>k).filter(k=>!main.includes(k));
 return `<span class="oc-affectwrap">${main.map(k=>`<span class="oc-affects" title="Affects ${CATN[k]}">${CATN[k]}</span>`).join('')}${also.map(k=>`<span class="oc-affects quiet" title="Also checked under ${CATN[k]}">${CATN[k]}</span>`).join('')}</span>`;}
const recurNote=fid=>RECUR[fid]?`<small class="oc-recur">${RECUR[fid]}</small>`:'';

function affectsLine(fid){const a=AFFECTS[fid];if(!a)return '';const act=fid.startsWith('ACT');
 return `<div class="oc-affectsline"><span class="oc-k">Affects</span>${catPills(a[0])}${a[1].length?`<span class="oc-k">${act?'Safeguards checked':'Also check'}</span>${catPills(a[1],true)}`:''}${RECUR[fid]?`<span class="oc-recurline">${RECUR[fid]}</span>`:''}</div>`;}

 mini:{overview:'mini',foundation:'foundation',sld:'sld',readiness:'readiness',health:'health',perf:'dispatch','perf:backup':'backup',findings:'sitefindings','work:Actions':'sitework','work:Incidents':'sitework-incidents','work:Maintenance':'sitework-maintenance','fin:Overview':'financials','fin:Assumptions':'assumptions','fin:Scenarios':'scenarios','evi:Overview':'evidence','evi:Analysis':'evidence-analysis'},
 cold:{overview:'cold',foundation:'cold-foundation',sld:'cold-sld',readiness:'cold-readiness',health:'cold-health',perf:'temperature','perf:backup':'coldbackup',findings:'cold-findings','work:Actions':'cold-work','work:Incidents':'cold-work-incidents','work:Maintenance':'cold-work-maintenance','fin:Overview':'cold-financials','fin:Assumptions':'cold-assumptions','fin:Scenarios':'cold-scenarios','evi:Overview':'cold-evidence','evi:Analysis':'cold-evidence-analysis'},
 ev:{overview:'ev',foundation:'ev-foundation',sld:'ev-sld',readiness:'ev-readiness',health:'ev-health',perf:'sessions',findings:'ev-findings','work:Actions':'ev-work','work:Incidents':'ev-work-incidents','work:Maintenance':'ev-work-maintenance','fin:Overview':'ev-financials','fin:Assumptions':'ev-assumptions','fin:Scenarios':'ev-scenarios','evi:Overview':'ev-evidence','evi:Analysis':'ev-evidence-analysis'}};
const SECTION_SLOT={Overview:'overview',Foundation:'foundation',Health:'health',Performance:'perf',Findings:'findings',Work:'work:Actions',Financials:'fin:Overview',Evidence:'evi:Overview'};
function equivalentScreen(s,domain){const own=Object.entries(SLOTS[s.domain]||{}).find(([,id])=>id===s.id);const slot=own?own[0]:SECTION_SLOT[s.section]||'overview';return SLOTS[domain][slot]||SLOTS[domain][SECTION_SLOT[s.section]]||SLOTS[domain].overview;}
function siteSwitchV70(s){return `<label class="site-switch"><span class="sr-only">Site</span><select id="site-switch" aria-label="Switch site">${Object.entries(SITES).map(([k,v])=>`<option value="${k}" ${k===s.domain?'selected':''}>${v.name} · ${v.type}</option>`).join('')}</select></label>`;}
/* Analysis period: one illustrative 30-day daily series per site (7 Sep – 6 Oct 2026); every preset and custom range sums the same days, so figures stay consistent. */
const DAY_MIN='2026-09-07',DAY_MAX='2026-10-06',DAY0=Date.UTC(2026,8,7);
const dayIdx=iso=>Math.round((Date.parse(iso+'T00:00:00Z')-DAY0)/864e5);
const dayName=i=>new Date(DAY0+i*864e5).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const DAILY={
 mini:Array.from({length:30},(_,i)=>i===29?{gen:4,c:.5,u:.5,br:0,cov:92}:{gen:3.5+((i*37)%7)*.25,c:((i*11)%5)*.25,u:i%4===1?.25:0,br:[3,9,12,17,24].includes(i)?1:0,cov:88+((i*13)%12)}),
 cold:Array.from({length:30},(_,i)=>({out:[20,25,29].includes(i)?1:0,ok:[20,25].includes(i)?1:0,exc:i===29?1:0,cov:i===29?100:99})),
 ev:Array.from({length:30},(_,i)=>{const n=i===29?12:10+((i*7)%5),it=i===29?1:0,uk=(i===29||i===14)?1:0,c=n-it-uk;return {n,c,it,uk,kwh:i===29?120:Math.round(c*11.6*10)/10,unav:i===29?1:0,unk:(i===29||i===14)?1:0};})};
const EVENT={mini:{gen:1,c:.5,u:.5,br:0,cov:95},cold:{out:1,ok:0,exc:1,cov:100,hours:1},ev:{n:12,c:10,it:1,uk:1,kwh:120,unav:1,unk:1}};
function rangeDays(){const r=stage.range;if(r.preset==='day')return [29,29];if(r.preset==='7d')return [23,29];if(r.preset==='30d')return [0,29];if(r.preset==='custom')return [Math.max(0,dayIdx(r.from)),Math.min(29,dayIdx(r.to))];return null;}
function rangeLabel(domain){const d=rangeDays();if(!d)return domain?SITES[domain].window:'6 Oct 2026 · each site’s event window';return d[0]===d[1]?`${dayName(d[0])} 2026 · full day EAT`:`${dayName(d[0])} – ${dayName(d[1])} 2026 · ${d[1]-d[0]+1} days`;}
function periodData(domain){const d=rangeDays();if(!d)return {...EVENT[domain],days:0};const rows=DAILY[domain].slice(d[0],d[1]+1);const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);const out={days:rows.length};Object.keys(rows[0]).forEach(k=>out[k]=k==='cov'?sum(k)/rows.length:sum(k));return out;}
const fmtH=h=>`${(Math.round(h*100)/100).toString()} h`;
function periodFigures(domain){const p=periodData(domain);
 if(domain==='mini'){const lo=p.c*5.4*.9*stage.price+p.c*.8,hi=p.c*5.4*1.1*stage.price+p.c*.8;
  return [['Generator running',fmtH(p.gen)],['Avoidable generator time',fmtH(p.c)],['Unclear',fmtH(p.u)],['Cost exposure',p.c?`$${(Math.floor((lo+1e-9)*100)/100).toFixed(2)}–${(Math.ceil((hi-1e-9)*100)/100).toFixed(2)}`:'$0.00'],['Reserve breaches',String(p.br)],['Readings received',`${Math.round(p.cov)}%`]];}
 if(domain==='cold'){const mins=p.days?p.days*1440:60,pct=m=>`${(Math.floor((1-m/mins)*1000)/10).toFixed(1)}`;
  return [['Grid outages',String(p.out)],['Automatic starts that worked',`${p.ok} of ${p.out}`],['Temperature excursions',String(p.exc)],['Time above 4°C',p.exc?'25–35 min':'0 min'],['In policy',p.exc?(p.days?`${pct(35)}–${pct(25)}%`:'42–58%'):'100%'],['Readings received',`${Math.round(p.cov)}%`]];}
 const sched=(p.days||1)*16,known=sched-p.unk,avail=known?((known-p.unav)/known*100).toFixed(1):'—';
 return [['Charging attempts',String(p.n)],['Completed',String(p.c)],['Interrupted',String(p.it)],['Outcome unknown',String(p.uk)],['Delivered energy',`${Math.round(p.kwh*10)/10} kWh`],['Known-time availability',`${avail}%`]];}
function estateFigures(){const m=periodFigures('mini'),c=periodFigures('cold'),e=periodFigures('ev'),v=(f,k)=>f.find(x=>x[0]===k)[1];
 return [['Kobo · cost exposure',v(m,'Cost exposure')],['Kobo · reserve breaches',v(m,'Reserve breaches')],['Thika · excursions',v(c,'Temperature excursions')],['Thika · automatic starts that worked',v(c,'Automatic starts that worked')],['Ruiru · interrupted sessions',v(e,'Interrupted')],['Ruiru · delivered energy',v(e,'Delivered energy')]];}
const PRESET_NAME=k=>(PRESETS.find(p=>p[0]===k)||PRESETS[0])[1];
const PRESETS=[['event','Event window'],['day','Selected day'],['7d','Last 7 days'],['30d','Last 30 days'],['custom','Custom range']];
const provTag=(domain)=>`<span class="prov-tag" title="Readings at this site come from a simulated source, not field equipment">${icon('info')}Simulated site · ${SITES[domain].id}</span>`;
function rangePicker(domain){const r=stage.range,open=!!stage.rangeOpen;
 const figs=stage.view!=='populated'?`<p class="period-note">${stage.view==='empty'?'No accepted evidence in this window, so no period figures are shown.':'Evidence is insufficient for this window, so period figures are withheld.'}</p>`:`<div class="period-strip">${(domain?periodFigures(domain):estateFigures()).map(([k,v])=>`<div><span>${k}</span><strong>${v}</strong></div>`).join('')}</div>`;
 const pop=`<div class="range-pop" role="dialog" aria-label="Analysis window"><div class="eyebrow">Analysis window</div><div class="period-presets">${PRESETS.map(([k,l])=>`<button class="chip ${r.preset===k?'active':''}" data-range="${k}" aria-pressed="${r.preset===k}">${l}</button>`).join('')}</div>${r.preset==='custom'?`<div class="period-custom"><input type="date" id="range-from" aria-label="Start date" min="${DAY_MIN}" max="${DAY_MAX}" value="${r.from}"><span>to</span><input type="date" id="range-to" aria-label="End date" min="${DAY_MIN}" max="${DAY_MAX}" value="${r.to}"><button class="button" data-range-apply>Apply</button></div>`:''}<div class="period-label"><span class="eyebrow">Analysed window</span><strong id="period-label">${rangeLabel(domain)}</strong></div>${figs}${domain?(r.preset==='event'?'':`<p class="period-note">Page detail stays on the event in focus: ${SITES[domain].window}, inside this window.</p>`):`<p class="period-note">One window for every page. Figures above come from each site for this window; the estate tables below remain the illustrative selected examples.</p>`}</div>`;
 return `<div class="range-picker"><button class="range-button" data-range-toggle aria-expanded="${open}" aria-label="Choose analysis window">${icon('clock')}<span class="range-name">Window: ${PRESET_NAME(r.preset)}</span><span id="topbar-window">${rangeLabel(domain)}</span><span aria-hidden="true">▾</span></button>${open?pop:''}</div>`;}

function srcIcon(kind,x,y){if(kind==='pv')return `<rect x="${x}" y="${y}" width="96" height="52" rx="4" class="sld-box pv"/>${[0,1,2].map(c=>[0,1].map(r=>`<rect x="${x+8+c*28}" y="${y+7+r*20}" width="24" height="16" class="sld-cell"/>`).join('')).join('')}`;
 if(kind==='gen')return `<rect x="${x}" y="${y}" width="96" height="52" rx="4" class="sld-box gen"/><circle cx="${x+30}" cy="${y+26}" r="15" class="sld-gen"/><text x="${x+30}" y="${y+31}" text-anchor="middle" class="sld-glyph">G</text><rect x="${x+54}" y="${y+14}" width="30" height="24" rx="2" class="sld-gen"/>`;
 if(kind==='bat')return `<rect x="${x}" y="${y}" width="96" height="52" rx="4" class="sld-box bat"/>${[0,1,2,3].map(c=>`<rect x="${x+10+c*20}" y="${y+12}" width="14" height="28" rx="2" class="sld-batcell"/>`).join('')}`;
 return `<rect x="${x}" y="${y}" width="96" height="52" rx="4" class="sld-box grid"/><path d="M${x+48} ${y+6}L${x+34} ${y+46}M${x+48} ${y+6}L${x+62} ${y+46}M${x+38} ${y+22}H${x+58}M${x+36} ${y+34}H${x+60}" class="sld-sym"/>`;}
function sld(domain){const d=SLD[domain],W=1000,rowS=100,rowF=86,top=46;
 const nS=d.sources.length,nF=d.feeders.length,busTop=top-6,busBot=top+Math.max(nS*rowS,nF*rowF)-30,monY=busBot+52,H=monY+70;
 const busX=640;let g='';
 g+=`<text x="${busX}" y="22" text-anchor="middle" class="sld-head">${d.bus.toUpperCase()}</text><line x1="${busX}" x2="${busX}" y1="${busTop}" y2="${busBot}" class="sld-bus"/>`;
 d.sources.forEach((src,i)=>{const y=top+i*rowS,cy=y+26;
  g+=srcIcon(src.kind,20,y)+`<text x="20" y="${y+68}" class="sld-label">${src.name}</text><text x="20" y="${y+82}" class="sld-small">${src.sub}</text>`;
  let x=116;
  if(src.conv){const line=src.dc?'sld-dc':'sld-ac';g+=`<line x1="${x}" x2="290" y1="${cy}" y2="${cy}" class="${line}"/>${src.dc?`<text x="203" y="${cy-8}" text-anchor="middle" class="sld-small">DC</text>`:''}<rect x="290" y="${y}" width="190" height="52" rx="5" class="sld-box conv"/><text x="385" y="${y+22}" text-anchor="middle" class="sld-label">${src.conv[0]}</text><text x="385" y="${y+39}" text-anchor="middle" class="sld-small">${src.conv[1]}</text>${stDot(476,y+4,src.st)}`;x=480;}
  else g+=stDot(112,y+4,src.st);
  const grp=(d.groups||[]).find(G=>G.rows.includes(i));
  if(grp){g+=`<line x1="${x}" x2="${grp.kind==='dc'?500:520}" y1="${cy}" y2="${cy}" class="${grp.kind==='dc'?'sld-dc':'sld-ac'}"/>`;}
  else{g+=`<line x1="${x}" x2="${busX}" y1="${cy}" y2="${cy}" class="sld-ac"/>`+brk(570,cy,src.cb);}
 });
 (d.groups||[]).forEach(G=>{const y0=top+G.rows[0]*rowS+12,y1=top+G.rows[G.rows.length-1]*rowS+40,my=(y0+y1)/2;
  if(G.kind==='dc')g+=`<line x1="500" x2="500" y1="${top+G.rows[0]*rowS+26}" y2="${top+G.rows[G.rows.length-1]*rowS+26}" class="sld-dcbus"/><text x="500" y="${y0-18}" text-anchor="middle" class="sld-small strong">DC BUS</text><line x1="500" x2="520" y1="${my}" y2="${my}" class="sld-dc"/>`;

 d.feeders.forEach((f,j)=>{const y=top+j*rowF,cy=y+20;
  g+=`<line x1="${busX}" x2="${f.meter?748:806}" y1="${cy}" y2="${cy}" class="sld-ac"/>`+brk(690,cy,f.cb);
  if(f.meter)g+=`<rect x="748" y="${cy-13}" width="40" height="26" rx="3" class="sld-meter"/><text x="768" y="${cy+4}" text-anchor="middle" class="sld-small strong">kWh</text>${stDot(786,cy-13,f.meter)}<line x1="788" x2="806" y1="${cy}" y2="${cy}" class="sld-ac"/>`;
  g+=`<rect x="806" y="${cy-16}" width="32" height="32" rx="4" class="sld-load"/><text x="822" y="${cy+5}" text-anchor="middle" class="sld-glyph">${f.icon}</text><text x="848" y="${cy-2}" class="sld-label">${f.name}</text><text x="848" y="${cy+13}" class="sld-small">${f.sub}</text>`;
 });
 const mw=(W-40-(d.monitors.length-1)*12)/d.monitors.length;
 g+=`<line x1="20" x2="${W-20}" y1="${monY-14}" y2="${monY-14}" class="sld-ctl"/><text x="20" y="${monY-22}" class="sld-head">MONITORING & COMMUNICATION</text>`;
 d.monitors.forEach(([n,st],k)=>{const x=20+k*(mw+12);g+=`<line x1="${x+mw/2}" x2="${x+mw/2}" y1="${monY-14}" y2="${monY}" class="sld-ctl"/><rect x="${x}" y="${monY}" width="${mw}" height="40" rx="4" class="sld-box mon"/><text x="${x+mw/2}" y="${monY+24}" text-anchor="middle" class="sld-label">${n}</text>${stDot(x+mw-8,monY+8,st)}`;});
 return `<svg class="sld" viewBox="0 0 ${W} ${H}" role="img" aria-label="Single line diagram: ${d.title}">${g}</svg><div class="legend sld-legend"><span class="legend-item"><span class="legend-swatch" style="background:#16233f"></span>AC power</span><span class="legend-item"><span class="legend-swatch dashed"></span>DC power</span><span class="legend-item"><span class="legend-swatch dotted"></span>Monitoring</span><span class="legend-item">◠ Circuit breaker</span><span class="legend-item"><span class="dot good"></span>Reporting</span><span class="legend-item"><span class="dot gap"></span>Gap in selected window</span><span class="legend-item"><span class="dot none"></span>Not connected</span></div>`;}

 return status(badge(no?'No accepted evidence':'Evidence limited','amber'),`${site.name} · selected period`)+
  cards([metric('Operational assessment','Unknown','Evidence is insufficient for this conclusion'),metric('Financial consequence','Not assessed','No defensible technical quantity to price'),metric('Verification','Blocked','Success criteria require accepted evidence')],'three')+
  panel(no?'Awaiting accepted observations':'A source gap limits this conclusion',empty(no?'No evidence in this window':'Conclusion withheld',no?'The site is set up, but no readings have been accepted for this period. Results appear once its data sources report.':'Some observations remain available, but the required evidence set is incomplete. Do not infer normal operation from the gap.'))+
  panel('What remains available',kv([['Configured site',site.name],['Domain',site.type],['Operating context',site.subtitle],['Next step',link(s.domain==='mini'?'readiness':`${s.domain}-evidence`,'Review evidence readiness →')]]))+
  notice('This is a review-only state variant. It demonstrates claim limits, not a new operational result.','blue');

/* text and counterfactual structure per decision (manifest values only) */
function decText(d){const s=siteM(d.site),P=s.period,o=k=>OPT[k],e=k=>OPT[k].economics||{};
 const T={
 'kobo-generator':()=>{const st=o('KOB-STOPSOC'),fb=P.fuel_balance;return{
  factor:`Litres used: ${num(P.actual.diesel_l)} L in October against ${num(P.plan.diesel_l)} L planned. The generator model splits the extra 480 L: 210 L of running after dawn that solar and the battery could carry, 120 L beyond need but not avoidable, 30 L for evening load growth, and 120 L it cannot explain (above the 2% tolerance, being investigated).`,
  change:'The stop setting changes one factor: litres of avoidable running after dawn. Everything else in the structure (price, tariff, staff) stays as in no action.',
  why:`Stopping at 70% removes ${st.forward_replay.avoidable_fuel_l} L a month in a forward replay of 61 days, with the battery at least 35% at 5 am on every day. Lowering the reserve looks similar but removes only ${o('KOB-RESERVE').forward_replay.avoidable_fuel_l} L and breaks the dawn limit on ${o('KOB-RESERVE').forward_replay.soc_0500_below_35_days} of 61 days. More storage (${usd(o('KOB-BATT100').capex)}) adds nothing the setting change does not. The forward-replay litres are design values, to be reproduced from your data.`,
  cf:[['Litres of avoidable running after dawn','210 L a month','0 L','190 L'],['Battery at least 35% at 5 am','not reported by the replay','held on 61 of 61 days','broken on 4 of 61 days'],['Battery wear','—','$12 a month (costed)','—'],['Effect on contribution','$0','+$250.50 a month','not valued: fails a limit']],cfHead:['Factor','No action','Stop at 70%','Lower the reserve'],
  sens:[`Diesel 20% cheaper: ${usd(st.sensitivity.diesel_minus_20pct_net_12m)} over 12 months; ranking unchanged.`,`Only 160 L a month proves avoidable: ${usd(st.sensitivity.feasible_fuel_160l_net_12m)} over 12 months; still first.`],
  verify:[['Operational','Generator time beyond need down by at least half on comparable days; battery at least 35% at 5 am every day (14 matched days before and after)'],['Economic','Fuel used (tank dips and deliveries) per delivered kWh, adjusted for weather, against the days before; November books'],['Causal','Compared on days with similar solar and load (within 10%); Kisiwa and Mto as sites without the change']],
  records:[['node:kobo:litres','Litres used and their split'],['node:kobo:fb','Fuel balance'],['opt:KOB-STOPSOC:effect','How the 12-month result is worked out']]};},
 'kobo-battery':()=>{const en=s.entitlement;return{
  factor:`Who bears the cost if the battery fades: usable capacity is estimated at 184 kWh (92% of ${num(s.physical.battery_kwh)} kWh) at 2.7 years, below the warranty’s 95% interim guarantee if confirmed. The estimate comes from reconstructing charge and energy, not from a capacity test.`,
  change:'Gathering evidence changes the rights factor (whether a claim can succeed); it does not change any money factor this year.',
  why:`A claim now would fail: there is no commissioning capacity test and no temperature record. The evidence costs ${usd(o('BAT-EVIDENCE').cost)} (capacity test $250, temperature sensor $180) and one crew visit, and keeps $64,000 of cover claimable. That cover is at stake, not money gained.`,
  cf:[['Evidence held','none','capacity test and temperature record','none'],['Cover on the battery','at risk','claimable if capacity falls','claim likely to fail'],['Our cost','$0','$430','$0']],cfHead:['Factor','No action','Gather evidence','Claim now'],
  sens:['If capacity falls further before the test, the claim case gets stronger only with the temperature record in place.'],
  verify:[['Operational','Capacity test result on file; cell temperature logged from the day the sensor is fitted'],['Economic','None expected now: protecting the right to claim is not a saving'],['Causal','Not applicable: no money effect is claimed']],
  records:[['clause:kobo-battery','Warranty clause'],['stake:battery','Cover at stake']]};},
 'kisiwa-genset':()=>{const b60=o('KIS-BATT60');return{
  factor:`Generators available for the evening: generator 1 failed on 30 Oct (alternator), so generator 2 carries every evening alone at 95% load. Evening supply (18:00–23:00) is a firm obligation. Kisiwa uses the most diesel in the portfolio (${num(P.actual.diesel_l)} L), but every generator interval was needed, so no fuel option qualifies.`,
  change:'Repair restores the generators-available factor to 2; it does not change litres (all needed).',
  why:`Repair restores the backup for ${usd(o('KIS-REPAIR').cost)} against ${usd(o('KIS-REPLACE').capex)} to replace. The warranty ended on 30 Jun 2026 and the 1,000-hour service was missed, so we pay. Battery storage (${usd(b60.capex)}) saves a modelled ${usd(b60.monthly_fuel_saving_modelled)} a month: ${usd(b60.net_12m,true)} over 12 months.`,
  cf:[['Generators available in the evening','1, at 95% load','2','2'],['Evening supply obligation','at its limit, no backup','held','held'],['One-off cost','$0','$1,800','$9,500']],cfHead:['Factor','No action','Repair','Replace'],
  sens:['A storage quote and a 7-year life view could revisit battery storage; it stays outside this 12-month plan.'],
  verify:[['Operational','Generator 1 back in service; no evening without a standby generator'],['Economic','Repair invoice matches the quote'],['Causal','Not needed: this protects service; no saving is claimed']],
  records:[['node:kisiwa:litres','Litres used and their split'],['clause:kisiwa-genset','Warranty clause']]};},
 'kisiwa-om':()=>{const en=s.entitlements[1];return{

  sens:['If the reviewer finds weather did prevent access, no credit applies.'],
  verify:[['Operational','Review recorded by a named person'],['Economic','Credit note received and booked'],['Causal','Not applicable']],
  records:[['clause:kisiwa-om','Service clause'],['stake:credit','Possible credit']]};},
 'mto-demand':()=>{const hu=o('MTO-HULLER'),w=o('MTO-WELDING');return{

  cf:[['Billed kWh a month','+0','+1,650 (daytime)','+660 (evening)'],['Generator fuel a month','+$0','+$85 (68 L on 3 low-sun days)','+$272.25'],['Effect on contribution','$0','+$395 a month','−$8.25 a month']],cfHead:['Factor','No action','Rice huller','Welding'],

  sens:['Charges restored are listed, never added to the modelled plan total.'],
  verify:[['Operational','Next bill run includes the 6 customers; unexplained kWh falls after the meter check'],['Economic','Charges appear in the November billing export; collections tracked separately'],['Causal','Direct: records corrected for named meters']],
  records:[['node:mto:billed','Billed kWh and its parts'],['node:mto:lossx','Losses beyond expected'],['stake:charges','Charges restored']]};},
 'mto-inverter':()=>{const en=s.entitlement,c=o('MTO-INV-CLAIM'),b=o('MTO-INV-BUYNOW');return{
  factor:`Inverters in service: inverter 2 of 2 tripped and latched on ${fdate(en.occurrence.failed)}, so Mto runs at half its daytime inverter capacity. It is potentially covered by warranty to ${fdate(en.contract.term_end)}; notice is due by ${fdate(en.notice_deadline)}.`,

  cf:[['Inverters in service','1 of 2','2 of 2 by 28 Nov','2 of 2 by 12 Nov'],['Rice huller','lost','kept if the letter is extended','kept'],['Our cost','$0, cover lost after 27 Nov','$360','$2,910']],cfHead:['Factor','No action','Claim and wait','Buy now, then claim'],
  sens:[`Letter of intent not extended and budget at least $6,430: buying now gives +$3,546 over 12 months against +$2,556 for claim and wait, which loses the huller.`,'Letter of intent extended: claim and wait stays best (+$6,096 for the plan) at any budget.'],

 'mwea-occupancy':()=>{const ag=o('MWEA-AGG'),a=P.actual;return{
  factor:`Occupied crate-days: ${num(a.crate_days)} in October (${a.occupancy_pct}% full) against ${num(P.plan.crate_days)} planned (${P.plan.occupancy_pct}%). Electricity is what the room should use at that occupancy (${num(a.kwh)} kWh against ${num(a.kwh_model)} expected, +0.6%), so the high cost per crate-day comes from low occupancy, not equipment.`,

  cf:[['Occupied crate-days a month','4,340 (October)','+4,500 (Dec–Mar)'],['Electricity','as the model, at low occupancy','+$225 a month (model)'],['Effect on contribution','$0','+$485 a month']],cfHead:['Factor','No action','Aggregator contract'],
  sens:['If the contract is not signed, Mwea stays as it is; nothing is broken.'],
  verify:[['Operational','Crate-days a month from the storage ledger'],['Economic','Aggregator invoices paid'],['Causal','Direct: a named customer’s crates']],

 'thika-backup':()=>{const inc=s.incident,b=inc.batches[0];return{
  factor:`The backup-start factor failed on 6 Oct: the grid was lost ${inc.grid_outage}; automatic start was requested at 19:11:05 and generator GEN-CR-01 failed to start at 19:11:10 (start controller); staff started it by hand at 19:14. The chamber was above its 2–4 °C band for 25–35 minutes, peak 8.2 °C at 19:19. Batch B-1031 (French beans, export grade, limit 5 °C) was above its limit for 20–30 minutes; avocados (limit 12 °C) were not exposed; the cabbage batch had left on 5 Oct.`,

  cf:[['Backup start at night, to 8 Nov','unreliable','manual-start rota + SMS alarm','repaired, cover lost'],['Batch limits','unprotected at night','covered','covered'],['Our cost','$0','$100','$710']],cfHead:['Factor','Wait with no cover','Night cover','Fit it ourselves'],

  records:[['node:thika:liab','Customer compensation'],['stake:batch','Batch exposed (at stake)'],['clause:thika-epc','Workmanship warranty clause']]};},

 'embakasi-schedule':()=>{const dl=o('EMB-DEADLINE'),ch=o('EMB-CHEAPEST'),na=o('EMB-NOACT'),a=P.actual;return{

/* ===== Layer 4 rev 4 mock-up · Portfolio (six owner-approved tabs), Sites directory, Financials root, pilot request ===== */
const PTABS = [['Overview','portfolio'],['Act first','portfolio/act-first'],['Outcomes by site','portfolio/outcomes-by-site'],['Opportunity','portfolio/opportunity'],['What changed','portfolio/what-changed'],['Scope & coverage','portfolio/scope']];
const ptabs = s => tabRow(PTABS,s.ptab||s.id);
const sec = (title,body,sub='',right='',id='') => `<section class="panel"${id?` id="${id}"`:''}><div class="panel-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>${body}</section>`;
const region = (label,html) => `<div class="table-wrap scroll-region" tabindex="0" role="region" aria-label="${escapeHtml(label)}">${html}</div>`;
const siteLink = sk => link(`site/${sk}`,SK[sk].name,'strong');

/* ---------- factor table (outcome → factors → leaves; plan against October at every factor) ---------- */
const BOUND = {off:['Outside its limit','red'],at:['At its limit','amber'],near:['Near its limit','amber'],ok:['Within its limit','green']};
function devText(n){if(n.obs)return '<span class="muted">observed</span>';
 if(n.plan!=null&&n.actual!=null&&typeof n.plan==='number'){const d=r2(n.actual-n.plan);if(Math.abs(d)<0.005)return 'on plan';return (d>0?'+':'−')+fmtU(Math.abs(d),n.unit);}
 if(n.dev!=null)return (n.dev>0?'+':'−')+fmtU(Math.abs(n.dev),n.unit);return '—';}
function factorTable(sk,opts={}){const rows=[];
 walk(tree(sk),(n,d)=>{if(opts.depth!=null&&d>opts.depth)return;
  const lab=`<div class="fac" style="--d:${d}">${d?'<span class="fac-branch" aria-hidden="true">└</span>':''}<div><b>${n.label}</b>${n.residual?' <span class="badge outline">not explained yet</span>':''}<small>${n.how}</small>${n.bound?`<small class="bnd">${badge(...BOUND[n.bound.state])} ${n.bound.text}</small>`:''}</div></div>`;
  const pl=n.plan!=null?fmtU(n.plan,n.unit):'<span class="muted">not declared</span>';
  const ac=n.actual!=null?fig(`node:${sk}:${n.id}`,fmtU(n.actual,n.unit)):'—';
  rows.push(`<tr class="${n.residual?'resid':''} ${d===0?'root':''}"><th scope="row">${lab}</th><td>${n.obs&&n.plan==null?'<span class="muted">—</span>':pl}</td><td>${ac}</td><td>${devText(n)}</td><td>${n.eff!=null&&!n.obs?(n.evd&&n.actual==null?fig(n.evd,usd(n.eff,true)):usd(n.eff,true)):'—'}</td><td>${ec(n.cls)}</td><td>${n.lens?lensTag(n.lens):''}</td><td>${n.dec?link(`decision/${n.dec}`,'Decision →'):''}</td></tr>`);});
 const cost=OPS[SK[sk].op].kind==='cost';
 return region(`Factor structure for ${SK[sk].name}`,`<table class="ftab"><thead><tr><th>Factor and how it composes</th><th>Plan</th><th>October</th><th>Deviation</th><th>Effect on ${cost?'cost (+ lower)':'contribution'}</th><th>Evidence</th><th>Outcome</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>`);}

/* ---------- value chain strip (stages with leaks between them) ---------- */
function chainStrip(op,sk){const o=OPS[op];let st;
 if(o.vertical==='mini'){const C=sk?{...siteM(sk).period.actual,plan_billed_kwh:siteM(sk).period.plan.billed_kwh,plan_revenue:siteM(sk).period.plan.revenue}:o.t.portfolio.chain;
  const loss=sk?(C.technical_loss_kwh??C.expected_technical_loss_kwh)+(C.unexplained_kwh||0):C.delivered_kwh-C.metered_kwh,unb=sk?(C.adjustments_kwh+(C.unbilled_mapping_kwh||0)):C.metered_kwh-C.billed_kwh;
  st=[['Usable capacity','Not available yet','needs the energy management export by time window','na'],['leak','idle capacity: not available yet'],['Delivered',num(C.delivered_kwh)+' kWh','Measured'],['leak',`losses ${num(loss)} kWh`],['Metered',num(C.metered_kwh)+' kWh','Measured'],['leak',`adjustments and unmapped meters ${num(unb)} kWh`],
   ['Billed',num(C.billed_kwh)+' kWh',`plan ${num(C.plan_billed_kwh)} · Recorded`],['leak',''],['Revenue',usd(C.revenue),`plan ${usd(C.plan_revenue)} · Recorded`],['leak',`in transit ${usd(C.in_transit)} · outstanding ${usd(C.outstanding)}`],['Cash collected',usd(C.collected),'Recorded']];}
 else if(o.vertical==='cold'){const t=o.t,C=sk?{capacity_crate_days:t.capacity_crate_days_oct,occupied_crate_days:siteM(sk).period.actual.crate_days,plan_crate_days:siteM(sk).period.plan.crate_days,revenue:siteM(sk).period.actual.revenue,plan_revenue:siteM(sk).period.plan.revenue,collected:siteM(sk).period.actual.collected,outstanding:siteM(sk).period.actual.outstanding}:t.portfolio.chain;
  st=[['Capacity',num(C.capacity_crate_days)+' crate-days','Recorded'],['leak',`idle ${num(C.capacity_crate_days-C.occupied_crate_days)} crate-days`],['Occupied',num(C.occupied_crate_days)+' crate-days',`plan ${num(C.plan_crate_days)} · Recorded`],['leak','no unbilled occupancy recorded'],['Chargeable',num(C.revenue/t.prices.storage_usd_per_crate_day)+' crate-days','Calculated from records'],['leak',''],['Revenue',usd(C.revenue),`plan ${usd(C.plan_revenue)} · Recorded`],['leak',`outstanding ${usd(C.outstanding)}`],['Cash collected',usd(C.collected),'Recorded']];}
 else {const C=sk?{delivered_kwh:siteM(sk).period.actual.kwh,departures_required:siteM(sk).period.actual.departures_required,departures_met:siteM(sk).period.actual.departures_met}:o.t.portfolio.chain;const dl=sk==='ruiru'?['3,200 kWh a night','from the depot model, at the 400 kW limit']:sk==='kasarani'?['1,050 of 1,200 kWh a night','since 1 Nov; full in October']:['Not available yet','needs the depot charging model per night'];
  st=[['Deliverable energy',dl[0],dl[1],sk?'':'na'],['leak',''],['Delivered',num(C.delivered_kwh)+' kWh','Measured'],['leak',''],['Required departures',num(C.departures_required),'Recorded (roster)'],['leak',`missed in October: ${num(C.departures_required-C.departures_met)}`],['Departures met',num(C.departures_met),'Recorded'],['leak',''],['Revenue','Not applicable','charging is a cost centre','na']];}
 const html=st.map(x=>x[0]==='leak'?`<li class="leak" aria-label="Leak: ${escapeHtml(x[1]||'none recorded')}"><span>${x[1]||'—'}</span></li>`:`<li class="stage ${x[3]==='na'?'na':''}"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></li>`).join('');
 return `<figure class="chainfig"><figcaption><strong>${sk?SK[sk].name:o.name} value chain, October</strong> · stages are factors; the gaps between them are leaks</figcaption><ol class="chain">${html}</ol></figure>`;}

 if(o.kind==='cost')return `October charging and depot cost, composed from the depots’ factors: ${usd(T.actual)} against a plan of ${usd(T.plan)}, ${usd(-T.variance)} over. All ${num(P.departures_met)} required departures were met, at ${usd2(P.cost_per_departure_actual)} each (plan ${usd2(r2(T.plan/P.departures_required))}).`;
 const c=P.chain;return `October contribution, composed from the sites’ factors: ${usd(T.actual)} against a plan of ${usd(T.plan)}, ${usd(-T.variance)} short. Revenue factors move it by ${usd(c.revenue_variance,true)}, cost factors by ${usd(c.cost_variance,true)}.`;}

 return `<div class="heroes">${h(o.kind==='cost'?'Charging and depot cost':'Contribution',fig(`port:${op}:actual`,usd(T.actual)),`plan ${usd(T.plan)} · ${fig(`port:${op}:cov`,pct(cv.cost_recorded_share,1))} of cost on recorded facts`,'RECORDED')}
 ${h('Deviation, attributed to factors',fig(`port:${op}:variance`,usd(T.variance,true)),`${usd(res.attributed,true)} attributed to observed factors · ${usd(res.residual,true)} not explained yet (unobserved leaves)${o.kind==='cost'?'. Minus means cost above plan.':''}`,'')}
 ${h('Plan spend',fig(`port:${op}:spend`,usd(plan.spend))+` <small>of ${usd(op==='lakeside'?LS.budget:M.budget_usd_nov_dec)}</small>`,`${plan.visits} of ${crew} ${o.crewWord} in November`,'QUOTE')}

function planCase(op){const o=OPS[op],A=o.t.portfolio.allocation,M=o.t.portfolio_constraints;
 if(op==='lakeside'){const cases=A.switches.find(x=>x.cases).cases,key=`${LS.budget}/${LS.loi?'yes':'no'}`,c=cases[key];
  let ids=[...A.recommended].map(id=>id==='MTO-INV-CLAIM'&&c.inverter==='BUYNOW'?'MTO-INV-BUYNOW':id).filter(id=>id!=='MTO-HULLER'||c.huller);
  const altBuy={id:'MTO-INV-BUYNOW',value:cases['6500/no'].value,spend:cases['6500/no'].spend,huller:true},altClaim={id:'MTO-INV-CLAIM',value:LS.loi?cases['5000/yes'].value:cases['5000/no'].value,spend:LS.loi?cases['5000/yes'].spend:cases['5000/no'].spend,huller:LS.loi};
  const win=c.inverter==='BUYNOW'?altBuy:altClaim,lose=c.inverter==='BUYNOW'?altClaim:altBuy;
  return {key,spend:c.spend,value:c.value,visits:A.crew_visits_used,ids,rows:ids.map(id=>({id,why:WHY_FIRST[id]})),win,lose,loseAffordable:lose.spend<=LS.budget,huller:c.huller};}

function lensGrid(op){const o=OPS[op];
 const cell=(sk,l)=>{const out=[];walk(tree(sk),n=>{if(n.lens===l&&(n.eff&&Math.abs(n.eff)>0.004||n.bound&&n.bound.state!=='ok'||n.residual))out.push(n);});
  if(l==='assure'){const est=[];walk(tree(sk),n=>{if(n.cls==='ESTIMATED'&&!n.kids)est.push(n);});
   if(!out.length&&!est.length)return '<span class="muted">All factors observed; nothing estimated</span>';
   return [...out.map(n=>`${n.label}${n.eff!=null?` (${usd(n.eff,true)})`:''}`),...est.map(n=>`${n.label}: estimated`)].join('<br>');}
  if(l==='protect'){const b=[];walk(tree(sk),n=>{if(n.bound&&n.lens==='protect')b.push(`${n.label}: ${BOUND[n.bound.state][0].toLowerCase()}`);});const ob=out.filter(n=>!n.bound).map(n=>`${n.label} (${usd(n.eff,true)})`);return [...b,...ob].join('<br>')||'<span class="muted">No limit at risk</span>';}
  const top=out.filter(n=>!n.kids||n.kids.every(k=>!(k.lens===l&&k.eff)) ).sort((a,b)=>Math.abs(b.eff||0)-Math.abs(a.eff||0)).slice(0,2);
  if(o.kind==='cost'&&l==='grow')return sk==='ruiru'?'Room for 6 more buses on existing chargers':'<span class="muted">Not applicable: cost centre</span>';
  return top.length?top.map(n=>`${n.label} (${usd(n.eff,true)})`).join('<br>'):'<span class="muted">On plan</span>';};
 return region('Site by outcome grid',`<table class="lgrid"><thead><tr><th>Site</th>${Object.values(LENS).map(([n])=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${o.sites.map(sk=>`<tr><th scope="row">${siteLink(sk)}<small>${usd(siteM(sk).period.variance,true)} against plan</small></th>${Object.keys(LENS).map(l=>`<td>${cell(sk,l)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);}
function waterfall(op){const o=OPS[op],T=opTotals(op),cost=o.kind==='cost';let run=T.plan;const rows=[{label:'Plan',total:true,from:0,to:run,v:run}];
 o.sites.forEach(sk=>{walk(tree(sk),n=>{const leafEff=n.eff!=null&&!n.obs&&(n.evd||n.residual)&&!(n.kids||[]).some(k=>k.evd);if(!leafEff||Math.abs(n.eff)<0.004)return;const amt=cost?-n.eff:n.eff;rows.push({site:sk,label:n.label,from:run,to:r2(run+amt),v:amt,cls:n.cls,res:n.residual,key:n.evd||`node:${sk}:${n.id}`});run=r2(run+amt);});});
 rows.push({label:'October',total:true,from:0,to:run,v:run});
 const max=Math.max(...rows.map(r=>Math.max(r.from,r.to)))*1.04,min=Math.min(0,...rows.map(r=>Math.min(r.from,r.to)));const sc=v=>(v-min)/(max-min)*100;
 const worse=v=>cost?v>0:v<0;
 return `<figure class="wf" aria-labelledby="wf-t"><figcaption id="wf-t"><strong>From plan to October ${cost?'cost':'contribution'}: the deviation attributed to factors</strong> · one view of the structure below. Solid bars are recorded, hatched are modelled splits, dashed are not explained yet.</figcaption>
 <div class="wfrows">${rows.map(r=>{const a=sc(Math.min(r.from,r.to)),w=Math.max(Math.abs(sc(r.to)-sc(r.from)),0.6);const tone=r.total?'total':worse(r.v)?'worse':'better',pat=r.res?'res':CLS[r.cls]?.[1]==='mod'?'mod':'';
  const inner=`<span class="wflabel">${r.site?`<small>${SK[r.site].name}</small>`:''}${r.label}</span><span class="wftrack" aria-hidden="true"><span class="wfbar ${tone} ${pat}" style="left:${a}%;width:${w}%"></span></span><span class="wfval">${usd(r.v,!r.total)}${r.total?'':`<small>${r.res?'not explained yet':ecw(r.cls)}</small>`}</span>`;
  return r.total?`<div class="wfrow total">${inner}</div>`:`<button class="wfrow" data-evd="${r.key}" aria-label="${escapeHtml(`${SK[r.site].name}, ${r.label}: ${usd(r.v,true)}, ${r.res?'not explained yet':ecw(r.cls)}. Show how this is worked out`)}">${inner}</button>`;}).join('')}</div>
 <details class="astable"><summary>Show as a table</summary>${region('Waterfall as a table',table(['Site','Factor','Amount','Evidence'],rows.filter(r=>!r.total).map(r=>[SK[r.site].name,r.label,usd(r.v,true),r.res?'Not explained yet':ecw(r.cls)])))}</details></figure>`;}

 return `<p class="lede">Each site’s ${o.kind==='cost'?'cost per required departure':'contribution'} is computed from its declared factors. The plan is the same structure on planned factors, so every deviation sits at the factor where it arises; a residual appears only where a leaf factor is not observed.</p>

function REG_STATUS(s){if(!V70IDS.has(s.id))return 'Added';if(ALIAS[s.id])return 'Merged';if(CHANGED[s.id]||preBody(s))return 'Changed';return 'Preserved';}
function REG_NOTE(s){const st=REG_STATUS(s);if(st==='Merged')return `Merged into ${ALIAS[s.id]} (site economics): what-ifs become decisions; assumptions are listed with their evidence class.`;
 if(CHANGED[s.id])return CHANGED[s.id];if(st==='Changed')return s.root==='Sites'?'Slim banner: these detailed views come from the earlier demo (2 connectors, 80 kW) and depot-wide figures are on the Ruiru overview.':s.id==='opportunity-finding'||s.id==='renewable'?'Slim banner: spare solar without a customer is capacity, not opportunity value.':'Slim banner: example items from the three demo operators shown together.';
 if(st==='Added')return s.question;return 'Unchanged apart from re-based display names where they occur.';}

const LOOPDOC = {anchor:'Layer 4 design rev 4 §6.2',models:['Factor structure (site × period)','Portfolio composition','Decision and options','Allocation run','Commitments and rights'],
 preserved:'v7.0 shell, left menu, tab frame, drawer and accessibility patterns.',adapted:'Content re-based on the five mechanics: outcomes computed from declared factors; deviations seen at the factor where they arise.',deferred:'Live data, persistence and the v7.2 visual foundation (owner question).'};
function addL(id,title,root,section,question,render,extra={}){SCREENS.push({id,title,root,section,question,render,domain:'mini',loop:true,book:false,...LOOPDOC,...extra});}
function loopNotes(s){return `<div class="review-section"><strong>Layer 4 rev 4 · ${REG_STATUS(s)}</strong><p>${REG_NOTE(s)}</p><p style="margin-top:8px"><a href="../layer4-transformation-design.md" target="_blank">Design §6.2 ↗</a> · figures from the demo scenario file; see fixture-mapping.md.</p></div>`;}
const dyn = (o,k,f) => Object.defineProperty(o,k,{get:f,enumerable:true,configurable:true});

/* Portfolio: six owner-approved tabs */
const PQ = {portfolio:'Which outcomes are off plan, which factors show it, and what is the plan?','portfolio/act-first':'What do we do first under budget and crews, and what changes the plan?','portfolio/outcomes-by-site':'How do each site’s factors compose its outcomes, and where does each deviation arise?','portfolio/opportunity':'Which demand can be served profitably, and what limits it?','portfolio/what-changed':'Did the committed changes work, and where do our contract rights stand?','portfolio/scope':'What do the figures rest on, what is missing, and what would a pilot need?'};
const PR = {portfolio:overviewScreen,'portfolio/act-first':actFirstScreen,'portfolio/outcomes-by-site':outcomesBySiteScreen,'portfolio/opportunity':opportunityScreen,'portfolio/what-changed':whatChangedScreen,'portfolio/scope':scopeScreen};
const portfolioCrumbs = s => [['Portfolio','portfolio'],...(s.id==='portfolio'?[]:[[PTABS.find(t=>t[1]===(s.ptab||s.id))[0],s.ptab&&s.ptab!==s.id?s.ptab:null]]),...(s.ptab&&s.ptab!==s.id?[['Pilot request']]:[])];
{const p=SCREENS.find(s=>s.id==='portfolio');Object.assign(p,{render:overviewScreen,loop:true,opScoped:true,ltabs:ptabs,crumbs:portfolioCrumbs,title:'Portfolio',question:PQ.portfolio,loopNotes,...LOOPDOC});dyn(p,'subtitle',()=>`${opName()} · ${OPN().typeWord} · October 2026, books closed 6 Nov`);}
PTABS.slice(1).forEach(([lab,id])=>{addL(id,'Portfolio','Portfolio','',PQ[id],PR[id],{opScoped:true,ltabs:ptabs,crumbs:portfolioCrumbs,loopNotes});dyn(SCREENS.at(-1),'subtitle',()=>`${opName()} · ${lab} · October 2026`);});
addL('portfolio/scope/pilot','Request a paid diagnostic','Portfolio','','What would a paid diagnostic need from us, and what would we get?',pilotScreen,{opScoped:true,ptab:'portfolio/scope',ltabs:ptabs,crumbs:portfolioCrumbs,loopNotes});dyn(SCREENS.at(-1),'subtitle',()=>`${opName()} · minimum records and deliverables`);

/* Sites directory and Financials root, re-based on the operator */
{const s=SCREENS.find(x=>x.id==='sites');Object.assign(s,{render:sitesScreen,opScoped:true,loopNotes,question:'Which of our sites needs attention, and what is the recommended move?'});dyn(s,'subtitle',()=>`${opName()} · October 2026`);}
{const s=SCREENS.find(x=>x.id==='globalfinancials');Object.assign(s,{render:financialsScreen,loop:true,opScoped:true,loopNotes,title:'Financials',crumbs:()=>[['Financials']],question:'What is our economic position, factor by factor, against plan?'});dyn(s,'subtitle',()=>`${opName()} · economic statement · October 2026`);}
['mini','cold','ev'].forEach(d=>{const s=SCREENS.find(x=>x.id===d),sk=V70SITE[d];s.ltabs=()=>siteTabRow(sk,'Overview')+tabRow([['Economics and decisions',`site/${sk}`],['Operating outcomes (earlier view)',d]],d,true);s.loopNotes=loopNotes;});

/* Sites: overview, economics and deep-view placeholders for all nine */
Object.keys(SK).forEach(sk=>{const st=SK[sk],op=st.op,sub=()=>`${st.type} · ${OPS[op].name} · October 2026`;
 const crumbs=s=>[['Sites','sites'],...(s.siteTab==='Overview'?[[st.name]]:[[st.name,`site/${sk}`],[s.siteTab]])];
 addL(`site/${sk}`,st.name,'Sites','Overview',`What are ${st.name}’s outcomes, which factors define them, and what is decided here?`,()=>siteOverview(sk),{site:sk,siteTab:'Overview',ltabs:()=>siteTabs(sk,'Overview'),crumbs,loopNotes,subtitle:sub()});
 addL(`site/${sk}/economics`,st.name,'Sites','Financials',`What is ${st.name}’s economic position, factor by factor, against plan?`,()=>siteEconomics(sk),{site:sk,siteTab:'Financials',ltabs:()=>siteTabRow(sk,'Financials'),crumbs,loopNotes,subtitle:sub()});
 if(!st.v70)['Foundation','Health','Performance','Findings','Work','Evidence'].forEach(tab=>addL(`site/${sk}/${tab.toLowerCase()}`,st.name,'Sites',tab,`${tab} views for ${st.name} (not built in this mock-up).`,()=>deepPlaceholder(sk,tab),{site:sk,siteTab:tab,ltabs:()=>siteTabRow(sk,tab),crumbs,loopNotes,subtitle:sub()}));});

/* Decisions: drill-down pages, not a menu */
DEC.forEach(d=>addL(`decision/${d.id}`,d.q,'Portfolio','Decision',d.q,()=>decisionScreen(d.id),{site:d.site,ltabs:()=>'',crumbs:()=>[['Portfolio','portfolio'],['Act first','portfolio/act-first'],[SK[d.site].name,`site/${d.site}`],['Decision']],loopNotes,
 subtitle:`${SK[d.site].name} · ${OPS[SK[d.site].op].name} · options compared with no action`,actions:()=>btn(`site/${d.site}`,'Open site')}));

window.mockupManifest = SCREENS.map(({render,ltabs,crumbs,actions,loopNotes:_l,...meta})=>({...meta,title:typeof meta.title==='string'?meta.title:'',layer4_status:REG_STATUS({...meta}),layer4_note:REG_NOTE({...meta})}));
render();
</script></body></html>
