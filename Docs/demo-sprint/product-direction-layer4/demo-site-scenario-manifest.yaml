          note: "baseline: the generator keeps running after it has charged the battery; what a setting avoids is that setting's replay figure"
          disposition: ACCEPTABLE
        - id: KOB-RESERVE
          kind: CONFIG_TRIAL
          carrier: "reserve-trial-1 (existing rule: reserve {rec:tenants[lakeside-power].sites[Kobo].physical.reserve_soc_pct} -> 25)"
          replay: K8 stop-90-reserve-25
          disposition: NOT_AVAILABLE_YET
