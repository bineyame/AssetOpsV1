structures:   # rev 10 (owner, ninth to eleventh messages): the declared outcome structures of main design §2.1 (M1), ALL layers, as node
              # expressions over named factors: value-chain stages and leaks, physical sub-structures, cost to serve and the outcome,
              # Protect measures, and (through cost lines, below) rights. evaluate_structure.py evaluates them bottom-up for every site's
              # actual and plan, every option and every plan. Expressions use + - * /, min(), max(), ceil(). No figure is computed outside them.
  MINI_GRID:
    metered_kwh: "delivered_kwh - technical_loss_kwh - unexplained_loss_kwh"          # value chain: delivered -> metered (leak: losses)
    billed_kwh: "metered_kwh - adjustments_kwh - unmapped_kwh"                         # metered -> billed (leaks: adjustments, unmapped meters)
    revenue: "billed_kwh * tariff + productive_kwh * productive_tariff"
    collected: "revenue - in_transit - outstanding"                                    # revenue -> cash
    diesel_l: "generator_l + unexplained_l + extra_l"                                  # physical: generator litres + residual + extra running (0K4m: necessary_l and candidate_l are its decomposition, read by no node)
    fuel_cost: "diesel_l * diesel_price"
    battery_wear: "battery_throughput_kwh * wear_rate"
    cost_to_serve: "fuel_cost + om + staff + collection_cost + battery_wear"
    contribution: "revenue - cost_to_serve"
    obligation_hours_without_redundancy: "reduced_days * hours_per_day"                # Protect (P1): a unit is out
    shortfall_backed: "min(1, floor(standby_kw / max(lost_unit_kw, 1)))"             # rev 13 (L2): 1 when standby capacity covers the lost unit
    obligation_hours_without_backup: "obligation_hours_without_redundancy * (1 - shortfall_backed)"   # ... and nothing backs the remaining unit
    asset_days_out_of_service: "reduced_days"                                          # Protect (P2): one unit out per reduced-capacity event
    asset_days_total: "major_assets * period_days"                                     # O2
    asset_days_available: "asset_days_total - asset_days_out_of_service"
  COLD_CHAIN:
    revenue: "crate_days * rate + contract_crate_days * contract_rate"                 # chargeable -> invoiced; occupied to chargeable is a reconciled zero in October (empty_states.chain_nodes)
    received: "revenue - outstanding"
    kwh_model: "(base_kwh + k_kwh_per_crate_day * (crate_days + contract_crate_days)) * model_factor"
    kwh: "kwh_model + excess_kwh"                                                      # physical: normalised energy + excess over model
    energy: "kwh * elec_price"
    cost_to_serve: "energy + staff + maint + liability + handling"
    contribution: "revenue - cost_to_serve"
    nights_without_backup_cover: "uncovered_nights"                                    # Protect (P1)
    days_backup_start_unproven: "backup_unproven_days"                                 # Protect (P1)
    occupied_total_crate_days: "crate_days + contract_crate_days"                      # physical: bounded by room capacity
    crate_days_without_excursion: "crate_days - excursion_crates * excursion_days"     # O2
    chamber_minutes: "period_days * minutes_per_day"
    cooling_available_minutes: "chamber_minutes - cooling_minutes_unavailable"         # O2
  EV_DEPOT_CAPTIVE:
    deliverable_kwh_night: "min(chargers_in_service * charger_kw, import_limit_kw) * window_h"   # capacity stage
    scheduled_kwh_night: "(peak_kwh + kwh_2200_2400 + kwh_0000_0500) / nights_in_period"
    supplied_kwh_night: "min(deliverable_kwh_night, scheduled_kwh_night)"
    required_kwh_night: "buses * kwh_per_bus_night"
    buses_short_per_night: "ceil(max(required_kwh_night - supplied_kwh_night, 0) / kwh_per_bus_night)"
    departures_required: "buses * nights_in_period"
    departures_missed: "max(buses_short_per_night * short_nights - spare_bus_nights - covered_bus_nights, 0) + extra_missed_departures"   # Protect (P1)
    nights_below_required: "min(buses_short_per_night, 1) * short_nights"                # Protect (P1)
    charger_days_out_of_service: "charger_out_days"                                    # Protect (P2)
    departures_met: "departures_required - departures_missed"
    peak_cost: "peak_kwh * peak_price"                                                 # bill lines (rev 13: nodes, so every bill figure is evaluated)
    offpeak_cost: "kwh_2200_2400 * offpeak_price"
    night_cost: "kwh_0000_0500 * night_price"
    demand_cost: "max_kw * demand_rate"
    energy_cost: "peak_cost + offpeak_cost + night_cost + demand_cost"
    penalties: "departures_missed * penalty_rate"
    cost_to_serve: "energy_cost + maintenance + penalties"
    cost_per_departure_met: "cost_to_serve / departures_met"
    contribution: "0 - cost_to_serve"

factor_map:   # how each vertical's source records become leaf factors (record = the period record; prices, tariff, physical, energy_model
              # from the tenant or site; `a | b` = a, or b where a is not recorded). The evaluator holds no numbers of its own.
  MINI_GRID:
    delivered_kwh: "record.delivered_kwh | record.billed_kwh"
    technical_loss_kwh: "record.technical_loss_kwh | record.expected_technical_loss_kwh | 0"
    unexplained_loss_kwh: "record.unexplained_kwh | 0"
    adjustments_kwh: "record.adjustments_kwh | 0"
    unmapped_kwh: "record.unbilled_mapping_kwh | 0"
    tariff: "prices.tariff_usd_per_kwh[site]"
    productive_kwh: "0"
    productive_tariff: "prices.productive_tariff_usd_per_kwh"
    in_transit: "record.in_transit | 0"
    outstanding: "record.outstanding | 0"
    necessary_l: "record.necessary_l | record.diesel_l"
    candidate_l: "record.candidate_l | 0"
    generator_l: "record.diesel_l - (record.unexplained_l | 0) | record.necessary_l + record.candidate_l"   # 0K4m (I2): the recorded generator litres; on a history month (no diesel_l) their recorded split
    admission_parts_failed: "0"   # 0K4m: the admission parts an option fails (runs/admission.py over its replay); observed sides 0
    unexplained_l: "record.unexplained_l | 0"
    extra_l: "0"
    diesel_price: "prices.diesel_usd_per_l[site]"
    battery_throughput_kwh: "0"
    wear_rate: "prices.battery_wear_usd_per_kwh_throughput"
    om: "record.om"
    staff: "record.staff"
    collection_cost: "0"
    reduced_days: "days_incl(record.reduced_capacity_from, period_end) | 0"
    hours_per_day: "record.reduced_hours_per_day | 0"
    major_assets: "record.major_assets | 0"
    unserved_critical_kwh: "record.unserved_critical_kwh | 0"
    customer_hours_interrupted: "record.customer_hours_interrupted | 0"
    field_visits: "record.field_visits | 0"
    liability: "record.liability | 0"
    period_days: "period_days"
    standby_kw: "0"        # no outage unless the site declares its outage units (factor_sources)
    lost_unit_kw: "0"
    dawn_days_below: "record.dawn_days_below_safeguard | 0"
  COLD_CHAIN:
    crate_days: "record.crate_days"
    rate: "prices.storage_usd_per_crate_day"
    contract_crate_days: "0"
    contract_rate: "0"
    base_kwh: "energy_model.base_kwh"
    k_kwh_per_crate_day: "energy_model.k_kwh_per_crate_day"
    model_factor: "1"
    excess_kwh: "record.kwh - (energy_model.base_kwh + energy_model.k_kwh_per_crate_day * record.crate_days)"
    elec_price: "prices.electricity_usd_per_kwh"
    staff: "record.staff"
    maint: "record.maint"
    liability: "record.liability | 0"
    handling: "0"
    outstanding: "record.outstanding | 0"
    uncovered_nights: "max(days_incl(record.backup_unproven_from, period_end) - record.unproven_nights_without_stock - record.unproven_nights_rota_covered, 0) | 0"   # rev 12 (L2): unproven AND stock present AND no rota
    backup_unproven_days: "days_incl(record.backup_unproven_from, period_end) | 0"
    excursion_crates: "record.excursion_crates | 0"
    excursion_days: "record.excursion_days | 0"
    batches_exposed: "record.batches_exposed | 0"
    cooling_minutes_unavailable: "record.cooling_minutes_unavailable | 0"
    minutes_per_day: "1440"
    capacity_crate_days: "tenant.capacity_crates_per_room * period_days"
    period_days: "period_days"
  EV_DEPOT_CAPTIVE:
    chargers_in_service: "physical.chargers - (record.failed_chargers | 0)"
    chargers_installed: "physical.chargers"
    charger_kw: "physical.charger_kw"
    import_limit_kw: "physical.import_limit_kw"
    window_h: "physical.window_h"
    buses: "physical.buses"
    kwh_per_bus_night: "physical.kwh_per_bus_night"
    nights_in_period: "record.nights | period_days"
    peak_kwh: "record.peak_kwh | 0"
    kwh_2200_2400: "record.kwh_2200_2400 | record.offpeak_kwh | record.kwh"
    kwh_0000_0500: "record.kwh_0000_0500 | 0"
    max_kw: "record.max_kw | 0"
    peak_price: "tariff.prices.peak"
    offpeak_price: "tariff.prices.offpeak"
    night_price: "tariff.prices.night_october"
    demand_rate: "tariff.prices.demand_per_kw_month"
    maintenance: "record.maintenance"
    short_nights: "days_between(record.short_nights_from, period_end) | (record.nights | period_days)"
    spare_bus_nights: "record.spare_bus_nights | 0"
    covered_bus_nights: "0"
    extra_missed_departures: "0"
    charger_out_days: "days_incl(record.charger_out_from, period_end) | 0"
    penalty_rate: "incident.penalty_per_missed_departure | 0"

evaluation:   # inputs for M3 and M4. Each option: the site, the reference it is compared with, its parameters (taken from the option
              # rows where they exist, or declared here with their provenance: a replay study's figure through `source:` (replay_studies), assumption, or quote),
              # its factor changes as expressions over those parameters and the site's observed factors, and its cost lines with the right
              # that decides who bears each line. Value = (outcome under the option - outcome under the reference) x months - operator-borne
              # one-off cost. An option is "valued in money" only when it changes a money node of the structure; otherwise its spend is
              # shown as not valued in money with its Protect effect.
  period_days: 31
  horizon_end: "2026-11-30"
  period_end: "2026-10-31"
  rights_rule: "a cost line with covered_by is borne by the supplier (operator share 0) when the named right's eligibility is POTENTIALLY_COVERED and its claim has not been DENIED; otherwise by the operator. Eligibility (does a right apply) and claim_state (how far the claim has got) are separate fields (brief l.430). An option may set a right's eligibility (evidence assembled) or void it (unauthorised repair); claimable, unclaimable and lost cover are evaluated per option."
  bounds:   # M3 obligation bounds, declared per vertical with reason; their policy (hard, advisory) and fallback are declared per decision in plans
    MINI_GRID:
      - {id: redundancy, node: obligation_hours_without_backup, max: "0", reason: "obligation supply is never left on one unit with nothing behind it (P1); rev 12: measured on the hours with no backup supply (owner Q15)"}
      - {id: claimable_cover, node: cover_not_claimable, max: "0", reason: "keep warranty cover claimable: no cover left unclaimable for want of evidence, and none lost to a lapsed notice or a voiding repair (P4)"}
      - {id: admission, node: admission_parts_failed, max: "0", reason: "the owner's admission rule (D-0K4.9, runs/admission.py): against no action over the same replayed days, energy not served and reserve breaches do not rise, starts stay within the maker's limit, the battery reaches full charge regularly; the dawn margin is information, never a gate"}
    COLD_CHAIN:
      - {id: backup_cover, node: nights_without_backup_cover, max: "0", reason: "stock present must have backup start or manual cover (P1, batch temperature)"}
      - {id: capacity, node: occupied_total_crate_days, max: "capacity_crate_days", reason: "room capacity (physical)"}
      - {id: claimable_cover, node: cover_not_claimable, max: "0", reason: "keep warranty cover claimable: none lost to a lapsed notice or a voiding repair (P4)"}
    EV_DEPOT_CAPTIVE:
      - {id: departures, node: departures_missed, max: "0", reason: "every required departure (P1)"}
      - {id: import_limit, node: max_kw, max: "import_limit_kw", reason: "site import limit (physical)"}
      - {id: claimable_cover, node: cover_not_claimable, max: "0", reason: "keep warranty cover claimable: none lost to a lapsed notice or a voiding repair (P4)"}
  protect_nodes:   # rev 12 (L7): the Protect nodes reported with every option, declared per vertical (not held in the evaluator)
    MINI_GRID: [obligation_hours_without_redundancy, obligation_hours_without_backup, unclaimable_cover, cover_not_claimable]
    COLD_CHAIN: [nights_without_backup_cover, cover_not_claimable]
    EV_DEPOT_CAPTIVE: [departures_missed, cover_not_claimable]
  forward_baseline:   # rev 12 (L5): options look forward from as_of; the period-observation leaves below are reset before an option's changes apply
    MINI_GRID: {reduced_days: "0"}
    COLD_CHAIN: {uncovered_nights: "0", backup_unproven_days: "0"}
    EV_DEPOT_CAPTIVE: {}
  option_detail:   # rev 12 (L7): per-vertical detail nodes shown with an option (capacity check, unit cost, bills), declared here
    EV_DEPOT_CAPTIVE: {capacity: [required_kwh_night, supplied_kwh_night, deliverable_kwh_night, buses_short_per_night, max_kw, import_limit_kw],
                       option_nodes: {cost_per_departure_met: cost_per_departure_met, energy_bill_option: energy_cost}, reference_nodes: {energy_bill_reference: energy_cost}}
  options:   # basis (rev 16.14, ruling D-RECON.6): what the option's figure is measured against. NO_ACTION: the decision's no-action
             # path; RESTORE_REFERENCE: an immediate restore at no operator cost (the "cost to restore"), allowed only where the
             # decision's no-action option never restores (restore: {date: none}); NOT_VALUED: a comparator row, listed beside the plan.
             # The evaluator does not read it; check_manifest.py option_basis() checks it.
    # ---------------- Lakeside Power ----------------
    KOB-STOPSOC:
      site: Kobo
      basis: NO_ACTION
      months: 12
      params: {avoided_l: 'unavailable("a dispatch replay on Kobo''s October as recorded (0K4f)")', added_throughput_kwh: 'unavailable("a dispatch replay on Kobo''s October as recorded (0K4f)")',
               admission_parts_failed_option: {value: 0, source: {study: K8, case: stop-70-reserve-30, field: admission_parts_failed}}}
      changes: {generator_l: "generator_l - avoided_l", battery_throughput_kwh: "battery_throughput_kwh + added_throughput_kwh", admission_parts_failed: "admission_parts_failed_option"}
      information: {source: {study: K8, case: stop-70-reserve-30}, dawn_days_below: 4, baseline_dawn_days_below: 4, new_dawn_days_below: 0,
                    worst_dawn_soc_pct: 34.794737, min_soc_pct: 33.141398, max_starts_in_a_day: 3, longest_days_without_full_charge: 5, admitted: true, first_failing_part: null}
      cost_lines: {vendor_remote_reconfiguration: 60.00, trial_supervision: 30.00}
      sensitivities: {diesel_minus_20pct: {factors: {diesel_price: "diesel_price * 0.8"}}}
    KOB-RESERVE:
      site: Kobo
      basis: NO_ACTION
      months: 12
      params: {avoided_l: 'unavailable("a dispatch replay on Kobo''s October as recorded (0K4f)")', added_throughput_kwh: 'unavailable("a dispatch replay on Kobo''s October as recorded (0K4f)")',
               admission_parts_failed_option: {value: 0, source: {study: K8, case: stop-90-reserve-25, field: admission_parts_failed}}}
      changes: {generator_l: "generator_l - avoided_l", battery_throughput_kwh: "battery_throughput_kwh + added_throughput_kwh", admission_parts_failed: "admission_parts_failed_option"}
      information: {source: {study: K8, case: stop-90-reserve-25}, dawn_days_below: 11, baseline_dawn_days_below: 4, new_dawn_days_below: 7,
                    worst_dawn_soc_pct: 29.815789, min_soc_pct: 28.243229, max_starts_in_a_day: 2, longest_days_without_full_charge: 4, admitted: true, first_failing_part: null}
      crew_visits: {value: 0, basis: "remote reconfiguration, as KOB-STOPSOC"}
    MTO-HULLER:
      site: Mto
      basis: NO_ACTION
      months: 12
      params: {load_kw: "row.load.kw", load_hours_per_day: {value: 5, basis: "window 10:00-15:00"}, days: "row.load.days_per_month",
               litres_per_kwh: {value: 0.094815, source: {study: M8, case: mto-huller, field: litres_per_customer_kwh}}, collection: "row.economics.collection_cost_monthly"}
      changes: {productive_kwh: "productive_kwh + load_kw * load_hours_per_day * days", extra_l: "extra_l + litres_per_kwh * load_kw * load_hours_per_day * days", collection_cost: "collection_cost + collection"}
      information: {source: {study: M8, case: mto-huller}, days_without_headroom: "16 of 61 replayed days", extra_starts: 5, dawn_days_below: 0}
      requires_restore: {decision: mto_inverter, plus_business_days: "row.connection_lead_working_days", by: "row.customer_loi.lapses",
                         by_if_switch: {loi_extended: "row.customer_loi.extension_to"}}   # rev 13 (H1): a dated dependency, evaluated in the allocator
      cost_lines: {service_drop_and_meter: 1200.00}
      sensitivities: {diesel_minus_20pct: {factors: {diesel_price: "diesel_price * 0.8"}}}
    MTO-WELDING:
      site: Mto
      basis: NO_ACTION
      months: 12
      params: {load_kw: "row.load.kw", load_hours_per_day: {value: 3, basis: "window 18:00-21:00"}, days: "row.load.days_per_month",
               litres_per_kwh: {value: 0.324868, source: {study: M8, case: mto-welder, field: litres_per_customer_kwh}}}
      changes: {delivered_kwh: "delivered_kwh + load_kw * load_hours_per_day * days", extra_l: "extra_l + load_kw * load_hours_per_day * days * litres_per_kwh"}
      note: "litres per welder kWh from the M8 replay (SIMULATED)"
