# AssetEcon Layer 4 — demo site and scenario manifest (proposed design, not built) · rev 12 (17 Nov 2026)
# rev 16.17 (0K4m, 21 Nov): one figure per quantity (D-0K4.31 to D-0K4.36): replay inputs from 0K4d's v8 studies (replay-studies.json); the dawn is information; admission per runs/admission.py; Kobo's candidate split, KIS-BATT60 and Embakasi's per-bus timing Not available yet.
# rev 16.13 (20 Nov): `empty_states` added (structure-specification.md §3.1): the record behind every empty leaf, usable capacity deferred to queued slice 4c, the cold occupied-to-chargeable leak a reconciled zero. No figure changed.
# rev 12 (re-review rev 11): no typed admissibility (notice-deadline lapse + cover bound; dawn-adequacy bound over the spike-K leaf); value nets the
# reference path's one-off; crews enforced; budget-aware least violation; one redundancy rule measured on hours with no backup supply (Q15);
# restore dates follow rights; KAS-LOCAL evaluated; forward baseline for options; Kasarani November figures and Harvest capacity evaluated, not typed.
# rev 4: the world of rev 3 is kept and re-expressed on the value chain of the main design (§2.1): every site period
# carries `chain:` stages and leaks; Thika and Ruiru are re-based on the v7.0 mock-up's cold and EV incidents (6 Oct)
# so the preserved v7.0 drill-down pages and these figures describe one world; Embakasi's schedule is valued against
# November no-action under the November tariff (the 00:00-05:00 tier is a no-action windfall, not option value).
# Machine-readable source of truth for the three demonstration portfolios used by every Layer 4 artifact
# (main design document, economic contracts, models, integration design, interactive-mockup-vNEXT fixtures).
#
# STATUS: [proposed] design fixture. Nothing here exists in a database. Every money figure is ILLUSTRATIVE (USD),
# chosen to be plausible and to reconcile exactly; none is a prospect's economics or a measured result.
# Arithmetic is checked by tools in the design pack (see `checks:` at the end); a reviewer can re-run it with
#   python3 check_manifest.py demo-site-scenario-manifest.yaml
#
# Rules carried by this file:
#   R1 Ground truth lives only under `oracle:` (private expectation oracle). Product findings and money must be
#      computed by the real ingest/analytics path from `sources:`; the oracle is only compared against them.
#   R2 Money classes (field `money_class`; `class:` in bridge rows) never sum: ECONOMIC_ACTUAL, OPERATIONAL_ACTUAL, DERIVED, MODELLED,
#      EXPOSURE, VERIFIED. Distinct from the two existing source-basis columns named `evidence_class` (0042:50, 0043:37).
#   R3 Each money effect carries an overlap_group; one overlap group contributes money once.
#   R4 Unknown is never zero. A missing record is `status: MISSING`, never 0.
#   R6 Bridge rows use the key `driver:` for a factor of the declared outcome structure (main design §2.1-2.2); amounts are attributions of the factor deviation.
#   R5 Provenance labels: demo-simulated | source-emulated | bench-tested | field-integrated | observed-financial.

manifest_version: 1
as_of: "2026-11-06"            # demo "today" (October books closed, settlements to 2 Nov received)
accounting_period: "2026-10"    # 31 days
currency: USD                   # illustrative; pilot uses the operator's reporting currency + FX basis (see contracts)
timezone_default: "Africa/Nairobi"

chain_model:   # main design §2.1: one economic reality per site-period; stages in order, leaks between them
  MINI_GRID: {stages: [usable_capacity, delivered_kwh, metered_kwh, billed_kwh, revenue, cash], cost_lines: [fuel, om, staff], result: contribution,
              leaks: {delivered_to_metered: "technical loss (expected) + unexplained", metered_to_billed: "unmapped meters + authorised adjustments", revenue_to_cash: "in transit + outstanding"}}
  COLD_CHAIN: {stages: [capacity_crate_days, occupied_crate_days, chargeable_crate_days, revenue, cash], cost_lines: [energy, staff, maint, liability], result: contribution,
               leaks: {capacity_to_occupied: "idle capacity", occupied_to_chargeable: "incompatible or unbilled occupancy", revenue_to_cash: "outstanding"}}
  EV_DEPOT_CAPTIVE: {stages: [deliverable_kwh_per_night, delivered_kwh, departures_required, departures_met], cost_lines: [energy, demand, maintenance, penalties], result: cost_per_departure_met,
                     revenue: NOT_APPLICABLE, leaks: {required_to_met: "missed departures (service obligation)"}}

time_scales:
  ledger_history:
    purpose: "actual vs plan, variance bridge, seasonality context"
    span: "2026-07 .. 2026-10 (4 monthly periods)"
    resolution: "record-level commercial facts, monthly plan lines"
    generation: "direct from a coherent ledger generator (no physics); emitted as source-shaped CSV"
  sparse_operational_context:
    purpose: "baseline behaviour, normalisation, counterfactual inputs"
    span: "2026-09-01 .. 2026-10-31"
    resolution: "15-min (mini-grid PV/load/SOC), hourly (cold energy/ambient), per-session (EV)"
    generation: "simulator packs on cached day-types; reused across scenarios by manifest hash"
  evidence_windows:
    purpose: "Finding evidence, forward-feasibility replay, verification before/after"
    resolution: "5-min (mini-grid dispatch and verification slots), 5-min (cold chamber, as the v7.0 probe TMP-003), event-level (OCPP)"
    generation: "simulator at full resolution, only inside declared windows"

