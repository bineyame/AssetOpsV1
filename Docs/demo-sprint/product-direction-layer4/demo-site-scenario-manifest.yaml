          crew_visits: 0
          disposition: RECOMMENDED
          condition: "supervised 14-day trial; verified before becoming policy"
        - id: KOB-BATT100
          kind: CAPEX
          capex: 28000.00
          disposition: DEFERRED
          reason: "the avoidable fuel is a policy problem; storage adds nothing the stop-threshold change does not"
      verification_plan:
        baseline: "14 matched days before change (Sep 29 - Oct 12 class days)"
        after: "14 days after apply"
        operational_target: "Candidate generator minutes down >= 50% on comparable days; MG-5 dawn SOC >= 35% every day"
        economic: "fuel consumed (dips + deliveries) per delivered kWh, weather-normalised, vs baseline"
        causal: "comparability bands PV +/-10%, load +/-10%; Kisiwa/Mto as non-treated controls"
    entitlement:
