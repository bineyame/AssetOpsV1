home_categories:   # design rev 16.11 §2.0 (OD-21; Architect's calls): the registry row of every node, so each node sits under exactly
                   # one of the four executive headings. A node is NAMED here or it is a gap: no heading is inherited from a parent.
                   # Values: grow | optimize | protect | assure, with the brief's objective (G1-G3, O1-O3, P1-P4, A1-A5); `above` for the
                   # outcome the two money headings explain; `calendar` for a period constant (days, minutes), which is not a factor.
                   # A measure (protect, operations, rights, service_cost_lines) takes the heading of its objective's letter.
                   # The evaluator and independent model do not read this block; check_manifest.py homes() checks it is complete.
  rule: "named, never inherited; a measure's heading is its objective's letter; a money figure is never under Protect or Assure (At stake excepted)"
  nodes:
    MINI_GRID:
      delivered_kwh: [grow, G1]               # value chain: the service delivered, the start of what is sold
      technical_loss_kwh: [optimize, O2]      # rev 16.11: corrected from inherited Grow; energy lost before a meter is throughput lost
      unexplained_loss_kwh: [optimize, O3]    # rev 16.11: corrected from inherited Grow; delivered but not charged, not priced, never called theft
      metered_kwh: [grow, G1]
      adjustments_kwh: [optimize, O3]
      unmapped_kwh: [optimize, O3]
      billed_kwh: [grow, G1]
      tariff: [grow, G1]
      productive_kwh: [grow, G3]
      productive_tariff: [grow, G3]
      revenue: [grow, G1]
      in_transit: [optimize, O3]
      outstanding: [optimize, O3]
      collected: [optimize, O3]               # cash, outside the contribution gap
      necessary_l: [optimize, O1]
      candidate_l: [optimize, O1]
      unexplained_l: [optimize, O1]
      extra_l: [optimize, O1]
      diesel_l: [optimize, O1]                # also the fuel balance (dips and deliveries): the record of the same litres
      diesel_price: [optimize, O1]
      fuel_cost: [optimize, O1]
      battery_throughput_kwh: [optimize, O1]
      wear_rate: [optimize, O1]
      battery_wear: [optimize, O1]
      om: [optimize, O1]
      staff: [optimize, O1]
      collection_cost: [optimize, O1]
      liability: [optimize, O1]               # customer compensation: money, so a cost line, never a Protect measure
      cost_to_serve: [optimize, O1]
      contribution: [above]
      reduced_days: [protect, P2]
      hours_per_day: [protect, P1]
      obligation_hours_without_redundancy: [protect, P1]
      standby_kw: [protect, P1]
      lost_unit_kw: [protect, P1]
      shortfall_backed: [protect, P1]
      obligation_hours_without_backup: [protect, P1]
      dawn_days_below: [protect, P1]
      replayed_dawn_days_below_safeguard: [protect, P1]
      unserved_critical_kwh: [protect, P1]
      customer_hours_interrupted: [protect, P1]
      asset_days_out_of_service: [protect, P2]
      unclaimable_cover: [protect, P4]
      cover_not_claimable: [protect, P4]
      major_assets: [optimize, O2]            # operations measures (O2): availability, field visits, kWh per visit
      asset_days_total: [optimize, O2]
      asset_days_available: [optimize, O2]
      field_visits: [optimize, O2]
      period_days: [calendar]
    COLD_CHAIN:
      capacity_crate_days: [grow, G2]
      crate_days: [grow, G1]                  # occupied = chargeable crate-days in October
      contract_crate_days: [grow, G3]
      occupied_total_crate_days: [grow, G1]
      rate: [grow, G1]                        # the storage rate: the price of what is sold, like a tariff
      contract_rate: [grow, G3]
      revenue: [grow, G1]
      outstanding: [optimize, O3]
      received: [optimize, O3]
      base_kwh: [optimize, O1]
      k_kwh_per_crate_day: [optimize, O1]
      model_factor: [optimize, O1]
      kwh_model: [optimize, O1]
      excess_kwh: [optimize, O1]
      kwh: [optimize, O1]
      elec_price: [optimize, O1]
      energy: [optimize, O1]
      staff: [optimize, O1]
      maint: [optimize, O1]
      liability: [optimize, O1]               # Thika's customer compensation (credit note): money, so a cost line
      handling: [optimize, O1]
      cost_to_serve: [optimize, O1]
      contribution: [above]
      uncovered_nights: [protect, P1]
      nights_without_backup_cover: [protect, P1]
      backup_unproven_days: [protect, P1]
      days_backup_start_unproven: [protect, P1]
      excursion_crates: [protect, P1]
      excursion_days: [protect, P1]
      batches_exposed: [protect, P1]
      cover_not_claimable: [protect, P4]
      crate_days_without_excursion: [optimize, O2]
      chamber_minutes: [optimize, O2]
      cooling_minutes_unavailable: [optimize, O2]
      cooling_available_minutes: [optimize, O2]
      minutes_per_day: [calendar]
      period_days: [calendar]
    EV_DEPOT_CAPTIVE:
      buses: [grow, G2]                       # the service on chargers already in place (revenue not applicable)
      departures_required: [grow, G2]
      chargers_in_service: [protect, P1]
      charger_kw: [protect, P1]
      import_limit_kw: [protect, P1]
      window_h: [protect, P1]
      deliverable_kwh_night: [protect, P1]    # rev 16.11: Kasarani "Charging energy deliverable per night" (was a gap)
      kwh_per_bus_night: [protect, P1]
      required_kwh_night: [protect, P1]
      supplied_kwh_night: [protect, P1]
      buses_short_per_night: [protect, P1]
      short_nights: [protect, P1]
      spare_bus_nights: [protect, P1]
      covered_bus_nights: [protect, P1]
      extra_missed_departures: [protect, P1]
      departures_missed: [protect, P1]
      nights_below_required: [protect, P1]
      departures_met: [protect, P1]
      charger_out_days: [protect, P2]
      charger_days_out_of_service: [protect, P2]   # rev 16.11: Ruiru "Charger 7, connector 2" (was a gap)
      cover_not_claimable: [protect, P4]
      chargers_installed: [optimize, O2]
      scheduled_kwh_night: [optimize, O2]
      peak_kwh: [optimize, O1]
      kwh_2200_2400: [optimize, O1]
      kwh_0000_0500: [optimize, O1]
      peak_price: [optimize, O1]
      offpeak_price: [optimize, O1]
      night_price: [optimize, O1]
      peak_cost: [optimize, O1]
      offpeak_cost: [optimize, O1]
      night_cost: [optimize, O1]
      max_kw: [optimize, O1]
      demand_rate: [optimize, O1]
      demand_cost: [optimize, O1]
      energy_cost: [optimize, O1]
      maintenance: [optimize, O1]             # EV maintenance (charger service fee): named, no longer inherited
      penalty_rate: [optimize, O1]
      penalties: [optimize, O1]
      cost_to_serve: [optimize, O1]
      cost_per_departure_met: [above]
      contribution: [above]
      nights_in_period: [calendar]
  potential:   # capacity with no customer: shown beside Grow, never as Grow's actual and never added to it (owner, 1 Nov)
    MINI_GRID: [{name: headroom, measure: "usable capacity minus delivered kWh, by time window", objective: G2, shown: "not available yet until the energy management export by time window"},
                {name: letter_of_intent_demand, measure: "kWh a month a signed letter of intent names (Mto huller)", objective: G3}]
    COLD_CHAIN: [{name: idle_capacity, measure: "capacity_crate_days - occupied_total_crate_days", objective: G2}]
    EV_DEPOT_CAPTIVE: [{name: spare_deliverable_energy, measure: "deliverable_kwh_night - required_kwh_night (Ruiru: 6 more buses fit)", objective: G2}]
  bridge_drivers:   # a bridge row's factor (manifest key `driver`, rule R6) -> its node, whose home it takes
    CANDIDATE_RUNNING: candidate_l
    UNEXPLAINED_RESIDUAL: unexplained_l
    EVENING_LOAD_GROWTH: necessary_l
    SOLAR_SHORTFALL_NECESSARY_GEN: necessary_l
    EVENING_NECESSARY_GEN: necessary_l
    DEMAND_VOLUME: metered_kwh
    METER_MAPPING_UNBILLED: unmapped_kwh
    AUTHORISED_ADJUSTMENT: adjustments_kwh
    OCCUPANCY_REVENUE: crate_days
    OCCUPANCY_ENERGY_VOLUME: kwh_model
    ENERGY_EFFICIENCY: excess_kwh
    CUSTOMER_COMPENSATION: liability
    PEAK_ENERGY_SHARE: peak_kwh
    DEMAND_CHARGE: max_kw
  decisions:   # design rev 16.11 §2.0: a decision's heading is the home of its LEVER factor, never of the factor it was opened from.
               # Rule, in order: restores_protect = its options exist to restore a Protect measure or keep a right claimable -> that
               # measure (Protect), even when money also moves; money_factor = the money factor its options change; comparator = the
               # factor it compares. Each option still shows each effect under the home of the factor that effect is on.
               # Keyed by the decision's screen route (#/decision/<id>); plan = the allocator's decision name, where it has one.
    - {id: kobo-generator, site: Kobo, plan: kobo_generator, rule: money_factor, lever: candidate_l, opened_from: diesel_l, heading: optimize}
    - {id: kobo-battery, site: Kobo, plan: kobo_battery_evidence, rule: restores_protect, lever: cover_not_claimable, opened_from: cover_not_claimable, heading: protect}
    - {id: kisiwa-genset, site: Kisiwa, plan: kisiwa_genset, rule: restores_protect, lever: obligation_hours_without_redundancy, opened_from: necessary_l, heading: protect}
    - {id: kisiwa-om, site: Kisiwa, rule: money_factor, lever: om, opened_from: om, heading: optimize}
    - {id: mto-demand, site: Mto, plan: mto_demand, rule: money_factor, lever: productive_kwh, opened_from: billed_kwh, heading: grow}
    - {id: mto-billing, site: Mto, rule: money_factor, lever: unmapped_kwh, opened_from: billed_kwh, heading: optimize}
    - {id: mto-inverter, site: Mto, plan: mto_inverter, rule: restores_protect, lever: cover_not_claimable, opened_from: obligation_hours_without_redundancy, heading: protect}
    - {id: mwea-occupancy, site: "Room A · Mwea", plan: mwea_occupancy, rule: money_factor, lever: contract_crate_days, opened_from: crate_days, heading: grow}
    - {id: thika-backup, site: "Room B · Thika", plan: thika_backup, rule: restores_protect, lever: nights_without_backup_cover, opened_from: liability, heading: protect}
    - {id: kirinyaga-energy, site: "Room C · Kirinyaga", plan: kirinyaga_energy, rule: money_factor, lever: excess_kwh, opened_from: excess_kwh, heading: optimize}
    - {id: embakasi-schedule, site: Embakasi, plan: embakasi_schedule, rule: money_factor, lever: peak_kwh, opened_from: peak_kwh, heading: optimize}
    - {id: kasarani-charger, site: Kasarani, plan: kasarani_charger, rule: restores_protect, lever: departures_missed, opened_from: deliverable_kwh_night, heading: protect}
    - {id: ruiru-expansion, site: Ruiru, plan: ruiru_expansion, rule: comparator, lever: buses, opened_from: departures_met, heading: grow}
    - {id: ruiru-connector, site: Ruiru, rule: restores_protect, lever: charger_days_out_of_service, opened_from: charger_days_out_of_service, heading: protect}

snapshot:   # design rev 16.11 §2.8 (OD-23): the calculated daily snapshot every screen reads, and the demo's pending recalculation.
            # A snapshot is an output: rebuilt from records, never a source. `as_of` is when it was computed; a portfolio whose
            # trigger has fired since shows its snapshot figures and says a recalculation is pending, naming what fired.
            # Illustrative demo choices (Architect). The evaluator and independent model do not read this block.
  as_of: "2026-11-06T06:00:00+03:00"       # the daily run after the 5 Nov records closed; every portfolio below unless it says otherwise
  trigger_kinds: {1: "a new day of records", 2: "a record added or corrected", 3: "a target or budget line changed", 4: "a setting changed",
                  5: "a plan version approved or a plan change recorded", 6: "a new version of the structure or a rule"}
  portfolios:
    - {tenant: lakeside-power, as_of: "2026-11-06T06:00:00+03:00", recalculation_pending: false}
    - {tenant: harvest-cold, as_of: "2026-11-06T06:00:00+03:00", recalculation_pending: true,
       pending: {trigger: 2, what: "Thika's October refrigeration service invoice arrived, replacing the estimate carried at target",
                 received: "2026-11-06T09:40:00+03:00", sites: ["Room B · Thika"], periods: ["2026-10"], portfolio_also: true}}
    - {tenant: metro-bus, as_of: "2026-11-06T06:00:00+03:00", recalculation_pending: false}

owner_question_variants:   # rev 13 (M4): the owner question's alternatives are evaluated, not described; the evaluator runs each patch on a copy
  Q15:
    applied: A
    A: {patch: []}
    B: {patch: [{path: "evaluation.bounds.MINI_GRID[id=redundancy].node", set: obligation_hours_without_redundancy}]}
    C: {patch: [{path: "plans.lakeside-power.decisions[name=kisiwa_genset].hard", remove: redundancy},
                {path: "plans.lakeside-power.decisions[name=mto_inverter].hard", remove: redundancy},
                {path: "plans.lakeside-power.decisions[name=kisiwa_storage].hard", remove: redundancy}]}

calibration_spikes:   # rev 13 (owner rule 1): the replays only; no list of figures. A figure is replay-dependent when it is computed from an
                      # option parameter carrying design_value K, M or E (or a physical field named below), or is a plan figure whose valued
                      # options include such an option; the screen tagger and the audit derive that set from the evaluation.
  K: {replay: "Kobo forward dispatch replay", parameters: "design_value: K on KOB-STOPSOC and KOB-RESERVE params; row forward_replay"}
  M: {replay: "Mto demand-on-headroom replay", parameters: "design_value: M on MTO-HULLER params; physical.extra_l_per_day_at_half_inverter_capacity"}
  E: {replay: "Embakasi deadline-aware schedule replay", parameters: "design_value: E on EMB-DEADLINE params"}

