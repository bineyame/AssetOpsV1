structures:   # rev 10 (owner, ninth to eleventh messages): the declared outcome structures of main design §2.1 (M1), ALL layers, as node
              # expressions over named factors: value-chain stages and leaks, physical sub-structures, cost to serve and the outcome,
              # Protect measures, and (through cost lines, below) rights. evaluate_structure.py evaluates them bottom-up for every site's
              # actual and plan, every option and every plan. Expressions use + - * /, min(), max(), ceil(). No figure is computed outside them.
  MINI_GRID:
    metered_kwh: "delivered_kwh - technical_loss_kwh - unexplained_loss_kwh"          # value chain: delivered -> metered (leak: losses)
    billed_kwh: "metered_kwh - adjustments_kwh - unmapped_kwh"                         # metered -> billed (leaks: adjustments, unmapped meters)
    revenue: "billed_kwh * tariff + productive_kwh * productive_tariff"
    collected: "revenue - in_transit - outstanding"                                    # revenue -> cash
    diesel_l: "necessary_l + candidate_l + unexplained_l + extra_l"                   # physical: dispatch classification + residual + extra running
    fuel_cost: "diesel_l * diesel_price"
    battery_wear: "battery_throughput_kwh * wear_rate"
    cost_to_serve: "fuel_cost + om + staff + collection_cost + battery_wear"
    contribution: "revenue - cost_to_serve"
    obligation_hours_without_redundancy: "reduced_days * hours_per_day"                # Protect (P1): a unit is out
    shortfall_backed: "min(1, floor(standby_kw / max(lost_unit_kw, 1)))"             # rev 13 (L2): 1 when standby capacity covers the lost unit
    obligation_hours_without_backup: "obligation_hours_without_redundancy * (1 - shortfall_backed)"   # ... and nothing backs the remaining unit
    replayed_dawn_days_below_safeguard: "dawn_days_below"                              # rev 12 (H1): MG5 dawn adequacy (replay result)
    asset_days_out_of_service: "reduced_days"                                          # Protect (P2): one unit out per reduced-capacity event
    asset_days_total: "major_assets * period_days"                                     # O2
    asset_days_available: "asset_days_total - asset_days_out_of_service"
  COLD_CHAIN:
    revenue: "crate_days * rate + contract_crate_days * contract_rate"                 # occupied = chargeable (no October difference) -> invoiced
    received: "revenue - outstanding"
    kwh_model: "(base_kwh + k_kwh_per_crate_day * (crate_days + contract_crate_days)) * model_factor"
    kwh: "kwh_model + excess_kwh"                                                      # physical: normalised energy + excess over model
    energy: "kwh * elec_price"
    cost_to_serve: "energy + staff + maint + liability + handling"
    contribution: "revenue - cost_to_serve"
    nights_without_backup_cover: "uncovered_nights"                                    # Protect (P1)
    days_backup_start_unproven: "backup_unproven_days"                                 # Protect (P1)
    occupied_total_crate_days: "crate_days + contract_crate_days"                      # physical: bounded by room capacity
    crate_days_without_excursion: "crate_days - excursion_crates * excursion_days"     # O2
    chamber_minutes: "period_days * minutes_per_day"
    cooling_available_minutes: "chamber_minutes - cooling_minutes_unavailable"         # O2
  EV_DEPOT_CAPTIVE:
    deliverable_kwh_night: "min(chargers_in_service * charger_kw, import_limit_kw) * window_h"   # capacity stage
    scheduled_kwh_night: "(peak_kwh + kwh_2200_2400 + kwh_0000_0500) / nights_in_period"
    supplied_kwh_night: "min(deliverable_kwh_night, scheduled_kwh_night)"
    required_kwh_night: "buses * kwh_per_bus_night"
    buses_short_per_night: "ceil(max(required_kwh_night - supplied_kwh_night, 0) / kwh_per_bus_night)"
    departures_required: "buses * nights_in_period"
    departures_missed: "max(buses_short_per_night * short_nights - spare_bus_nights - covered_bus_nights, 0) + extra_missed_departures"   # Protect (P1)
    nights_below_required: "min(buses_short_per_night, 1) * short_nights"                # Protect (P1)
    charger_days_out_of_service: "charger_out_days"                                    # Protect (P2)
    departures_met: "departures_required - departures_missed"
    peak_cost: "peak_kwh * peak_price"                                                 # bill lines (rev 13: nodes, so every bill figure is evaluated)
    offpeak_cost: "kwh_2200_2400 * offpeak_price"
    night_cost: "kwh_0000_0500 * night_price"
    demand_cost: "max_kw * demand_rate"
    energy_cost: "peak_cost + offpeak_cost + night_cost + demand_cost"
    penalties: "departures_missed * penalty_rate"
    cost_to_serve: "energy_cost + maintenance + penalties"
    cost_per_departure_met: "cost_to_serve / departures_met"
    contribution: "0 - cost_to_serve"

factor_map:   # how each vertical's source records become leaf factors (record = the period record; prices, tariff, physical, energy_model
              # from the tenant or site; `a | b` = a, or b where a is not recorded). The evaluator holds no numbers of its own.
  MINI_GRID:
    delivered_kwh: "record.delivered_kwh | record.billed_kwh"
    technical_loss_kwh: "record.technical_loss_kwh | record.expected_technical_loss_kwh | 0"
    unexplained_loss_kwh: "record.unexplained_kwh | 0"
    adjustments_kwh: "record.adjustments_kwh | 0"
    unmapped_kwh: "record.unbilled_mapping_kwh | 0"
    tariff: "prices.tariff_usd_per_kwh[site]"
    productive_kwh: "0"
    productive_tariff: "prices.productive_tariff_usd_per_kwh"
    in_transit: "record.in_transit | 0"
    outstanding: "record.outstanding | 0"
    necessary_l: "record.necessary_l | record.diesel_l"
    candidate_l: "record.candidate_l | 0"
    unexplained_l: "record.unexplained_l | 0"
    extra_l: "0"
    diesel_price: "prices.diesel_usd_per_l[site]"
    battery_throughput_kwh: "0"
    wear_rate: "prices.battery_wear_usd_per_kwh_throughput"
    om: "record.om"
    staff: "record.staff"
    collection_cost: "0"
    reduced_days: "days_incl(record.reduced_capacity_from, period_end) | 0"
    hours_per_day: "record.reduced_hours_per_day | 0"
    major_assets: "record.major_assets | 0"
    unserved_critical_kwh: "record.unserved_critical_kwh | 0"
    customer_hours_interrupted: "record.customer_hours_interrupted | 0"
    field_visits: "record.field_visits | 0"
    liability: "record.liability | 0"
    period_days: "period_days"
    standby_kw: "0"        # no outage unless the site declares its outage units (factor_sources)
    lost_unit_kw: "0"
    dawn_days_below: "record.dawn_days_below_safeguard | 0"
  COLD_CHAIN:
    crate_days: "record.crate_days"
    rate: "prices.storage_usd_per_crate_day"
    contract_crate_days: "0"
    contract_rate: "0"
    base_kwh: "energy_model.base_kwh"
    k_kwh_per_crate_day: "energy_model.k_kwh_per_crate_day"
    model_factor: "1"
    excess_kwh: "record.kwh - (energy_model.base_kwh + energy_model.k_kwh_per_crate_day * record.crate_days)"
    elec_price: "prices.electricity_usd_per_kwh"
    staff: "record.staff"
    maint: "record.maint"
    liability: "record.liability | 0"
    handling: "0"
    outstanding: "record.outstanding | 0"
    uncovered_nights: "max(days_incl(record.backup_unproven_from, period_end) - record.unproven_nights_without_stock - record.unproven_nights_rota_covered, 0) | 0"   # rev 12 (L2): unproven AND stock present AND no rota
    backup_unproven_days: "days_incl(record.backup_unproven_from, period_end) | 0"
    excursion_crates: "record.excursion_crates | 0"
    excursion_days: "record.excursion_days | 0"
    batches_exposed: "record.batches_exposed | 0"
    cooling_minutes_unavailable: "record.cooling_minutes_unavailable | 0"
    minutes_per_day: "1440"
    capacity_crate_days: "tenant.capacity_crates_per_room * period_days"
    period_days: "period_days"
  EV_DEPOT_CAPTIVE:
    chargers_in_service: "physical.chargers - (record.failed_chargers | 0)"
    chargers_installed: "physical.chargers"
    charger_kw: "physical.charger_kw"
    import_limit_kw: "physical.import_limit_kw"
    window_h: "physical.window_h"
    buses: "physical.buses"
    kwh_per_bus_night: "physical.kwh_per_bus_night"
    nights_in_period: "record.nights | period_days"
    peak_kwh: "record.peak_kwh | 0"
    kwh_2200_2400: "record.kwh_2200_2400 | record.offpeak_kwh | record.kwh"
    kwh_0000_0500: "record.kwh_0000_0500 | 0"
    max_kw: "record.max_kw | 0"
    peak_price: "tariff.prices.peak"
    offpeak_price: "tariff.prices.offpeak"
    night_price: "tariff.prices.night_october"
    demand_rate: "tariff.prices.demand_per_kw_month"
    maintenance: "record.maintenance"
    short_nights: "days_between(record.short_nights_from, period_end) | (record.nights | period_days)"
    spare_bus_nights: "record.spare_bus_nights | 0"
    covered_bus_nights: "0"
    extra_missed_departures: "0"
    charger_out_days: "days_incl(record.charger_out_from, period_end) | 0"
    penalty_rate: "incident.penalty_per_missed_departure | 0"

evaluation:   # inputs for M3 and M4. Each option: the site, the reference it is compared with, its parameters (taken from the option
              # rows where they exist, or declared here with their provenance: design value of a calibration spike, assumption, or quote),
              # its factor changes as expressions over those parameters and the site's observed factors, and its cost lines with the right
              # that decides who bears each line. Value = (outcome under the option - outcome under the reference) x months - operator-borne
              # one-off cost. An option is "valued in money" only when it changes a money node of the structure; otherwise its spend is
              # shown as not valued in money with its Protect effect.
  period_days: 31
  horizon_end: "2026-11-30"
  period_end: "2026-10-31"
  rights_rule: "a cost line with covered_by is borne by the supplier (operator share 0) when the named right's eligibility is POTENTIALLY_COVERED and its claim has not been DENIED; otherwise by the operator. Eligibility (does a right apply) and claim_state (how far the claim has got) are separate fields (brief l.430). An option may set a right's eligibility (evidence assembled) or void it (unauthorised repair); claimable, unclaimable and lost cover are evaluated per option."
  bounds:   # M3 obligation bounds, declared per vertical with reason; their policy (hard, advisory) and fallback are declared per decision in plans
    MINI_GRID:
      - {id: redundancy, node: obligation_hours_without_backup, max: "0", reason: "obligation supply is never left on one unit with nothing behind it (P1); rev 12: measured on the hours with no backup supply (owner Q15)"}
      - {id: claimable_cover, node: cover_not_claimable, max: "0", reason: "keep warranty cover claimable: no cover left unclaimable for want of evidence, and none lost to a lapsed notice or a voiding repair (P4)"}
      - {id: dawn_adequacy, node: replayed_dawn_days_below_safeguard, max: "0", reason: "MG5: battery at or above 35% at 5 am on every replayed day (P1)"}
    COLD_CHAIN:
      - {id: backup_cover, node: nights_without_backup_cover, max: "0", reason: "stock present must have backup start or manual cover (P1, batch temperature)"}
      - {id: capacity, node: occupied_total_crate_days, max: "capacity_crate_days", reason: "room capacity (physical)"}
      - {id: claimable_cover, node: cover_not_claimable, max: "0", reason: "keep warranty cover claimable: none lost to a lapsed notice or a voiding repair (P4)"}
    EV_DEPOT_CAPTIVE:
      - {id: departures, node: departures_missed, max: "0", reason: "every required departure (P1)"}
      - {id: import_limit, node: max_kw, max: "import_limit_kw", reason: "site import limit (physical)"}
      - {id: claimable_cover, node: cover_not_claimable, max: "0", reason: "keep warranty cover claimable: none lost to a lapsed notice or a voiding repair (P4)"}
  protect_nodes:   # rev 12 (L7): the Protect nodes reported with every option, declared per vertical (not held in the evaluator)
    MINI_GRID: [obligation_hours_without_redundancy, obligation_hours_without_backup, replayed_dawn_days_below_safeguard, unclaimable_cover, cover_not_claimable]
    COLD_CHAIN: [nights_without_backup_cover, cover_not_claimable]
    EV_DEPOT_CAPTIVE: [departures_missed, cover_not_claimable]
  forward_baseline:   # rev 12 (L5): options look forward from as_of; the period-observation leaves below are reset before an option's changes apply
    MINI_GRID: {reduced_days: "0"}
    COLD_CHAIN: {uncovered_nights: "0", backup_unproven_days: "0"}
    EV_DEPOT_CAPTIVE: {}
  option_detail:   # rev 12 (L7): per-vertical detail nodes shown with an option (capacity check, unit cost, bills), declared here
    EV_DEPOT_CAPTIVE: {capacity: [required_kwh_night, supplied_kwh_night, deliverable_kwh_night, buses_short_per_night, max_kw, import_limit_kw],
                       option_nodes: {cost_per_departure_met: cost_per_departure_met, energy_bill_option: energy_cost}, reference_nodes: {energy_bill_reference: energy_cost}}
  options:
    # ---------------- Lakeside Power ----------------
    KOB-STOPSOC:
      site: Kobo
      months: 12
      params: {avoided_candidate_l: {value: 210, design_value: K}, added_throughput_kwh: {value: 150, design_value: K},
               dawn_days_below_35pct: {value: "row.forward_replay.soc_0500_below_35_days", design_value: K}}
      changes: {candidate_l: "candidate_l - avoided_candidate_l", battery_throughput_kwh: "battery_throughput_kwh + added_throughput_kwh", dawn_days_below: "dawn_days_below_35pct"}
      cost_lines: {vendor_remote_reconfiguration: 60.00, trial_supervision: 30.00}
      sensitivities: {diesel_minus_20pct: {factors: {diesel_price: "diesel_price * 0.8"}}, feasible_fuel_160l: {params: {avoided_candidate_l: 160}}}
    KOB-RESERVE:
      site: Kobo
      months: 12
      params: {avoided_candidate_l: {value: 20, design_value: K}, dawn_days_below_35pct: {value: "row.forward_replay.soc_0500_below_35_days", design_value: K}}
      changes: {candidate_l: "candidate_l - avoided_candidate_l", dawn_days_below: "dawn_days_below_35pct"}
      crew_visits: {value: 0, basis: "remote reconfiguration, as KOB-STOPSOC"}
    MTO-HULLER:
      site: Mto
      months: 12
      params: {load_kw: "row.load.kw", load_hours_per_day: {value: 5, basis: "window 10:00-15:00"}, days: "row.load.days_per_month",
               added_fuel_l: {value: 68, design_value: M}, collection: "row.economics.collection_cost_monthly"}
      changes: {productive_kwh: "productive_kwh + load_kw * load_hours_per_day * days", extra_l: "extra_l + added_fuel_l", collection_cost: "collection_cost + collection"}
      requires_restore: {decision: mto_inverter, plus_business_days: "row.connection_lead_working_days", by: "row.customer_loi.lapses",
                         by_if_switch: {loi_extended: "row.customer_loi.extension_to"}}   # rev 13 (H1): a dated dependency, evaluated in the allocator
      cost_lines: {service_drop_and_meter: 1200.00}
      sensitivities: {diesel_minus_20pct: {factors: {diesel_price: "diesel_price * 0.8"}}}
    MTO-WELDING:
      site: Mto
      months: 12
      params: {load_kw: "row.load.kw", load_hours_per_day: {value: 3, basis: "window 18:00-21:00"}, days: "row.load.days_per_month", sfc: "physical.sfc_l_per_kwh"}
      changes: {delivered_kwh: "delivered_kwh + load_kw * load_hours_per_day * days", extra_l: "extra_l + load_kw * load_hours_per_day * days * sfc"}
      note: "every evening kWh is generator energy (no solar, battery at reserve)"
      crew_visits: {value: 0, basis: "existing connection; no works"}
    KIS-BATT60:
      site: Kisiwa
      months: 12
      params: {shifted_fuel_l: {value: 150, assumption: "no Kisiwa battery replay exists; deferred option; owner decision Q14"}}
      changes: {necessary_l: "necessary_l - shifted_fuel_l"}
      cost_lines: {battery_60_kwh: 14000.00}
      crew_visits: {value: 1, basis: "installation visit (assumption; no quote held)"}
    MTO-INV-CLAIM:
      site: Mto
      sensitivities: {diesel_minus_20pct: {factors: {diesel_price: "diesel_price * 0.8"}}}
      reference: "immediate restore at no operator cost"
      files_notice: {INV-MT-02: {date: as_of}}   # rev 12 (H1): notice filed now, before the 27 Nov deadline; the right stays live
      params: {restore: {date: as_of, plus: ["entitlement.contract.lead_time_days", "install_days"], performed_under: INV-MT-02,
                         if_not_covered: {date: as_of, plus: ["local_supply_days", "install_days"], crew_visits: {value: 1, basis: "own crew installs the unit bought locally"}}},
               install_days: {value: 1, basis: "installer quote"}, local_supply_days: {value: 5, basis: "local distributor quote (if the claim is refused, the unit is bought locally)"},
               extra_l_per_day: "physical.extra_l_per_day_at_half_inverter_capacity"}
      changes: {reduced_days: "days_to_restore", extra_l: "extra_l + value_days_to_restore * extra_l_per_day"}
      cost_lines: {replacement_unit: {amount: 2600.00, covered_by: INV-MT-02}, shipping_failed_unit: 150.00, install: 80.00}
    MTO-INV-BUYNOW:
      site: Mto
      sensitivities: {diesel_minus_20pct: {factors: {diesel_price: "diesel_price * 0.8"}}}
      reference: "immediate restore at no operator cost"
      files_notice: {INV-MT-02: {date: as_of}}   # the failed unit is claimed now (the returned unit becomes a spare)
      params: {restore: {date: as_of, plus: ["local_supply_days", "install_days"]}, local_supply_days: {value: 5, basis: "local distributor quote"}, install_days: {value: 1, basis: "installer quote"},
               extra_l_per_day: "physical.extra_l_per_day_at_half_inverter_capacity"}
      changes: {reduced_days: "days_to_restore", extra_l: "extra_l + value_days_to_restore * extra_l_per_day"}
      cost_lines: {replacement_unit_bought: 2600.00, install: 80.00, ship_failed_unit_for_claim: 150.00, install_returned_unit_as_spare: 80.00}
    MTO-INV-NOACT:
      site: Mto
      reference: "immediate restore at no operator cost"
      # rev 12 (H1): complete like the other two paths (extra fuel included) and files no notice: INV-MT-02 lapses on its 27 Nov deadline,
      # 2,600 of cover is lost, and the declared claimable_cover bound rejects it. No typed admissibility.
      params: {restore: {date: none}, extra_l_per_day: "physical.extra_l_per_day_at_half_inverter_capacity"}
      changes: {reduced_days: "days_to_restore", extra_l: "extra_l + value_days_to_restore * extra_l_per_day"}   # rev 13 (M2): fuel over the tenant horizon
      crew_visits: {value: 0, basis: "no action"}
    MTO-INV-LOCAL:   # rev 13 (L3): evaluated like KAS-LOCAL, not a hand disposition
      site: Mto
      reference: "immediate restore at no operator cost"
      voids_rights: [INV-MT-02]
      params: {restore: {date: as_of, plus: ["local_repair_days"]}, local_repair_days: {value: 2, assumption: "a local technician opens and repairs the unit in 2 days; no quote held"},
               extra_l_per_day: "physical.extra_l_per_day_at_half_inverter_capacity"}
      changes: {reduced_days: "days_to_restore", extra_l: "extra_l + value_days_to_restore * extra_l_per_day"}
      cost_lines: {local_repair: {amount: "row.cost"}}
      crew_visits: {value: 1, basis: "own crew visit with the technician"}
    KIS-REPAIR:
      site: Kisiwa
      reference_option: KIS-NOACT
      reference: "no action"
      params: {restore: {date: "row.crew_visit", plus: ["repair_days"]}, repair_days: {value: 1, basis: "workshop estimate"}}
      changes: {reduced_days: "days_to_restore"}
      cost_lines: {alternator_repair: {amount: 1800.00, covered_by: GEN-KS-01}}
    KIS-REPLACE:
      site: Kisiwa
      reference_option: KIS-NOACT
      reference: "no action"
      params: {restore: {date: as_of, plus: ["row.lead_time_days"]}}
      changes: {reduced_days: "days_to_restore"}
      cost_lines: {replacement_genset: 9500.00}
      crew_visits: {value: 1, basis: "installation visit"}
    KIS-NOACT:
      site: Kisiwa
      is_reference: true
      reference: "no action"
      params: {restore: {date: none}}
      changes: {reduced_days: "days_to_restore"}
      crew_visits: {value: 0, basis: "no action"}
    BAT-EVIDENCE:
      site: Kobo
      set_rights: {BAT-001: POTENTIALLY_COVERED}
      cost_lines: {capacity_test: 250.00, temperature_sensor: 180.00}
      rights_effect: "evaluated: unclaimable cover 64,000.00 -> 0 (claimable, at stake, listed); tracked assets with complete contract evidence 1 of 3 -> 2 of 3 (record count)"
    BAT-NOACT:
      site: Kobo
      is_reference: true
      crew_visits: {value: 0, basis: "no action"}
    # ---------------- Harvest Cold Network ----------------
    MWEA-AGG:
      site: "Room A · Mwea"
      months: 4
      params: {crates: {value: 150, basis: "draft contract"}, days: {value: 30, basis: "December-March, per month"}, contract_rate: {value: 0.18, basis: "draft contract"},
               handling: {value: 100.00, basis: "handling estimate"}}
      changes: {contract_crate_days: "contract_crate_days + crates * days", contract_rate: "contract_rate", handling: "handling"}
      cost_lines: {sales: 150.00, ethylene_curtain: 120.00}
      requires_switch: aggregator_signs   # the contract exists only if the aggregator signs (a person sets the switch)
    KIRI-REPAIR:
      site: "Room C · Kirinyaga"
      months: 12
      params: {recovery_share: "row.recovery_share"}
      changes: {excess_kwh: "excess_kwh * (1 - recovery_share)"}
      cost_lines: {condenser_clean_and_leak_repair: 350.00}
      assumption: "recovery share 80% (range 60-90%)"
      sensitivities: {kirinyaga_recovery_60pct: {params: {recovery_share: 0.60}}}
    KIRI-REPLACE:
      site: "Room C · Kirinyaga"
      months: 12
      params: {new_unit_factor: {value: 0.95, assumption: "a new compressor runs 5% below the occupancy model (vendor datasheet)"}}
      changes: {excess_kwh: "0", model_factor: "new_unit_factor"}
      cost_lines: {replacement_compressor: 4800.00}
      crew_visits: {value: 1, basis: "installation visit"}
    THIKA-EPC-WAIT:
      site: "Room B · Thika"
      is_reference: true
      reference: "no action (wait for the supplier)"
      params: {restore: {date: "entitlement.remedy_scheduled", performed_under: "GEN-CR-01 start controller (backup generator)", if_not_covered: {date: as_of, plus: ["procurement_days"], crew_visits: {value: 1, basis: "own technician fits the controller"}}},
               procurement_days: {value: 0, assumption: "if the EPC remedy is refused, a controller is bought from local stock and fitted the same day; no quote held"}}
      changes: {uncovered_nights: "days_to_restore"}
      cost_lines: {controller_replacement: {amount: "entitlement.cover_value", covered_by: "GEN-CR-01 start controller (backup generator)"}}
      crew_visits: {value: 0, basis: "supplier's technician"}
    THIKA-EPC-STOPGAP:
      site: "Room B · Thika"
      reference_option: THIKA-EPC-WAIT
      reference: "no action (wait for the supplier)"
      params: {restore: {date: as_of}}
      changes: {uncovered_nights: "days_to_restore"}
      cost_lines: {sms_alarm_relay: 40.00, night_rota_labour: 60.00, controller_replacement: {amount: "entitlement.cover_value", covered_by: "GEN-CR-01 start controller (backup generator)"}}
    THIKA-SELF:
      site: "Room B · Thika"
      reference_option: THIKA-EPC-WAIT
      reference: "no action (wait for the supplier)"
      params: {restore: {date: as_of, plus: ["procurement_days"]}, procurement_days: {value: 0, assumption: "controller held in local stock and fitted the same day; no quote held (rev 12, L3)"}}
      changes: {uncovered_nights: "days_to_restore"}
      cost_lines: {controller_self_funded: {amount: "entitlement.cover_value"}}
      crew_visits: {value: 1, basis: "own technician fits the controller"}
      voids_rights: ["GEN-CR-01 start controller (backup generator)"]
    # ---------------- Metro Bus Depots ----------------
    EMB-DEADLINE:
      site: Embakasi
      months: 12
      reference_factors: {night_price: "tariff.prices.night_from_1_nov"}
      params: {max_kw_option: "row.max_kw", hours_before_midnight: {value: 2, basis: "22:00-24:00"}, hours_after_midnight: {value: 5, basis: "00:00-05:00 (to 05:15)"},
               feasible_nights: {value: 31, design_value: E}, bus_short_on_infeasible_night: {value: 1, basis: "a 21-bus night needs about 406 kW, one bus beyond the 400 kW plan (spike E)"}}
      changes: {peak_kwh: "0", kwh_2200_2400: "max_kw_option * hours_before_midnight * nights_in_period", kwh_0000_0500: "max_kw_option * hours_after_midnight * nights_in_period", max_kw: "max_kw_option",
                extra_missed_departures: "(nights_in_period - feasible_nights) * bus_short_on_infeasible_night"}
      cost_lines: {schedule_configuration_and_supervision: 1500.00}
      sensitivities: {flat_tariff: {factors: {peak_price: "offpeak_price", night_price: "offpeak_price", demand_rate: "0"}}}
    EMB-CHEAPEST:
      site: Embakasi
      months: 12
      reference_factors: {night_price: "tariff.prices.night_from_1_nov"}
      params: {max_kw_option: "physical.import_limit_kw", hours_after_midnight: {value: 5, basis: "00:00-05:00"}}
      changes: {peak_kwh: "0", kwh_2200_2400: "0", kwh_0000_0500: "max_kw_option * hours_after_midnight * nights_in_period", max_kw: "max_kw_option"}
      crew_visits: {value: 0, basis: "schedule configured remotely, as EMB-DEADLINE"}
    KAS-OEM-WAIT:
      site: Kasarani
      is_reference: true
      reference: "no action (wait for the supplier)"
      params: {restore: {date: "entitlement.claim_events[0].at", business_days: "entitlement.contracts[1].restore_business_days", performed_under: CH-K2, if_not_covered: {date: as_of, plus: ["local_repair_days"]}},
               local_repair_days: {value: 1, basis: "local electrician quote (if the claim is refused)"},
               failed_chargers: "observations.november_to_date.failed_chargers", spare_cover: "physical.spare_buses * nights_listed(incident.roster.spare_free_nights, as_of, restore_date)"}
      changes: {chargers_in_service: "chargers_in_service - failed_chargers", short_nights: "days_to_restore", spare_bus_nights: "spare_cover"}
      cost_lines: {contactor_repair: {amount: "entitlement.cover_value", covered_by: CH-K2}}
      crew_visits: {value: 0, basis: "supplier's technician"}
    KAS-OEM-STOPGAP:
      site: Kasarani
      reference_option: KAS-OEM-WAIT
      reference: "no action (wait for the supplier)"
      params: {restore: {date: "entitlement.claim_events[0].at", business_days: "entitlement.contracts[1].restore_business_days", performed_under: CH-K2, if_not_covered: {date: as_of, plus: ["local_repair_days"]}},
               local_repair_days: {value: 1, basis: "local electrician quote (if the claim is refused)"},
               failed_chargers: "observations.november_to_date.failed_chargers", spare_cover: "physical.spare_buses * nights_listed(incident.roster.spare_free_nights, as_of, restore_date)",
               cost_per_bus_night: {value: 45.00, basis: "driver overtime 35 + energy at Ruiru 10 per bus charged away (quote)"}}
      changes: {chargers_in_service: "chargers_in_service - failed_chargers", short_nights: "days_to_restore", spare_bus_nights: "spare_cover",
                covered_bus_nights: "max(buses_short_per_night * short_nights - spare_bus_nights, 0)"}
      cost_lines: {buses_charged_at_ruiru: {amount: "covered_bus_nights * cost_per_bus_night"}, contactor_repair: {amount: "entitlement.cover_value", covered_by: CH-K2}}
    KAS-LOCAL:   # rev 12 (L4): evaluated, not narrated: a local repair restores sooner but voids the power-stage cover
      site: Kasarani
      reference_option: KAS-OEM-WAIT
      reference: "no action (wait for the supplier)"
      voids_rights: [CH-K2]
      params: {restore: {date: as_of, plus: ["local_repair_days"]}, local_repair_days: {value: 1, basis: "local electrician quote"},
               failed_chargers: "observations.november_to_date.failed_chargers", spare_cover: "physical.spare_buses * nights_listed(incident.roster.spare_free_nights, as_of, restore_date)"}
      changes: {chargers_in_service: "chargers_in_service - failed_chargers", short_nights: "days_to_restore", spare_bus_nights: "spare_cover"}
      cost_lines: {local_contactor_repair: {amount: "row.cost"}}
      crew_visits: {value: 0, basis: "local electrician (contractor)"}
    RUI-ABSORB6:
      site: Ruiru
      months: 1
      params: {added_buses: {value: 6, basis: "city route offer"}}
      changes: {buses: "buses + added_buses", kwh_2200_2400: "kwh_2200_2400 + added_buses * kwh_per_bus_night * nights_in_period"}
      comparator: "service expansion: more departures, so cost rises; compared with buying 4 chargers (4 x physical.charger_unit_cost), listed not added"
    RUI-4CHARGERS:
      site: Ruiru
      months: 1
      params: {added_chargers: {value: 4, basis: "vendor proposal"}, unit_cost: "physical.charger_unit_cost"}
      changes: {chargers_in_service: "chargers_in_service + added_chargers", chargers_installed: "chargers_installed + added_chargers"}
      cost_lines: {chargers: {amount: "added_chargers * unit_cost"}}
      comparator: "capacity purchase compared with absorbing the expansion on existing chargers; listed, not added"
    RUI-ABSORB10:
      site: Ruiru
      months: 1
      params: {added_buses: {value: 10, basis: "city route offer, larger variant"}}
      changes: {buses: "buses + added_buses", kwh_2200_2400: "kwh_2200_2400 + added_buses * kwh_per_bus_night * nights_in_period"}
      comparator: "service expansion"

plans:   # inputs to the allocator (M4): one joint search over all decisions (evaluate_structure.py best()). Each decision lists its
         # options, its kind (protective: must take one; valued: may take none unless optional: false), its bound policy, fallback and reason.
         # Options breaking a hard bound are left out unless none can keep it; rank: least violation, then value, then lower spend.
  lakeside-power:
    budget: 5000
    crew_limit: crew_visits_nov   # rev 12 (M2): the allocator enforces the tenant's crew visits beside the budget
    decisions:   # rev 12 (M3): one redundancy policy for every Lakeside decision: hard, with the budget-aware least-violation fallback
      - {name: kisiwa_genset, kind: protective, options: [KIS-REPAIR, KIS-REPLACE, KIS-NOACT], hard: [redundancy], fallback: least_violation,
         reason: "evening supply has nothing behind GEN-KS-02; no option restores a backup at once, so the least violation among affordable options is chosen"}
      - {name: kobo_battery_evidence, kind: protective, options: [BAT-EVIDENCE, BAT-NOACT], hard: [claimable_cover], reason: "keep {fig:options.BAT-EVIDENCE.rights.claimable_cover} of cover claimable"}
      - {name: kobo_generator, kind: valued, options: [KOB-STOPSOC, KOB-RESERVE], optional: true, hard: [dawn_adequacy]}
      - {name: mto_inverter, kind: valued, options: [MTO-INV-CLAIM, MTO-INV-BUYNOW, MTO-INV-LOCAL, MTO-INV-NOACT], optional: false, hard: [redundancy, claimable_cover], fallback: least_violation,
         reason: "the generator backs the daytime shortfall on every path (redundancy met); no action lets the warranty notice lapse (cover bound); money decides between the claim and buying now"}
      - {name: mto_demand, kind: valued, options: [MTO-HULLER], optional: true}
      - {name: mto_evening_demand, kind: valued, options: [MTO-WELDING], optional: true}
      - {name: kisiwa_storage, kind: valued, options: [KIS-BATT60], optional: true, hard: [redundancy],
         reason: "a battery shifts solar to the evening; looking forward from the repair it leaves no hours without backup"}
    switches: {budget: [5000, 6500], loi_extended: [true, false]}
    downside_drops: {cooperative_does_not_sign: [MTO-HULLER]}
    listed_not_added: {MTO-BILLING: "restored charges await the corrected billing run; collection is a separate step"}
  harvest-cold:
    budget: 2500
    crew_limit: technician_visits_nov
    decisions:
      - {name: thika_backup, kind: protective, options: [THIKA-EPC-WAIT, THIKA-EPC-STOPGAP, THIKA-SELF], hard: [backup_cover, claimable_cover], reason: "stock present needs backup cover; the EPC cover is kept"}
      - {name: kirinyaga_energy, kind: valued, options: [KIRI-REPAIR, KIRI-REPLACE], optional: true}
      - {name: mwea_occupancy, kind: valued, options: [MWEA-AGG], optional: true, hard: [capacity]}
    switches: {aggregator_signs: [true, false]}
    downside_drops: {aggregator_does_not_sign: [MWEA-AGG]}
  metro-bus:
    budget: 5000
    crew_limit: technician_visits_nov
    decisions:
      - {name: kasarani_charger, kind: protective, options: [KAS-OEM-WAIT, KAS-OEM-STOPGAP, KAS-LOCAL], hard: [departures, claimable_cover], reason: "every required departure; the power-stage cover is kept"}
      - {name: embakasi_schedule, kind: valued, options: [EMB-DEADLINE, EMB-CHEAPEST], optional: true, hard: [departures, import_limit]}
      - {name: ruiru_expansion, kind: comparator, options: [RUI-ABSORB6, RUI-ABSORB10, RUI-4CHARGERS], hard: [departures, import_limit],
         reason: "service expansion and capacity purchase: checked against the bounds, listed beside the plan, not valued"}
    switches: {tariff_applies: [true, false]}
    switch_sensitivity: {tariff_applies: {false: flat_tariff}}
    listed_not_added: {RUI-ABSORB6: "service expansion (different comparator)", RUI-4CHARGERS: "capacity purchase comparator"}

demo_workflow:   # design rev 16.8 §2.4-§2.6 (plan F mock-up lane, 19 Nov; owner decisions OD-16 and OD-17 of 19 Nov). ARCHITECT'S DEMO
                 # CHOICES, all illustrative: who chose each item, each item's owner (OD-16: the person who chose the option or declared
                 # the item), each Action's creator, owner and due date, the thresholds, and the plan's state on as_of. People are fictional
                 # first names beside their role title, shown "Illustrative" on screen. The evaluator, independent model and allocator do
                 # not read this block; check_manifest.py checks the figures worked-portfolios.md states from it and the workflow rules
                 # below (workflow()). Release follows design §2.4 step 4: at creation when the item's whole change is at or below both
                 # thresholds, the item is not a capital item, and the plan still fits; else it waits for the executive's approval of the
                 # version. A new connection is a capital item (OD-17): the site manager proposes it, the executive approves it as capital,
                 # and only then does the site manager create its Actions, so on as_of it has none (actions_after_approval).
                 # Version 1 holds the evaluator's default items (derived-values.json plans.<tenant>.default.items) plus any declared item.
  people_shown_as: "role title, with the Site for a Site-bound role, and a fictional first name, labelled Illustrative"
