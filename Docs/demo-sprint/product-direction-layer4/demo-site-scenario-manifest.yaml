          condition: "supervised 14-day trial; verified before becoming policy"
        - id: KOB-BATT100
          kind: CAPEX
          capex: 28000.00
          disposition: DEFERRED
          reason: "the avoidable fuel is a policy problem; storage adds nothing the stop-threshold change does not"
