        - {driver: EVENING_LOAD_GROWTH, overlap_group: KOBO-2026-10-FUEL, amount: -37.50, basis: "30 L x 1.25 (Necessary)", class: MODELLED}
        - {driver: UNEXPLAINED_RESIDUAL, overlap_group: KOBO-2026-10-FUEL, amount: -150.00, basis: "120 L x 1.25 consumed minus modelled; investigate (MG-L5)", class: DERIVED}
      fuel_balance: {opening_dip_l: 220, deliveries_l: 1200, closing_dip_l: 240, consumed_l: 1180, model_implied_l: 1060, residual_l: 120, tolerance_pct: 2.0}
    findings_expected:
      - {mechanism: GENERATOR_SUPPORT_CANDIDATE, days: "11 of 31", gross_exposure_l: [0, 330], gross_exposure_usd: [0.00, 412.50], note: "fuel-cost-1 upper bound (includes its 1.10 consumption allowance); NOT the decision value and NOT the observed candidate-running factor (330 L x 1.25 = 412.50 from metered generator energy); the build keeps the two separate"}
      - {mechanism: UNEXPLAINED_FUEL, residual_l: 120, note: "above 2% tolerance; investigation, no recovery claimed"}
    decision:
      thread: "Kobo generator runs after dawn while solar could carry the load"
      origin: FINDING
      options:
        - id: KOB-NOACT
          kind: NO_ACTION
          monthly_net: 0.00
          note: "baseline: 1,180 L/month pattern continues; 262.50/month avoidable fuel keeps being spent"
          disposition: ACCEPTABLE
        - id: KOB-RESERVE
          kind: CONFIG_TRIAL
          carrier: "reserve-trial-1 (existing rule: reserve 30 -> 25)"
          forward_replay: {avoidable_fuel_l: 20, soc_0500_below_35_days: 4}
          safeguard: {policy: MG5_DAWN_ADEQUACY, mode: HARD_CONSTRAINT, result: FAIL}
          disposition: REJECTED
          reason: "Removes only 20 L/month and puts dawn battery charge below 35% on 4 of 61 replayed days"
        - id: KOB-STOPSOC
          kind: CONFIG_TRIAL
          carrier: "new rule stop-soc-trial-1 (stop threshold 90 -> 70, reserve unchanged)"
          forward_replay: {avoidable_fuel_l: 210, constrained_candidate_l: 120, soc_0500_below_35_days: 0, added_battery_throughput_kwh: 150}
          safeguards:
            - {policy: MG5_DAWN_ADEQUACY, mode: HARD_CONSTRAINT, result: PASS}
            - {policy: MG4_BATTERY_WEAR, mode: COSTED_TRADEOFF, cost_monthly: 12.00}
            - {policy: WARRANTY_OPERATING_LIMITS, mode: HARD_CONSTRAINT, result: PASS, note: "lowest SOC 30% >= warranty floor 10%"}
          economics: {gross_monthly: 262.50, wear_monthly: 12.00, net_monthly: 250.50, one_off: 90.00, one_off_detail: "vendor remote reconfiguration 60 + 14-day trial supervision 30", net_12m: 2916.00, class: MODELLED}
