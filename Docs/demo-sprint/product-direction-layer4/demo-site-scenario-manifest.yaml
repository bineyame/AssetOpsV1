      occupied_crate_days: [occupied_total_crate_days]
      chargeable_crate_days: [crate_days, contract_crate_days]
      revenue: [revenue]
      cash: [received]
      capacity_to_occupied: [idle_capacity]
      occupied_to_chargeable: {reconciled: ["STORAGE_MOVEMENT (occupied crate-days)", "CHARGE (storage lines)"], absent: ZERO_WHEN_HELD, slice: 9d,
                               note: "October's ledger and invoices agree (revenue = crate-days x rate on every room, both RECORDED), so the leak is a recorded zero; per-batch compatibility explains a difference only once one appears"}
