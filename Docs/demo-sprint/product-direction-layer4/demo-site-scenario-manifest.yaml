      departures_required: [departures_required]
      departures_met: [departures_met]
      required_to_met: [departures_missed]
  deferred_stages:   # a named stage no slice of the fortnight builds: its records, why it is empty, what it blocks, its queued slice and trigger
    usable_capacity:
      vertical: MINI_GRID
      label: "Usable capacity by time window"
      family: READING
      kind: "pv_available_power, pcs_discharge_capability, generator_state (held today, integration-source-to-canonical-design.md §2)"
      cause: NOT_CALCULATED_YET
      words: "Solar, battery and generator readings (already received)"
      blocks: [headroom]
      slice: 4c
      trigger: "pulled from the deferral queue when a lane is free after the must-keep set (day 12); at the latest when a pilot pins a real register profile"
  queued_slices:   # slices declared here, outside plan_model.py's fortnight: each with its scope, units and trigger
    0K4f: {name: "The fuel law and the worlds on v8: the product's fuel law reads v8's curve, the Kobo template and DS2's telemetry writer adopt v8, the demo database is rebuilt, and Kobo's October readings are classified by dispatch-3.3", lane: STR, units: 2, deps: [0K4e, 4d]}   # 0K4m (D-0K4.44): the MODEL_PENDING slice; outside the fortnight (spec §2.4)
    4c: {name: "Capacity by time window: usable capacity and idle capacity as capacity factors (no money), from the kept headroom observer", lane: STR, units: 2.5, deps: [3B3, 0M]}
  record_words:   # plain words for a record kind on screen, where the leaf row gives none
    PLAN_LINE: "Targets below the site total"

snapshot:   # design rev 16.11 §2.8 (OD-23): the calculated daily snapshot every screen reads, and the demo's pending recalculation.
            # A snapshot is an output: rebuilt from records, never a source. `as_of` is when it was computed; a portfolio whose
            # trigger has fired since shows its snapshot figures and says a recalculation is pending, naming what fired.
            # Illustrative demo choices (Architect). The evaluator and independent model do not read this block.
  as_of: "2026-11-06T06:00:00+03:00"       # the daily run after the 5 Nov records closed; every portfolio below unless it says otherwise
  trigger_kinds: {1: "a new day of records", 2: "a record added or corrected", 3: "a target or budget line changed", 4: "a setting changed",
                  5: "a plan version approved or a plan change recorded", 6: "a new version of the structure or a rule"}
  portfolios:
    - {tenant: lakeside-power, as_of: "2026-11-06T06:00:00+03:00", recalculation_pending: false}
