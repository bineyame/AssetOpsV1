      adjustments_kwh:            {family: COMMERCIAL_RECORD, kind: ADJUSTMENT, absent: ZERO_WHEN_HELD, slice: 4a}
      unmapped_kwh:               {family: COMMERCIAL_RECORD, kind: "CUSTOMER_METER_READ (meter register with effective dates)", absent: ZERO_WHEN_HELD, slice: 4a}
      tariff:                     {family: COMMERCIAL_RECORD, kind: TARIFF_SCHEDULE, absent: MISSING, slice: 4b}
      productive_kwh:             {family: COMMERCIAL_RECORD, kind: "CHARGE (productive tariff class)", absent: ZERO_WHEN_HELD, slice: 4b}
      productive_tariff:          {family: COMMERCIAL_RECORD, kind: TARIFF_SCHEDULE, absent: MISSING, slice: 4b}
      in_transit:                 {family: COMMERCIAL_RECORD, kind: SETTLEMENT, absent: ZERO_WHEN_HELD, slice: 4b}
      outstanding:                {family: COMMERCIAL_RECORD, kind: RECEIPT, absent: ZERO_WHEN_HELD, slice: 4b}
      necessary_l:                {family: OBSERVER, kind: "dispatch-3.2 (generator_state, pv_available_power, battery_soc; FUEL_DELIVERY, TANK_DIP)", absent: MISSING, slice: 3B3}
      candidate_l:                {family: OBSERVER, kind: "dispatch-3.2 (generator_state, pv_available_power, battery_soc)", absent: ZERO_WHEN_HELD, slice: 3B3}
      generator_l:                {family: OBSERVER, kind: "model-implied litres (metered generator energy x SFC; FUEL_DELIVERY, TANK_DIP)", absent: MISSING, slice: 3B3}
      unexplained_l:              {family: OBSERVER, kind: "fuel balance (FUEL_DELIVERY, TANK_DIP) minus dispatch-3.2", absent: ZERO_WHEN_HELD, slice: 3B3}
      extra_l:                    {family: OBSERVER, kind: "forward replay (an option's extra running)", absent: OPTION_ONLY, slice: 6c}
      diesel_price:               {family: COMMERCIAL_RECORD, kind: "EXPENSE (FUEL)", absent: MISSING, slice: 4b}
      battery_throughput_kwh:     {family: OBSERVER, kind: "forward replay (throughput an option adds)", absent: OPTION_ONLY, slice: 6c}
      wear_rate:                  {family: DECLARED, kind: battery_wear_rate_assumption, absent: MISSING, slice: 6c}
      om:                         {family: COMMERCIAL_RECORD, kind: "EXPENSE (OM)", absent: MISSING, slice: 4b, words: "Service contractor invoice"}
      staff:                      {family: COMMERCIAL_RECORD, kind: "EXPENSE (STAFF)", absent: MISSING, slice: 4b, words: "Payroll summary"}
      collection_cost:            {family: COMMERCIAL_RECORD, kind: "EXPENSE (an option's collection cost)", absent: OPTION_ONLY, slice: 6g}
      reduced_days:               {family: OPERATIONAL_RECORD, kind: "work case (failure and restore)", absent: ZERO_WHEN_HELD, slice: 3B3}
      hours_per_day:              {family: OPERATIONAL_RECORD, kind: "work case (failure and restore)", absent: ZERO_WHEN_HELD, slice: 3B3}
      major_assets:               {family: DECLARED, kind: asset_register, absent: MISSING, slice: 3B3}
      unserved_critical_kwh:      {family: READING, kind: critical_load_delivered_power, absent: ZERO_WHEN_HELD, slice: 3B3}
      customer_hours_interrupted: {family: READING, kind: "feeder supply-loss flag", absent: ZERO_WHEN_HELD, slice: 3B3}
      field_visits:               {family: OPERATIONAL_RECORD, kind: "work case (field visit)", absent: ZERO_WHEN_HELD, slice: 3B3}
      liability:                  {family: COMMERCIAL_RECORD, kind: "ADJUSTMENT (credit note)", absent: ZERO_WHEN_HELD, slice: 4b}
      period_days:                {family: CALENDAR, kind: period_days, absent: NEVER_EMPTY, slice: 3B1}
      standby_kw:                 {family: DECLARED, kind: "outage units (site configuration)", absent: ZERO_WHEN_HELD, slice: 3B3}
      lost_unit_kw:               {family: DECLARED, kind: "outage units (site configuration)", absent: ZERO_WHEN_HELD, slice: 3B3}
      dawn_days_below:            {family: READING, kind: battery_soc, absent: ZERO_WHEN_HELD, slice: 3B3}
      admission_parts_failed:     {family: OBSERVER, kind: "runs/admission.py over the replay study", absent: OPTION_ONLY, slice: 6c}
    COLD_CHAIN:
      crate_days:                 {family: COMMERCIAL_RECORD, kind: "STORAGE_MOVEMENT (occupied crate-days)", absent: MISSING, slice: 9d}
      rate:                       {family: COMMERCIAL_RECORD, kind: "TARIFF_SCHEDULE (storage rate card)", absent: MISSING, slice: 9d}
      contract_crate_days:        {family: COMMERCIAL_RECORD, kind: "CONTRACT_DOCUMENT (an option's storage contract)", absent: OPTION_ONLY, slice: 9d}
      contract_rate:              {family: COMMERCIAL_RECORD, kind: "CONTRACT_DOCUMENT (an option's storage contract)", absent: OPTION_ONLY, slice: 9d}
      base_kwh:                   {family: DECLARED, kind: energy_model, absent: MISSING, slice: 9d}
      k_kwh_per_crate_day:        {family: DECLARED, kind: energy_model, absent: MISSING, slice: 9d}
      model_factor:               {family: DECLARED, kind: "energy_model (an option's efficiency change)", absent: OPTION_ONLY, slice: 9d}
      excess_kwh:                 {family: OBSERVER, kind: "cold energy normalisation (CHARGE electricity bill, STORAGE_MOVEMENT)", absent: MISSING, slice: 9d}
      elec_price:                 {family: COMMERCIAL_RECORD, kind: "CHARGE (electricity bill)", absent: MISSING, slice: 9d}
      staff:                      {family: COMMERCIAL_RECORD, kind: "EXPENSE (STAFF)", absent: MISSING, slice: 9d, words: "Payroll summary"}
      maint:                      {family: COMMERCIAL_RECORD, kind: "EXPENSE (OM)", absent: MISSING, slice: 9d, words: "Service contractor invoice"}
      liability:                  {family: COMMERCIAL_RECORD, kind: "ADJUSTMENT (credit note)", absent: ZERO_WHEN_HELD, slice: 9d}
      handling:                   {family: COMMERCIAL_RECORD, kind: "EXPENSE (an option's handling cost)", absent: OPTION_ONLY, slice: 9d}
      outstanding:                {family: COMMERCIAL_RECORD, kind: RECEIPT, absent: ZERO_WHEN_HELD, slice: 9d}
      uncovered_nights:           {family: OPERATIONAL_RECORD, kind: "work case (failed start, witnessed test) and the manual-start rota", absent: ZERO_WHEN_HELD, slice: 9d}
      backup_unproven_days:       {family: OPERATIONAL_RECORD, kind: "work case (failed start, witnessed test)", absent: ZERO_WHEN_HELD, slice: 9d}
      excursion_crates:           {family: OBSERVER, kind: "exposure (chamber temperature, STORAGE_MOVEMENT)", absent: ZERO_WHEN_HELD, slice: 9d}
      excursion_days:             {family: OBSERVER, kind: "exposure (chamber temperature, STORAGE_MOVEMENT)", absent: ZERO_WHEN_HELD, slice: 9d}
      batches_exposed:            {family: OBSERVER, kind: "exposure (chamber temperature, STORAGE_MOVEMENT)", absent: ZERO_WHEN_HELD, slice: 9d}
      cooling_minutes_unavailable: {family: READING, kind: "cooling state", absent: ZERO_WHEN_HELD, slice: 9d}
      minutes_per_day:            {family: CALENDAR, kind: minutes_per_day, absent: NEVER_EMPTY, slice: 3B6}
      capacity_crate_days:        {family: DECLARED, kind: "room capacity (site configuration)", absent: MISSING, slice: 3B6}
      period_days:                {family: CALENDAR, kind: period_days, absent: NEVER_EMPTY, slice: 3B6}
    EV_DEPOT_CAPTIVE:
      chargers_in_service:        {family: OBSERVER, kind: "charging capacity (charger register, ev_connector_state, ev_connector_fault)", absent: MISSING, slice: 9e}
      chargers_installed:         {family: DECLARED, kind: "charger register (site configuration)", absent: MISSING, slice: 9e}
      charger_kw:                 {family: DECLARED, kind: "charger register (site configuration)", absent: MISSING, slice: 9e}
      import_limit_kw:            {family: DECLARED, kind: "grid connection (site configuration)", absent: MISSING, slice: 9e}
      window_h:                   {family: COMMERCIAL_RECORD, kind: FLEET_ROSTER, absent: MISSING, slice: 9e}
      buses:                      {family: COMMERCIAL_RECORD, kind: FLEET_ROSTER, absent: MISSING, slice: 9e}
      kwh_per_bus_night:          {family: COMMERCIAL_RECORD, kind: FLEET_ROSTER, absent: MISSING, slice: 9e}
      nights_in_period:           {family: CALENDAR, kind: "period nights", absent: NEVER_EMPTY, slice: 3B6}
      peak_kwh:                   {family: COMMERCIAL_RECORD, kind: "CHARGE (utility time-of-use line)", absent: ZERO_WHEN_HELD, slice: 9e}
      kwh_2200_2400:              {family: COMMERCIAL_RECORD, kind: "CHARGE (utility time-of-use line)", absent: MISSING, slice: 9e}
      kwh_0000_0500:              {family: COMMERCIAL_RECORD, kind: "CHARGE (utility time-of-use line)", absent: ZERO_WHEN_HELD, slice: 9e}
      max_kw:                     {family: COMMERCIAL_RECORD, kind: "CHARGE (utility demand line)", absent: ZERO_WHEN_HELD, slice: 9e}
      peak_price:                 {family: COMMERCIAL_RECORD, kind: TARIFF_SCHEDULE, absent: MISSING, slice: 9e}
      offpeak_price:              {family: COMMERCIAL_RECORD, kind: TARIFF_SCHEDULE, absent: MISSING, slice: 9e}
      night_price:                {family: COMMERCIAL_RECORD, kind: TARIFF_SCHEDULE, absent: MISSING, slice: 9e}
      demand_rate:                {family: COMMERCIAL_RECORD, kind: TARIFF_SCHEDULE, absent: MISSING, slice: 9e}
      maintenance:                {family: COMMERCIAL_RECORD, kind: "EXPENSE (OM)", absent: MISSING, slice: 9e, words: "Service contractor invoice"}
      short_nights:               {family: OBSERVER, kind: "charging capacity (FLEET_ROSTER, ev_connector_state)", absent: MISSING, slice: 9e}
      spare_bus_nights:           {family: COMMERCIAL_RECORD, kind: FLEET_ROSTER, absent: ZERO_WHEN_HELD, slice: 9e}
      covered_bus_nights:         {family: COMMERCIAL_RECORD, kind: "FLEET_ROSTER (an option's cover)", absent: OPTION_ONLY, slice: 9e}
      extra_missed_departures:    {family: COMMERCIAL_RECORD, kind: "DEPARTURE (an option's extra misses)", absent: OPTION_ONLY, slice: 9e}
      charger_out_days:           {family: OPERATIONAL_RECORD, kind: "SERVICE_TICKET (fault and restore)", absent: ZERO_WHEN_HELD, slice: 9e}
      penalty_rate:               {family: DOCUMENT, kind: "CONTRACT_DOCUMENT (service contract penalty term)", absent: ZERO_WHEN_HELD, slice: 9e}
  target_side:   # a leaf with no target line of its own on a Site's target side (structure-specification.md §3.1)
    kind: "PLAN_LINE (a target line per factor)"
    family: COMMERCIAL_RECORD
    slice: 5a
    words: "Targets below the site total"
    assumption: "Target not set below the site total: leaks and avoidable use are taken at zero, and the rest of the target on its main factor (assumption)"
  conditions:   # rights condition evidence (condition_evidence state MISSING, integration-source-to-canonical-design.md §6.3)
    temperature:                 {family: READING, kind: battery_cell_temperature, cause: NOT_CONNECTED, slice: 9a, label: "Battery cell temperature", words: "Battery management system temperature log"}
    commissioning_capacity_test: {family: DOCUMENT, kind: CAPACITY_TEST_REPORT, cause: NOT_RECEIVED, slice: 9a, label: "Commissioning capacity test", words: "Capacity test record"}
    service_1000h:               {family: OPERATIONAL_RECORD, kind: "SERVICE_TICKET (1,000-hour service)", cause: NOT_RECEIVED, slice: 9a, label: "1,000-hour service", words: "Service log entry"}
  assumptions:   # a record field the manifest marks "[assumption]": shown with its assumption label and the record that would confirm it
    tariff.applicability:        {family: COMMERCIAL_RECORD, kind: "TARIFF_SCHEDULE (applicability evidence)", slice: 9e, label: "Tariff applicability", words: "Utility invoice with time-of-use lines", blocks: [energy_cost]}
  chain_nodes:   # every chain_model stage and leak: the nodes or leaves that carry it, a potential entry, a deferred stage, or a reconciled zero
    MINI_GRID:
      usable_capacity: {deferred: usable_capacity}
      delivered_kwh: [delivered_kwh]
      metered_kwh: [metered_kwh]
      billed_kwh: [billed_kwh]
      revenue: [revenue]
      cash: [collected]
      delivered_to_metered: [technical_loss_kwh, unexplained_loss_kwh]
      metered_to_billed: [adjustments_kwh, unmapped_kwh]
      revenue_to_cash: [in_transit, outstanding]
