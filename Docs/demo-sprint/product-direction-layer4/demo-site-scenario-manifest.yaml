home_categories:   # design rev 16.11 §2.0 (OD-21; Architect's calls): the registry row of every node, so each node sits under exactly
                   # one of the four executive headings. A node is NAMED here or it is a gap: no heading is inherited from a parent.
                   # Values: grow | optimize | protect | assure, with the brief's objective (G1-G3, O1-O3, P1-P4, A1-A5); `above` for the
                   # outcome the two money headings explain; `calendar` for a period constant (days, minutes), which is not a factor.
                   # A measure (protect, operations, rights, service_cost_lines) takes the heading of its objective's letter.
                   # The evaluator and independent model do not read this block; check_manifest.py homes() checks it is complete.
  rule: "named, never inherited; a measure's heading is its objective's letter; a money figure is never under Protect or Assure (At stake excepted)"
  nodes:
    MINI_GRID:
      delivered_kwh: [grow, G1]               # value chain: the service delivered, the start of what is sold
      technical_loss_kwh: [optimize, O2]      # rev 16.11: corrected from inherited Grow; energy lost before a meter is throughput lost
      unexplained_loss_kwh: [optimize, O3]    # rev 16.11: corrected from inherited Grow; delivered but not charged, not priced, never called theft
      metered_kwh: [grow, G1]
      adjustments_kwh: [optimize, O3]
      unmapped_kwh: [optimize, O3]
      billed_kwh: [grow, G1]
      tariff: [grow, G1]
      productive_kwh: [grow, G3]
      productive_tariff: [grow, G3]
      revenue: [grow, G1]
      in_transit: [optimize, O3]
      outstanding: [optimize, O3]
      collected: [optimize, O3]               # cash, outside the contribution gap
      necessary_l: [optimize, O1]
      candidate_l: [optimize, O1]
      generator_l: [optimize, O1]
      unexplained_l: [optimize, O1]
      extra_l: [optimize, O1]
      diesel_l: [optimize, O1]                # also the fuel balance (dips and deliveries): the record of the same litres
      diesel_price: [optimize, O1]
      fuel_cost: [optimize, O1]
      battery_throughput_kwh: [optimize, O1]
      wear_rate: [optimize, O1]
      battery_wear: [optimize, O1]
      om: [optimize, O1]
      staff: [optimize, O1]
      collection_cost: [optimize, O1]
      liability: [optimize, O1]               # customer compensation: money, so a cost line, never a Protect measure
      cost_to_serve: [optimize, O1]
      contribution: [above]
      reduced_days: [protect, P2]
      hours_per_day: [protect, P1]
      obligation_hours_without_redundancy: [protect, P1]
      standby_kw: [protect, P1]
      lost_unit_kw: [protect, P1]
      shortfall_backed: [protect, P1]
      obligation_hours_without_backup: [protect, P1]
      dawn_days_below: [protect, P1]
      admission_parts_failed: [protect, P1]
      unserved_critical_kwh: [protect, P1]
      customer_hours_interrupted: [protect, P1]
      asset_days_out_of_service: [protect, P2]
      unclaimable_cover: [protect, P4]
      cover_not_claimable: [protect, P4]
      major_assets: [optimize, O2]            # operations measures (O2): availability, field visits, kWh per visit
      asset_days_total: [optimize, O2]
      asset_days_available: [optimize, O2]
      field_visits: [optimize, O2]
      period_days: [calendar]
    COLD_CHAIN:
      capacity_crate_days: [grow, G2]
      crate_days: [grow, G1]                  # occupied = chargeable crate-days in October
      contract_crate_days: [grow, G3]
      occupied_total_crate_days: [grow, G1]
      rate: [grow, G1]                        # the storage rate: the price of what is sold, like a tariff
      contract_rate: [grow, G3]
      revenue: [grow, G1]
      outstanding: [optimize, O3]
      received: [optimize, O3]
      base_kwh: [optimize, O1]
      k_kwh_per_crate_day: [optimize, O1]
      model_factor: [optimize, O1]
      kwh_model: [optimize, O1]
      excess_kwh: [optimize, O1]
      kwh: [optimize, O1]
      elec_price: [optimize, O1]
      energy: [optimize, O1]
      staff: [optimize, O1]
      maint: [optimize, O1]
      liability: [optimize, O1]               # Thika's customer compensation (credit note): money, so a cost line
      handling: [optimize, O1]
      cost_to_serve: [optimize, O1]
      contribution: [above]
      uncovered_nights: [protect, P1]
      nights_without_backup_cover: [protect, P1]
      backup_unproven_days: [protect, P1]
      days_backup_start_unproven: [protect, P1]
      excursion_crates: [protect, P1]
      excursion_days: [protect, P1]
      batches_exposed: [protect, P1]
      cover_not_claimable: [protect, P4]
      crate_days_without_excursion: [optimize, O2]
      chamber_minutes: [optimize, O2]
      cooling_minutes_unavailable: [optimize, O2]
      cooling_available_minutes: [optimize, O2]
      minutes_per_day: [calendar]
      period_days: [calendar]
    EV_DEPOT_CAPTIVE:
      buses: [grow, G2]                       # the service on chargers already in place (revenue not applicable)
      departures_required: [grow, G2]
      chargers_in_service: [protect, P1]
      charger_kw: [protect, P1]
      import_limit_kw: [protect, P1]
      window_h: [protect, P1]
      deliverable_kwh_night: [protect, P1]    # rev 16.11: Kasarani "Charging energy deliverable per night" (was a gap)
      kwh_per_bus_night: [protect, P1]
      required_kwh_night: [protect, P1]
      supplied_kwh_night: [protect, P1]
      buses_short_per_night: [protect, P1]
      short_nights: [protect, P1]
      spare_bus_nights: [protect, P1]
      covered_bus_nights: [protect, P1]
      extra_missed_departures: [protect, P1]
      departures_missed: [protect, P1]
      nights_below_required: [protect, P1]
      departures_met: [protect, P1]
      charger_out_days: [protect, P2]
      charger_days_out_of_service: [protect, P2]   # rev 16.11: Ruiru "Charger 7, connector 2" (was a gap)
      cover_not_claimable: [protect, P4]
      chargers_installed: [optimize, O2]
      scheduled_kwh_night: [optimize, O2]
      peak_kwh: [optimize, O1]
      kwh_2200_2400: [optimize, O1]
      kwh_0000_0500: [optimize, O1]
      peak_price: [optimize, O1]
      offpeak_price: [optimize, O1]
      night_price: [optimize, O1]
      peak_cost: [optimize, O1]
      offpeak_cost: [optimize, O1]
      night_cost: [optimize, O1]
      max_kw: [optimize, O1]
      demand_rate: [optimize, O1]
      demand_cost: [optimize, O1]
      energy_cost: [optimize, O1]
      maintenance: [optimize, O1]             # EV maintenance (charger service fee): named, no longer inherited
      penalty_rate: [optimize, O1]
      penalties: [optimize, O1]
      cost_to_serve: [optimize, O1]
      cost_per_departure_met: [above]
      contribution: [above]
      nights_in_period: [calendar]
  potential:   # capacity with no customer: shown beside Grow, never as Grow's actual and never added to it (owner, 1 Nov)
    MINI_GRID: [{name: headroom, measure: "usable capacity minus delivered kWh, by time window", objective: G2, deferred: usable_capacity},
                {name: letter_of_intent_demand, measure: "kWh a month a signed letter of intent names (Mto huller)", objective: G3}]
    COLD_CHAIN: [{name: idle_capacity, measure: "capacity_crate_days - occupied_total_crate_days", objective: G2}]
    EV_DEPOT_CAPTIVE: [{name: spare_deliverable_energy, measure: "deliverable_kwh_night - required_kwh_night (Ruiru: 6 more buses fit)", objective: G2}]
  bridge_drivers:   # a bridge row's factor (manifest key `driver`, rule R6) -> its node, whose home it takes
    GENERATOR_RUNNING: generator_l
    UNEXPLAINED_RESIDUAL: unexplained_l
    SOLAR_SHORTFALL_NECESSARY_GEN: generator_l   # 0K4m: necessary running is generator litres (diesel_l reads generator_l; necessary_l is its decomposition)
    EVENING_NECESSARY_GEN: generator_l
    DEMAND_VOLUME: metered_kwh
    METER_MAPPING_UNBILLED: unmapped_kwh
    AUTHORISED_ADJUSTMENT: adjustments_kwh
    OCCUPANCY_REVENUE: crate_days
    OCCUPANCY_ENERGY_VOLUME: kwh_model
    ENERGY_EFFICIENCY: excess_kwh
    CUSTOMER_COMPENSATION: liability
    PEAK_ENERGY_SHARE: peak_kwh
    DEMAND_CHARGE: max_kw
  reconciliation:   # design rev 16.14 §2.0 (20 Nov; UX audit C2; rulings D-RECON.1 to D-RECON.4, specs/RECON-1/rulings.md): one
                    # gap, two cuts. The statement cut reads each bridge row on the statement line its node sits under (revenue or
                    # cost_to_serve; a node under both is read on the line whose own home is the node's heading); the heading cut
                    # reads it under its node's home. Both are the margins of one matrix, line x heading, plus an explicit residual
                    # on its own row. A row on one line whose heading is the other line's is a CROSSING row and is named here; a
                    # screen that shows a line's figure and a heading's figure for one scope shows the crossing as a labelled line.
                    # No figure here: check_manifest.py reconciliation() computes every amount from the bridge and
                    # derived-values.json. The evaluator and the independent model do not read this block.
    rule: "a heading figure is a column of the statement-to-heading matrix and a statement figure a row; where they differ, the crossing is a labelled line on the screen, never left to the reader"
    crossing_label: "Unbilled energy"   # OD-28 (owner, 20 Nov: "use whichever is the industry standard term"); ruling D-L4OPS.9. The UI keeps it in one constant
    crossing_note: "unbilled energy: energy customers used and their meters recorded, not billed (meters not yet mapped to a customer, and authorised adjustments, which are not losses); it lowers revenue on the statement and is counted under Optimize, because recovering it is a billing and settlement task, not selling more"
    crossing:   # driver -> its plain words on screen; each is a revenue-line row homed under Optimize (O3)
      METER_MAPPING_UNBILLED: "meters not yet mapped to a customer"
      AUTHORISED_ADJUSTMENT: "authorised adjustments"
    shared_figures:   # every headline money figure the screens show on more than one route. `reads` is one matrix term, so the
                      # figure is identical wherever it appears. Terms: total, row:<line>, col:<heading>, cross. `routes` lists the routes.
      - {figure: gap, reads: total, words: "Gap to target", routes: [portfolio, portfolio/outcomes-by-site, globalfinancials, sites, "site/*"]}
      - {figure: grow, reads: "col:grow", words: "Grow revenue", routes: [portfolio, portfolio/outcomes-by-site, globalfinancials]}
      - {figure: optimize, reads: "col:optimize", words: "Optimize cost and efficiency", routes: [portfolio, portfolio/outcomes-by-site, globalfinancials]}
      - {figure: revenue_change, reads: "row:revenue", words: "Revenue against target", routes: [portfolio, globalfinancials, "site/*/economics"]}
      - {figure: cost_change, reads: "row:cost_to_serve", words: "Cost to serve against target", routes: [portfolio, globalfinancials, "site/*/economics"]}
      - {figure: metered_not_billed, reads: cross, words: "Unbilled energy", routes: [portfolio, portfolio/outcomes-by-site, globalfinancials, "site/*/economics"]}
    ties:   # two different figures shown for one scope are tied by a stated line: left = right + by, each an effect on the outcome
      - {left: revenue_change, right: grow, by: metered_not_billed}
      - {left: optimize, right: cost_change, by: metered_not_billed}
  findings:   # rev 16.12 (coordinator, after mock-up commit fb13bba7f; design §2.0): EVERY Finding the screens show, origin or linked,
              # names the factor it is pinned to (the most specific factor it observes) and so its own heading. A decision's
              # origin Finding (origin: true) is the one in home_categories.decisions; a linked Finding (origin: false) answers the
              # same decision but keeps its own heading, read from its own factor, never from the decision. An at-limit Finding is
              # pinned to the Protect measure whose limit it reports; a new price to the price factor. check_manifest.py homes():
              # every row has a factor with a registry row (or a potential entry), its heading matches, and each decision has
              # exactly one origin row, equal to its finding_factor. Keyed by `id`; `decision` is the linked decision's route id.
    - {id: kobo-candidate, site: Kobo, decision: kobo-generator, origin: true, factor: candidate_l, heading: optimize}
    - {id: kobo-unexplained-fuel, site: Kobo, decision: kobo-generator, origin: false, factor: unexplained_l, heading: optimize}
    - {id: kobo-battery-evidence, site: Kobo, decision: kobo-battery, origin: true, factor: cover_not_claimable, heading: protect}
    - {id: kisiwa-one-generator, site: Kisiwa, decision: kisiwa-genset, origin: true, factor: obligation_hours_without_redundancy, heading: protect}
    - {id: kisiwa-late-response, site: Kisiwa, decision: kisiwa-om, origin: true, factor: om, heading: optimize}
    - {id: mto-letter-of-intent, site: Mto, decision: mto-demand, origin: true, factor: letter_of_intent_demand, heading: grow}
    - {id: mto-unbilled, site: Mto, decision: mto-billing, origin: true, factor: unmapped_kwh, heading: optimize}
    - {id: mto-inverter-notice, site: Mto, decision: mto-inverter, origin: true, factor: cover_not_claimable, heading: protect}
    - {id: mto-unexplained-loss, site: Mto, decision: mto-losses, origin: true, factor: unexplained_loss_kwh, heading: optimize}
    - {id: mwea-occupancy, site: "Room A · Mwea", decision: mwea-occupancy, origin: true, factor: crate_days, heading: grow}
    - {id: mwea-aggregator, site: "Room A · Mwea", decision: mwea-occupancy, origin: false, factor: contract_crate_days, heading: grow}
    - {id: thika-backup-start, site: "Room B · Thika", decision: thika-backup, origin: true, factor: nights_without_backup_cover, heading: protect}
    - {id: kirinyaga-excess, site: "Room C · Kirinyaga", decision: kirinyaga-energy, origin: true, factor: excess_kwh, heading: optimize}
    - {id: embakasi-peak-share, site: Embakasi, decision: embakasi-schedule, origin: true, factor: peak_kwh, heading: optimize}
    - {id: embakasi-import-limit, site: Embakasi, decision: embakasi-schedule, origin: false, factor: import_limit_kw, heading: protect}
    - {id: embakasi-night-rate, site: Embakasi, decision: embakasi-schedule, origin: false, factor: night_price, heading: optimize}
    - {id: kasarani-charger-down, site: Kasarani, decision: kasarani-charger, origin: true, factor: chargers_in_service, heading: protect}
    - {id: ruiru-route-offer, site: Ruiru, decision: ruiru-expansion, origin: true, factor: spare_deliverable_energy, heading: grow}
    - {id: ruiru-import-limit, site: Ruiru, decision: ruiru-expansion, origin: false, factor: import_limit_kw, heading: protect}
    - {id: ruiru-connector-fault, site: Ruiru, decision: ruiru-connector, origin: true, factor: chargers_in_service, heading: protect}
  residuals:   # rev 16.12 (H known gap): an explicit residual is a registry row like a node, so its heading is never typed in a screen.
               # Only where a leaf is unobserved (design §2.2): Ruiru's target is a stated total (energy + maintenance) with no factor behind it.
    EV_DEPOT_CAPTIVE:
      stated_total_unattributed: [optimize, O1]   # Ruiru: actual cost to serve against a stated-total target, not attributable to a factor
  option_money_factors:   # rev 16.12 (H known gap; owner rule 3): the money factors each valued option changes, so each effect is
                          # placed under its own factor's heading and counted once. Each is a factor the option's `changes` name (or,
                          # for a cover option, the service cost line linked to the Protect measure it moves). check_manifest.py homes().
    KOB-STOPSOC: [generator_l, battery_throughput_kwh]
    KOB-RESERVE: [generator_l, battery_throughput_kwh]
    MTO-HULLER: [productive_kwh, extra_l, collection_cost]
    MTO-WELDING: [delivered_kwh, extra_l]
    KIS-BATT60: [generator_l]                 # the generator litres shifted to the battery (Not available yet: a Kisiwa battery replay, Q7); its one-off is the battery
    MTO-INV-CLAIM: [extra_l]                  # extra fuel at half inverter capacity until the restore; the one-off is its own column
    MTO-INV-BUYNOW: [extra_l]
    MWEA-AGG: [contract_crate_days, contract_rate, handling]
    KIRI-REPAIR: [excess_kwh]
    KIRI-REPLACE: [excess_kwh]
    EMB-DEADLINE: [peak_kwh, kwh_0000_0500, kwh_2200_2400, max_kw]
    KAS-OEM-STOPGAP: [penalties]              # the avoided penalties: Optimize, linked to departures missed (Protect, in its own unit)
    MTO-BILLING: [unmapped_kwh]               # listed beside the plan, not yet valued against no action (O3 data round): its restored charges sit on unmapped meters, Optimize (O3)
  decisions:   # design rev 16.12 §2.0 (owner, 19 Nov, .agent/owner-decision-heading-rule-2026-11-19.md; replaces register call 18's
               # lever-first order): a decision's heading is the home of its ORIGIN FINDING's factor, because that is where the
               # executive met the problem. A Finding is pinned to the factor it observes: the most specific node whose deviation,
               # limit, right or opportunity it reports, never a parent total (so the meter-swap Finding is on unmapped kWh, not on
               # billed kWh). A decision with no Finding behind it (a proactive or capital choice) takes its lever's heading.
               # lever = the factor whose change is the decision's purpose. check_manifest.py homes() checks heading == home of
               # finding_factor (or of lever when finding is null) AND home(lever) == home(finding_factor): a mismatch fails and is
               # ruled by the Architect, never picked silently. A potential entry's home is Grow (shown beside Grow, never its
               # actual). Each option still shows each effect under the home of the factor that effect is on.
               # chooser = the role design §2.4 step 2 names (rev 16.12, the ruling on OD-16): the Site manager for a Site's assets and
               # operations, including an asset's warranty or service remedy; the finance and commercial lead for billing, collection and
               # customer accounts; the executive for capital. Every notice and claim Action is the finance lead's whoever chooses.
               # Keyed by the decision's screen route (#/decision/<id>); plan = the allocator's decision name, where it has one.
    - {id: kobo-generator, site: Kobo, plan: kobo_generator, finding: "Candidate running: the generator runs while solar and the battery could carry the load", finding_factor: candidate_l, lever: generator_l, heading: optimize, chooser: SITE_MANAGER}
    - {id: kobo-battery, site: Kobo, plan: kobo_battery_evidence, finding: "Risk to a right: the battery warranty cannot be claimed without a capacity test and a temperature record", finding_factor: cover_not_claimable, lever: cover_not_claimable, heading: protect, chooser: SITE_MANAGER}
    - {id: kisiwa-genset, site: Kisiwa, plan: kisiwa_genset, finding: "At its limit: the evening supply runs on one generator since generator 1 failed", finding_factor: obligation_hours_without_redundancy, lever: obligation_hours_without_redundancy, heading: protect, chooser: SITE_MANAGER}
    - {id: kisiwa-om, site: Kisiwa, finding: "Late repair response: 96 h against the O&M contract's 48 h, so a fee credit may be due", finding_factor: om, lever: om, heading: optimize, chooser: SITE_MANAGER,
       pin_note: "the response time is contract performance, presented under Assure (A5), which holds no factor; the Finding is pinned to the O&M fee line its remedy would credit (Architect's ruling, rev 16.12)"}
    - {id: mto-demand, site: Mto, plan: mto_demand, finding: "Opportunity: the cooperative's signed letter of intent for a daytime rice huller", finding_factor: letter_of_intent_demand, lever: productive_kwh, heading: grow, chooser: SITE_MANAGER}
    - {id: mto-billing, site: Mto, finding: "Unbilled charges: kWh metered but not billed after the 3 Oct meter swap", finding_factor: unmapped_kwh, lever: unmapped_kwh, heading: optimize, chooser: FINANCE_AND_COMMERCIAL_LEAD}
    - {id: mto-inverter, site: Mto, plan: mto_inverter, finding: "Deadline on a right: inverter 2's warranty notice is due by 27 Nov", finding_factor: cover_not_claimable, lever: cover_not_claimable, heading: protect, chooser: SITE_MANAGER}
    - {id: mto-losses, site: Mto, finding: "Losses beyond expected: kWh delivered but not explained after expected losses", finding_factor: unexplained_loss_kwh, lever: unexplained_loss_kwh, heading: optimize, chooser: SITE_MANAGER}
    - {id: mwea-occupancy, site: "Room A · Mwea", plan: mwea_occupancy, finding: "Off target: occupied crate-days below target", finding_factor: crate_days, lever: contract_crate_days, heading: grow, chooser: SITE_MANAGER}
    - {id: thika-backup, site: "Room B · Thika", plan: thika_backup, finding: "Limit breached: the backup start failed and a batch went above its limit", finding_factor: nights_without_backup_cover, lever: nights_without_backup_cover, heading: protect, chooser: SITE_MANAGER}
    - {id: kirinyaga-energy, site: "Room C · Kirinyaga", plan: kirinyaga_energy, finding: "Off target: electricity above what occupancy explains", finding_factor: excess_kwh, lever: excess_kwh, heading: optimize, chooser: SITE_MANAGER}
    - {id: embakasi-schedule, site: Embakasi, plan: embakasi_schedule, finding: "Off target: the share of charging at peak price", finding_factor: peak_kwh, lever: peak_kwh, heading: optimize, chooser: SITE_MANAGER}
    - {id: kasarani-charger, site: Kasarani, plan: kasarani_charger, finding: "EV interruption: charger 2 down, so deliverable energy is below what the roster needs", finding_factor: chargers_in_service, lever: departures_missed, heading: protect, chooser: SITE_MANAGER}
    - {id: ruiru-expansion, site: Ruiru, plan: ruiru_expansion, finding: "Opportunity: the city offers 6 more buses on a new route", finding_factor: spare_deliverable_energy, lever: buses, heading: grow, chooser: OPERATOR_EXECUTIVE}
    - {id: ruiru-connector, site: Ruiru, finding: "EV interruption: charger 7, connector 2 stopped on a fault on 6 Oct and has reported nothing since", finding_factor: chargers_in_service, lever: charger_days_out_of_service, heading: protect, chooser: SITE_MANAGER}

empty_states:   # rev 16.13 (20 Nov; owner routed the placeholder audit's gaps 1 and 5 and the unknown-as-zero case to the Architect,
                # owner/owner-placeholder-gaps-routing-2026-11-20.md). structure-specification.md §3.1. What fills each leaf, what its
                # absence means, and which slice makes its source reachable, so every "not available yet" names its record and its
                # slice, and no unknown is ever read as zero (rule R4). The product registry (3B1, 3B6) carries `family`, `kind` and
                # `absent` on every leaf; `slice` and `trigger` are pack-only. evaluate_structure.py writes missing-records.json from
                # this block and the records; check_manifest.py empty_states() checks it. Changes no figure.
  # absent: MISSING        - no record means not available; the leaf has no numeric fallback on an observed side
  #         ZERO_WHEN_HELD - zero is a recorded fact only while the source that would record the event is held for the period;
  #                          if that source is not held, the leaf is MISSING (cause NOT_CONNECTED or NOT_RECEIVED)
  #         OPTION_ONLY    - a factor only an option's changes move; observed sides carry its identity value (0, or 1 for a factor)
  #         NEVER_EMPTY    - calendar
  # family: COMMERCIAL_RECORD (integration-source-to-canonical-design.md §6.1 kinds) | READING (role) | OPERATIONAL_RECORD |
  #         OBSERVER (a computed leaf over the named records) | DECLARED (site configuration, price or model) | DOCUMENT | CALENDAR
  # cause:  NOT_RECEIVED | NOT_CONNECTED | NOT_CALCULATED_YET | MODEL_PENDING (0K4m: a computed leaf whose model has not yet run on
  #         this world's records; its slice is 0K4f; the leaf's factor is `unavailable(...)` and its value null with words, never 0)
  leaf_sources:
    MINI_GRID:
      delivered_kwh:              {family: READING, kind: feeder_demand, absent: MISSING, slice: 3B3}
