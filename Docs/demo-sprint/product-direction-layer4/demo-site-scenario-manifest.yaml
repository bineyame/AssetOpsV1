operations:   # design rev 16.16 §2.10 (owner OD-26, 20 Nov: "they should be seamlessly integrated through propoer design not just a patch";
              # rulings D-L4OPS.1 to D-L4OPS.9 in specs/L4-OPS/rulings.md). The asset registry, the rights on each asset or Site, the incidents
              # with their repeats, and the maintenance schedules and records of all 9 Sites, July to October 2026 (and November to 6 Nov
              # where the story runs on). GENERATOR INPUTS AND RECORDS ONLY: the evaluator and the independent model do not read this
              # block, so derived-values.json is unchanged. check_manifest.py operations() checks it (OP1 to OP9) against the rest of the
              # manifest and history.json: the story's dates and assets, asset-days and obligation hours, field visits, the maintenance
              # money leaf of every Site-month, repeats, and scope by Site key. Internal keys (`key`) are never shown on screen.
  as_of: "2026-11-06"
  months: ["2026-07", "2026-08", "2026-09", "2026-10"]
  settings:   # operator settings (D-L4OPS.4): configurable per operator, recorded with who set them; demo defaults
    repeat_window_days: 90          # two incidents on one asset with one failure mode, this close, form a repeat
    repeat_tolerance: 0             # OD-3: the repeat_failures factor's tolerance; 0 raises every repeat
  measures:   # the registry rows slice OPS1 adds (3B1's registry); heading = the objective's (design §2.0 rule "a measure takes its objective's heading")
    - {id: repeat_failures, unit: incidents, objective: P2, heading: protect, target: 0, class: DERIVED,
       basis: "incidents in the period that repeat an earlier incident on the same asset with the same failure mode inside the repeat window"}
    - {id: scheduled_maintenance_share, unit: "% of maintenance work records", objective: O2, heading: optimize, class: DERIVED,
       basis: "scheduled records / all maintenance records in the period (Σ/Σ); a measure, never money"}
    - {id: maintenance_due_overdue, unit: schedules, objective: P2, heading: protect, target: 0, class: DERIVED,
       basis: "calendar schedules due before the period end and not done (outcomes/plan_due.py OVERDUE)"}
  counting: "asset-days and charger-days: each calendar day from out_from to the day before restoration; an open incident counts to the period end; obligation hours: the Site's obligation window on each of those days"
