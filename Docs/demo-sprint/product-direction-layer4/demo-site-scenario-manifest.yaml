        baseline: "14 matched days before change (Sep 29 - Oct 12 class days)"
        after: "14 days after apply"
        operational_target: "candidate generator minutes down on comparable days; the four admission parts hold over the trial against the matched baseline (runs/admission.py)"
        economic: "fuel consumed (dips + deliveries) per delivered kWh, weather-normalised, vs baseline"
        causal: "comparability bands PV +/-10%, load +/-10%; Kisiwa/Mto as non-treated controls"
    entitlement:
