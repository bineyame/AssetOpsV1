  - "portfolio: sum(site variance) == portfolio.variance"
  - "mini: revenue == billed_kwh x tariff; diesel_cost == diesel_l x price"
  - "mini: collected + in_transit + outstanding == revenue"
  - "cold: revenue == crate_days x 0.20; kwh_model == 1550 + 0.25 x crate_days"
  - "ev: energy_cost == peak_cost + offpeak_cost + demand_cost"
  - "allocation spend == sum(spend_breakdown) <= budget"
