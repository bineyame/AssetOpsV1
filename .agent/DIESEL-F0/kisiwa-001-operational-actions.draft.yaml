# Kisiwa operational-action log, DRAFT (DIESEL-1 §8.2a OA-1, §8.3 declared world).
# DEMONSTRATION values, fixed before the F0 probe ran; never tuned.
# Lab-private: the product never reads this file. K0 promotes it verbatim to
# config/operational-actions/kisiwa-001-v1.yaml.
#
# Each action is an operator's (or an unidentified person's) act. Its effects are derived from the action and are
# never authored separately:
#   FUEL_DELIVERY            -> INCREASE on fuel-tank-volume@fuel-tank at `at` (POINT); product record FUEL_DELIVERY
#                               (ticket volume and reference), recorded `recorded_after_minutes` later.
#   FUEL_REMOVAL_UNRECORDED  -> DECREASE on fuel-tank-volume@fuel-tank over [at, at + duration_minutes) (WINDOW);
#                               `sensor_disconnected` makes fuel-level-reporting-availability@fuel-tank unavailable
#                               over its span (the person unplugs the sensor). No product record.
#   TANK_DIP                 -> no physical effect; product record TANK_DIP whose value is the run's tank stock at
#                               `at`, rounded half-even to 1 L, read after the run. Never typed here.
#   TANK_SEALED, SENSOR_POWER_PROTECTED -> no physical effect in v1; recorded as a Work SITE_VISIT record.
#
# Times are UTC instants (Kisiwa is Africa/Dar_es_Salaam, UTC+3); the local time is in each comment.
