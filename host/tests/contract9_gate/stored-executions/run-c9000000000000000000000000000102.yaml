  statement: 'The fuel level sensor publishes the tank''s stored volume every fifteen
    minutes, reading half a litre low, and one sample in twenty-five does not arrive.
    The bias is the instrument''s and not the installation''s: the tank holds what
    it holds, and this is what the sensor says about it. The dropout is the path''s,
    and which samples it takes is drawn from the run''s seed - so it is reproducible
    without being chosen.'
- device_id: generator-controller
  signal_id: ac-power
  address: generator-output-power@generator
  state_key: generator-output-power
  reading_class: INTERVAL_SIGNAL
  canonical_unit: kW
  cadence_minutes: 60
  bias: '0'
  dropout_per_thousand: 0
  statement: 'The generator controller publishes its average output over the span
    that just ended, once an hour, with no measurement error and losing no sample.
    An hourly publication of a fifteen-minute span is what the two numbers mean: the
    cadence is when it speaks and the run''s timestep is what it speaks about. It
    is clean on purpose, so that a reader comparing it against the fuel sensor beside
    it can see that a bias and a dropout are properties of one reporting path rather
    than of the run.'
