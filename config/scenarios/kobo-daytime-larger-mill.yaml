# Shipped scenario (T024). A Kobo-like daytime operating story, run against a
# Site created from the kobo-mini-grid-60kw template with site ID KOBO-001.
#
# Set a run up with the daytime-mini-grid model profile, an interval of 720
# minutes (twelve hours: 06:00 to 18:00 local time is the intended reading)
# and a 15-minute timestep. Every window below is two hours long.
#
# This document declares only the story: irradiance, each load's demand and
# the battery's state of charge at run start. The physical values the
# model's laws need - PV rating, inverter limit, battery capacity, PCS limits
# and efficiency, the baseline reserve - and the source and critical-load
# priorities are the Site's, which the model profile declares it needs
# (Option C). No number here is one of them.
#
# The numbers are demonstration values proposed by the T024 Implementer for
# the owner's hands-on review, not a recommendation for any real site.
scenario_id: kobo-daytime-larger-mill
display_name: Kobo daytime (larger mill)
purpose: >-
  The sunny reference with a larger productive load: the mill runs a second machine from 08:00 to 16:00. The residential feeder and the clinic keep exactly the demand they have in the reference; only the mill's own profile changes.

version:
  scenario_version: 1
  version_valid_from: '2026-09-29T00:00:00Z'
  supersedes: null

target_site:
  policy: DECLARED_SITE
  site_id: KOBO-001
  template_id: null
  requirement: >-
    A mini-grid created from the kobo-mini-grid-60kw template: one PV array
    behind one inverter, one battery behind one PCS, and three addressed loads
    - load-res, load-clinic and load-mill - with typed source-priority and
    critical-load-priority Site Controls.

# No observation source is declared: nothing in this story is a reading the
# scenario states. What devices report is the publication profile's.
observation_sources: []

public_parameters:
  # The battery's state of charge at run start, stated explicitly. It is never
  # inferred from the reserve or the capacity; a scenario that leaves it out
  # leaves the run BLOCKED.
  - parameter_id: starting-state-of-charge
    display_name: Battery state of charge at the start of the interval
    value: 55
    unit: "%"
    execution_role: CAUSAL_INPUT
    state_key: battery-state-of-charge@battery
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true

timeline:
