# Shipped scenario (T026): the degraded-evidence world. The causes and run-start
# states of kobo-mini-grid-prolonged, plus one operator override of the
# generator's stop threshold, and three reporting-path conditions that change
# what is PUBLISHED and nothing that happens:
#
# - a gap: the battery's discharge-capability path carries no readings for an
#   hour (no capability is substituted for the missing readings);
# - a delay: one state-of-charge publication is held ten minutes, until its
#   declared window ends (its value and source time are unchanged; only its
#   publication time moves);
# - a missing record: the override command's record never reaches the gateway.
#   The override still holds in the world - its absence says "none observed",
#   never "none commanded".
#
# Set a run up with the mini-grid model profile VERSION 3 and publication
# profile VERSION 5, an interval of 480 minutes (06:00 to 14:00 local time)
# and a 5-minute timestep, against a Site created from kobo-mini-grid-60kw
# version 3, chosen at run setup. Under an earlier publication profile the run
# is BLOCKED naming that profile, which cannot model these conditions.
#
# Demonstration values proposed by the T026 Implementer for the owner's
# hands-on review, not a recommendation for any real site.
scenario_id: kobo-mini-grid-degraded-evidence
display_name: Kobo mini-grid (degraded evidence)
purpose: >-
  The prolonged-runtime world with an operator override of the generator stop threshold to 60 % from 08:00 to 12:00, observed through an imperfect reporting path: the battery's discharge capability goes unreported for an hour, one state-of-charge publication arrives ten minutes late, and the override command's record is never published. The world and every controller decision are those the causes and the override determine; only what the evidence shows differs.

version:
  # T026: a new scenario, so version 1 with nothing to supersede.
  scenario_version: 1
  version_valid_from: '2026-10-02T00:00:00Z'

# What a site must honour for this scenario, in prose. Never evaluated:
# run setup checks the chosen site against the document and the chosen
# model profile, and the site is chosen there, not here.
site_contract:
  description: >-
    A mini-grid created from the kobo-mini-grid-60kw template: one PV array
    behind one inverter, one battery behind one PCS, one generator on the bus
    fed by one fuel tank, and three addressed loads - load-res, load-clinic
    and load-mill - with typed source-priority and critical-load-priority Site
    Controls and the generator's start/stop policy on the Foundation.

observation_sources: []

public_parameters:
  # The battery's state of charge at run start, stated explicitly.
  - parameter_id: starting-state-of-charge
    display_name: Battery state of charge at the start of the interval
    value: 40
    unit: "%"
    execution_role: CAUSAL_INPUT
    state_key: battery-state-of-charge@battery
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true
  # The fuel in the tank at run start. Scenario-owned physical state.
  - parameter_id: starting-fuel
    display_name: Fuel in the tank at the start of the interval
    value: 300
    unit: L
    execution_role: CAUSAL_INPUT
    state_key: fuel-tank-volume@fuel-tank
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true
  # The generator's lifecycle state at run start: a typed member, not a
  # number. STOPPED or FAILED only.
  - parameter_id: starting-generator-state
    display_name: Generator state at the start of the interval
    value: STOPPED
    unit: state
    execution_role: CAUSAL_INPUT
    state_key: generator-state@generator
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true

