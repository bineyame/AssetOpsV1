          owner: SCENARIO_INPUT
          initializes: false
  # The one operator command: the generator stop threshold to 60 % on
  # [08:00, 12:00), step-aligned. Outside it the Foundation baseline applies.
  - event_id: stop-threshold-override
    sequence: 11
    offset_minutes: 120
    entry_kind: EVENT
    category: EQUIPMENT
    description: >-
      From 08:00 to 12:00 an operator overrides the generator stop threshold to 60 %. The Foundation baseline applies again when the window ends.
    execution_role: FORCING_INPUT
    state_key: generator-stop-soc-threshold@generator
    execution_requirement: REQUIRED
    # The scenario says an operator issued this change; a publication profile
    # that records commands then publishes it (T026 C1).
    issued_by: OPERATOR
    timing:
      shape: WINDOW
      duration_minutes: 240
    parameters:
      - parameter_id: stop-threshold-level
        display_name: Generator stop threshold while the override holds
        value: 60
        unit: "%"
        execution_role: FORCING_INPUT
        state_key: generator-stop-soc-threshold@generator
        execution_requirement: REQUIRED
        ownership:
          owner: SCENARIO_INPUT
          initializes: false
  # The override's record is never published: a missing record, not a
  # missing override.
  - event_id: override-record-missing
    sequence: 12
    offset_minutes: 120
    entry_kind: EVENT
    category: DATA_QUALITY
    description: >-
      The record of the 08:00 override command does not reach the gateway.
    execution_role: FORCING_INPUT
    state_key: override-record-reporting-availability@generator
    execution_requirement: REQUIRED
    timing:
      shape: POINT
  # One reporting gap: the discharge-capability path is down for an hour.
  - event_id: discharge-capability-gap
    sequence: 13
    offset_minutes: 180
    entry_kind: EVENT
    category: DATA_QUALITY
    description: >-
      The battery's discharge-capability readings are not carried from 09:00 to 10:00.
    execution_role: FORCING_INPUT
    state_key: battery-discharge-capability-reporting-availability@battery-pcs
    execution_requirement: REQUIRED
    timing:
      shape: WINDOW
      duration_minutes: 60
  # One delayed publication: the 10:00 state-of-charge sample is held until
  # the window ends, ten minutes later. The hold is the entry's own window, and
  # shorter than the 15-minute cadence, so it holds exactly one publication.
  - event_id: soc-publication-delay
    sequence: 14
    offset_minutes: 240
    entry_kind: EVENT
    category: DATA_QUALITY
    description: >-
      The 10:00 state-of-charge publication is held until 10:10.
    execution_role: FORCING_INPUT
    state_key: battery-soc-publication-delay@battery
    execution_requirement: REQUIRED
    timing:
      shape: WINDOW
      duration_minutes: 10
