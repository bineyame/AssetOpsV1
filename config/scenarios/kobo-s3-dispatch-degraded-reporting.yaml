# Shipped scenario (S3-01 phase 1, s3-dispatch-cases-v1): degraded reporting on
# the registered path. The causes and run-start states of
# kobo-mini-grid-prolonged, observed through two reporting-path conditions that
# change what is PUBLISHED and nothing that happens:
#
# - a gap: the PCS discharge-capability path carries no readings for an hour
#   (no capability is substituted for the missing readings);
# - a delay: one state-of-charge publication is held ten minutes, until its
#   declared window ends (its value and source time are unchanged; only its
#   publication time moves), so it arrives after later readings.
#
# Unlike kobo-mini-grid-degraded-evidence it carries NO operator override and
# no override record: a registered run publishes SourceEnvelope V3
# measurements only, and no S2 V3 command record exists.
#
# Set a run up with the mini-grid model profile VERSION 3 and publication
# profile registered-kobo-publication VERSION 3, an interval of 480 minutes
# and a 5-minute timestep, against the registered KOBO-001 after its S3-01
# simulated demo configuration. Simulated demonstration values, not a
# recommendation for any real site.
scenario_id: kobo-s3-dispatch-degraded-reporting
display_name: Kobo mini-grid (S3 dispatch, degraded reporting)
purpose: >-
  The prolonged-runtime world observed through an imperfect registered reporting path: the PCS discharge capability goes unreported for an hour and one state-of-charge publication arrives ten minutes late. The world and every controller decision are those the causes determine; only what the evidence shows differs.

version:
  scenario_version: 1
  version_valid_from: '2026-10-01T00:00:00Z'
# What a site must honour for this scenario, in prose. Never evaluated:
# run setup checks the chosen site against the document and the chosen
# model profile, and the site is chosen there, not here.
site_contract:
  description: >-
    A mini-grid created from the kobo-mini-grid-60kw template: one PV array
    behind one inverter, one battery behind one PCS, one generator on the bus
    fed by one fuel tank, and three addressed loads - load-res, load-clinic
    and load-mill - with typed source-priority and critical-load-priority Site
    Controls and the generator's start/stop policy on the Foundation.

observation_sources: []

public_parameters:
  # The battery's state of charge at run start, stated explicitly.
  - parameter_id: starting-state-of-charge
    display_name: Battery state of charge at the start of the interval
    value: 40
    unit: "%"
    execution_role: CAUSAL_INPUT
    state_key: battery-state-of-charge@battery
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true
  # The fuel in the tank at run start. Scenario-owned physical state.
  - parameter_id: starting-fuel
    display_name: Fuel in the tank at the start of the interval
    value: 300
    unit: L
    execution_role: CAUSAL_INPUT
    state_key: fuel-tank-volume@fuel-tank
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true
  # The generator's lifecycle state at run start: a typed member, not a
  # number. STOPPED or FAILED only.
  - parameter_id: starting-generator-state
    display_name: Generator state at the start of the interval
    value: STOPPED
    unit: state
    execution_role: CAUSAL_INPUT
    state_key: generator-state@generator
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true

