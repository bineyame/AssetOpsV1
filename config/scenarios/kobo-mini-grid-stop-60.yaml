  # The one policy change: an absolute replacement of the Site's stop
  # threshold on [start, end). Outside its window the Foundation baseline
  # (90 %) applies. A generator-policy window must start and end on the run's
  # step boundaries.
  - event_id: stop-threshold-override
    sequence: 11
    offset_minutes: 0
    entry_kind: EVENT
    category: EQUIPMENT
    description: >-
      From 06:00 to 14:00 the generator stop threshold is overridden to 60 %. The Foundation baseline applies again when the window ends.
    execution_role: FORCING_INPUT
    state_key: generator-stop-soc-threshold@generator
    execution_requirement: REQUIRED
    timing:
      shape: WINDOW
      duration_minutes: 480
    parameters:
