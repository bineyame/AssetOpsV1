# Shipped scenario (T025b): the changed-policy counterpart of
# kobo-mini-grid-prolonged. Identical causes and run-start states; the only
# difference is a scenario override of the generator's stop threshold, frozen
# separately. It is a scenario event over the Site's baseline, not an edit of
# the Foundation and not operator evidence. Same story, a full-site mini-grid
# through a dark, loaded morning into a sunny midday,
# run against a Site created from the kobo-mini-grid-60kw template with site
# ID KOBO-001.
#
# Set a run up with the mini-grid model profile VERSION 2, an interval of 480
# minutes (06:00 to 14:00 local time is the intended reading) and a 5-minute
# timestep: the generator's start delay, minimum runtime and any
# generator-policy override window move at step boundaries only, so the step
# must divide them.
#
# This document declares only causes: irradiance, each load's demand, and the
# three run-start states - the battery's state of charge, the fuel in the tank
# and the generator's lifecycle state. It never authors generator output, a
# generator state change or a conclusion about whether the runtime was
# avoidable: what the generator does follows from the Site's frozen policy
# (start 35 %, stop 90 %, minimum runtime 30 min, start delay 5 min, 40 kW,
# 0.3 L/kWh, tank 400 L) and the physics.
#
# The numbers are demonstration values proposed by the T025b Implementer for
# the owner's hands-on review, not a recommendation for any real site.
scenario_id: kobo-mini-grid-stop-60
display_name: Kobo mini-grid (stop threshold 60 %)
purpose: >-
  The same causes as the prolonged-runtime recipe, with the generator stop threshold overridden to 60 % for the whole interval. The generator is requested at the same start threshold, but the Site policy now permits a stop once it has run its minimum runtime and the state of charge reaches 60 %, so it runs for less time, delivers less energy and burns less fuel while PV charges the rest. Lower runtime here is a consequence of a different policy, not a claim that the policy is better.

version:
  scenario_version: 1
  version_valid_from: '2026-09-29T00:00:00Z'
  supersedes: null

target_site:
  policy: DECLARED_SITE
  site_id: KOBO-001
  template_id: null
  requirement: >-
    A mini-grid created from the kobo-mini-grid-60kw template: one PV array
    behind one inverter, one battery behind one PCS, one generator on the bus
    fed by one fuel tank, and three addressed loads - load-res, load-clinic
    and load-mill - with typed source-priority and critical-load-priority Site
    Controls and the generator's start/stop policy on the Foundation.

observation_sources: []

public_parameters:
  # The battery's state of charge at run start, stated explicitly.
  - parameter_id: starting-state-of-charge
    display_name: Battery state of charge at the start of the interval
    value: 40
    unit: "%"
    execution_role: CAUSAL_INPUT
    state_key: battery-state-of-charge@battery
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true
  # The fuel in the tank at run start. Scenario-owned physical state.
  - parameter_id: starting-fuel
    display_name: Fuel in the tank at the start of the interval
    value: 300
    unit: L
    execution_role: CAUSAL_INPUT
    state_key: fuel-tank-volume@fuel-tank
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true
  # The generator's lifecycle state at run start: a typed member, not a
  # number. STOPPED or FAILED only.
  - parameter_id: starting-generator-state
    display_name: Generator state at the start of the interval
    value: STOPPED
    unit: state
    execution_role: CAUSAL_INPUT
    state_key: generator-state@generator
    execution_requirement: REQUIRED
    ownership:
      owner: SCENARIO_INPUT
      initializes: true

