# CH-1b event register (design §5.2 A0, AG-7; build sheet CH-1b §2). Reviewed as code; read by
# backend/assetops_backend/chain/adapters/file_chain_config.py and validated by chain/events.py.
#
# events: outbox event type@version -> the Site-local days and the measures it dirties (resolved in the consumer,
#   never in SQL). `consumer` defaults to snapshots for an event with days, and to none for days: none.
# inputs: measure -> what dirties it (mirrors chain/measures.py; CH-8 merges it into the catalogue).
# OL-1 (plan §2.4): this register names measures only, never outcomes.
register_version: 1
events:
  reading.accepted@1:     {days: span_local,   measures: by_role}
  assessment.revised@1:   {days: windows_local, measures: by_analytic}
  job.changed@1:          {days: window_local, measures: by_job_domain}
  price.revised@1:        {days: valid_local,  measures: by_assumption_key}
  foundation.revised@1:   {days: from_valid_local_to_today, measures: all_of_site}
  objective.revised@1:    {days: none}
  finding.revised@1:      {days: none, consumer: threads}
  opportunity.revised@1:  {days: none, consumer: threads}
  action.event@1:         {days: none, consumer: [threads, lifecycle]}
  verification.outcome@1: {days: none, consumer: lifecycle}
  backfill.site@1:        {days: none}
inputs:
  productive_kwh:     {roles: [feeder_demand], assumption_keys: [productive_use_price_per_kwh], foundation: true}
  avoidable_gen_min:  {analytics: [dispatch], job_domains: [dispatch]}
  daylight_headroom_kw: {roles: [pv_available_power], mini_depth: [renewable], job_domains: [mini_renewable]}  # CH-9: daylight is measured from pv_available_power
  critical_served:    {mini_depth: [service], job_domains: [mini_service]}  # CH-9 R9: the stored hourly service heads
  chamber_temp_c:     {roles: [chamber_temperature], analytics: [cold-excursion], job_domains: [cold_chain]}
  backup_start_chain: {roles: [grid_power_event, generator_state, transfer_result, backup_bus_state], analytics: [cold-start-response], job_domains: [cold_chain]}
  charging_kwh:       {analytics: [ev-session/1], assumption_keys: [ev_gross_tariff_per_kwh], job_domains: [ev_charging]}
# ANY-1 AR-1: stored read-period kinds (`site_period_read`, migration 0059), dirtied like measures through the same
# snapshot_dirty queue: kind '<area>.<name>' -> {grain: hour | s3_day | local_day, site_types: [...], inputs: {the
# measure input keys}}. A kind is declared with its builder (AR-2 to AR-4).
# AR-2 (mini_depth/period_rows.py): the board's mini depth. Every mini input role (mini_depth/inputs.py QUERY_ROLES;
# an hour's `_cutoff_sha` digests them, renewable's daylight hours read pv_available_power), its own selection and
# job domain, and Foundation dirty it. Renewable is a Site-local day row of hours; the hourly domains store the hour
# the board reads.
# AR-4 (estate/period_rows.py): the Portfolio's mini-grid Evidence claim day (a UTC S3 day; stored with its own date,
# rebuilt from every Site-local day it touches). The selected window revision comes from the S3 dispatch analytic and
# its jobs, as for avoidable_gen_min.
# AR-4 MN-2 (estate/money_rows.py): the Site-local day's potential money line with its receipt. price.revised@1
# (by_assumption_key; valid_local runs an open revision from its valid date to the Site's today) rebuilds it, so a
# saved price (PR-3) restates every day from its applies-from date; the study's renewable inputs dirty it as for
# daylight_headroom_kw.
kinds:
  evidence.claim: {grain: s3_day, site_types: [MINIGRID], inputs: {analytics: [dispatch], job_domains: [dispatch]}}
  money.lines: {grain: local_day, site_types: [MINIGRID], inputs: {assumption_keys: [productive_use_price_per_kwh], roles: [pv_available_power], mini_depth: [renewable], job_domains: [mini_renewable]}}
  mini_depth.renewable: {grain: local_day, site_types: [MINIGRID], inputs: {roles: &mini_roles [generator_state, generator_power, feeder_demand, battery_soc, pv_power, pv_irradiance, battery_power, fuel_level, pv_available_power, pcs_discharge_capability, critical_load_requested_power, critical_load_delivered_power, storage_charge_requested_power, feeder_requested_power, site_supply_state, mini_backup_start_event, mini_backup_bus_state], mini_depth: [renewable], job_domains: [mini_renewable], foundation: true}}
  mini_depth.fuel:      {grain: hour, site_types: [MINIGRID], inputs: {roles: *mini_roles, mini_depth: [fuel], job_domains: [mini_fuel], foundation: true}}
  mini_depth.service:   {grain: hour, site_types: [MINIGRID], inputs: {roles: *mini_roles, mini_depth: [service], job_domains: [mini_service], foundation: true}}
  mini_depth.backup:    {grain: hour, site_types: [MINIGRID], inputs: {roles: *mini_roles, mini_depth: [backup], job_domains: [mini_backup], foundation: true}}
